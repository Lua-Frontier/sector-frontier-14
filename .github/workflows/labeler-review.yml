name: "Labels: Approved"

on:
  pull_request_review:
    types: [submitted]

permissions:
  pull-requests: write

jobs:
  add_label:
    if: github.event.review.state == 'approved'
    runs-on: ubuntu-latest
    steps:
      - name: Add approved label
        uses: actions-ecosystem/action-add-labels@v1
        with:
          labels: APPROVED
          GITHUB_TOKEN: ${{ GITHUB.TOKEN }}
