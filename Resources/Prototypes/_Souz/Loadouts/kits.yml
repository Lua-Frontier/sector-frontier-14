# Forced role kits (weapons / flash / paperwork) — formerly StartingGear equipment/storage

#region Eyes / gloves (missing from clothing loadouts)

- type: loadout
  id: UsspLoadoutEyesSunglasses
  equipment:
    eyes: USSPSFClothingEyesGlassesSunglasses

- type: loadoutGroup
  id: UsspCaptainEyes
  name: loadout-group-contractor-glasses
  loadouts:
  - UsspLoadoutEyesSunglasses
  - UsspLoadoutEyesHudCaptain
  fallbacks:
  - UsspLoadoutEyesSunglasses

- type: loadout
  id: UsspLoadoutGlovesCaptain
  equipment:
    gloves: USSPSFClothingHandsGlovesCaptain

- type: loadoutGroup
  id: UsspCaptainGloves
  name: loadout-group-contractor-gloves
  loadouts:
  - UsspLoadoutGlovesCaptain
  - UsspLoadoutGlovesCaptainWhite
  - UsspLoadoutGlovesCaptainBlack
  fallbacks:
  - UsspLoadoutGlovesCaptain

- type: loadoutGroup
  id: UsspPolitrukEyes
  name: loadout-group-contractor-glasses
  hidden: true
  loadouts:
  - UsspLoadoutEyesSecurity
  fallbacks:
  - UsspLoadoutEyesSecurity

- type: loadoutGroup
  id: UsspPolitrukGloves
  name: loadout-group-contractor-gloves
  hidden: true
  loadouts:
  - UsspLoadoutGlovesBlack
  fallbacks:
  - UsspLoadoutGlovesBlack

#endregion

