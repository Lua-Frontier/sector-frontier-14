# source: Entities/Clothing/Hands/gloves.yml
- type: entity
  parent: [ClothingHandsBase, BaseCommandContraband]
  id: USSPSFClothingHandsGlovesCaptain
  categories: [ USSP ]
  suffix: USSP
  name: captain gloves
  description: Regal blue gloves, with a nice gold trim. Swanky.
  components:
  - type: Sprite
    sprite: _Souz/Clothing/Hands/Gloves/captain.rsi
  - type: Clothing
    sprite: _Souz/Clothing/Hands/Gloves/captain.rsi
  - type: Insulated
  - type: Fiber
    fiberMaterial: fibers-durathread
    fiberColor: fibers-regal-blue
  - type: FingerprintMask
# DS14-start 
  - type: PhysicalComposition
    materialComposition:
      Durathread: 10
      Plasteel: 10
  - type: MeleeWeapon
    hidden: true
    attackRate: 1.5
    damage:
      types:
       Blunt: 7
    soundHit:
      collection: Punch
    animation: WeaponArcFist
    mustBeEquippedToUse: true
# DS14-end
- type: entity
  parent: [USSPSFClothingHandsGlovesColorBlack, BaseC2ContrabandEngineeringUnredeemable]
  id: USSPSFClothingHandsGlovesCombat
  categories: [ USSP ]
  suffix: USSP
  name: combat gloves
  description: These tactical gloves are fireproof and shock resistant.
  components:
  - type: Sprite
    sprite: _Souz/Clothing/Hands/Gloves/combat.rsi
  - type: Clothing
    sprite: _Souz/Clothing/Hands/Gloves/combat.rsi
  - type: Insulated
  - type: Fiber
    fiberMaterial: fibers-insulative
    fiberColor: fibers-black

# can't parent combat gloves since they are butcherable

