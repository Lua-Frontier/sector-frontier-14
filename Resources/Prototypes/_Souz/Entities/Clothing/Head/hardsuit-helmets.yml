# source: Entities/Clothing/Head/hardsuit-helmets.yml
- type: entity
  parent: [ClothingHeadHardsuitBase, ClothingHeadSuitWithLightBase]
  id: USSPSFClothingHeadHelmetHardsuitSecurity
  categories: [ USSP ]
  suffix: USSP
  name: security hardsuit helmet
  description: Armored hardsuit helmet for security needs.
  components:
  - type: Sprite
    sprite: _Souz/Clothing/Head/Hardsuits/security.rsi
  - type: Clothing
    sprite: _Souz/Clothing/Head/Hardsuits/security.rsi
  - type: PointLight #DS-14
    color: '#fce883' #DS14-soyuz
    radius: 6 
    energy: 3
  - type: PressureProtection
    highPressureMultiplier: 0.525
    lowPressureMultiplier: 1000
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.9
        Slash: 0.9
        Piercing: 0.9
        Heat: 0.9
  - type: Tag
    tags:
    - CorgiWearable
    - WhitelistChameleon

#Brigmedic Hardsuit
- type: entity
  parent: [ClothingHeadHardsuitBase, ClothingHeadSuitWithLightBase]
  id: USSPSFClothingHeadHelmetHardsuitBrigmedic
  categories: [ USSP ]
  suffix: USSP
  name: brigmedic hardsuit helmet
  description: The lightweight helmet of the brigmedic hardsuit. Protects against viruses, and clowns.
  components:
  - type: Sprite
    sprite: _Souz/Clothing/Head/Hardsuits/brigmedic.rsi
    #DS14-Soyuz-start
    layers:
    - state: icon
    - state: icon-unshaded
      shader: unshaded
    - state: light-overlay
      visible: false
      shader: unshaded
      map: [ "light" ]
  - type: HandheldLight
    addPrefix: false
  - type: ToggleableVisuals
    spriteLayer: light
    clothingVisuals:
      head:
      - state: equipped-head-light
        shader: unshaded
      head-vulpkanin:
      - state: equipped-head-light-vulpkanin
        shader: unshaded
      head-reptilian:
      - state: equipped-head-light-reptilian
        shader: unshaded
  - type: Clothing
    clothingVisuals:
      head:
      - state: equipped-head
      - state: equipped-head-unshaded
        shader: unshaded
      head-vulpkanin:
      - state: equipped-head-vulpkanin
      - state: equipped-head-unshaded-vulpkanin
        shader: unshaded
      head-reptilian:
      - state: equipped-head-reptilian
      - state: equipped-head-unshaded-reptilian
        shader: unshaded
        #DS14-Soyuz-end
  - type: PointLight #DS-14
    color: '#9a151e' #DS14-soyuz
    radius: 6
    energy: 3
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.95
        Slash: 0.95
        Piercing: 0.95
        Heat: 0.95
        Radiation: 0.90
        Caustic: 0.90
  - type: PressureProtection
    highPressureMultiplier: 0.6
    lowPressureMultiplier: 1000

