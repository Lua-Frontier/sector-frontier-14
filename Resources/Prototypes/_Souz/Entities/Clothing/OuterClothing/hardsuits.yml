# source: Entities/Clothing/OuterClothing/hardsuits.yml
- type: entity
  parent: [ClothingOuterHardsuitBase, BaseC2ContrabandUnredeemable]
  id: USSPSFClothingOuterHardsuitSecurity
  categories: [ USSP ]
  suffix: USSP
  name: security hardsuit
  description: A special suit that protects against hazardous, low pressure environments. Has an additional layer of armor.
  components:
  - type: Sprite
    sprite: _Souz/Clothing/OuterClothing/Hardsuits/security.rsi
  - type: Clothing
    sprite: _Souz/Clothing/OuterClothing/Hardsuits/security.rsi
  - type: PressureProtection
    highPressureMultiplier: 0.5
    lowPressureMultiplier: 1000
  - type: ExplosionResistance
    damageCoefficient: 0.4
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.6
        Slash: 0.6
        Piercing: 0.6
        Heat: 0.8
        Caustic: 0.7
  - type: StaminaResistance # DS14
    damageCoefficient: 0.6
  - type: ClothingSpeedModifier
    walkModifier: 0.85 # DS14-value
    sprintModifier: 0.85 # DS14-value
  - type: HeldSpeedModifier
  - type: ToggleableClothing
    clothingPrototype: USSPSFClothingHeadHelmetHardsuitSecurity
  - type: Tag
    tags:
    - CorgiWearable
    - Hardsuit
    - WhitelistChameleon
  # DS14-start
  - type: PhysicalComposition
    materialComposition:
      Steel: 200
      Durathread: 300
      Plasteel: 500
      Plastic: 100
  # DS14-end

