# source: Entities/Clothing/OuterClothing/wintercoats.yml
- type: entity
  parent: [ClothingOuterWinterCoatToggleable, BaseCommandContraband]
  id: USSPSFClothingOuterWinterCap
  categories: [ USSP ]
  suffix: USSP
  name: captain's winter coat
  components:
  - type: Sprite
    sprite: _Souz/Clothing/OuterClothing/WinterCoats/coat.rsi
    layers:
    - state: CAP-icon
  - type: Item
    inhandVisuals:
      left:
      - state: CAP-inhand-left
      right:
      - state: CAP-inhand-right
  - type: Clothing
    sprite: _Souz/Clothing/OuterClothing/WinterCoats/coat.rsi
    clothingVisuals:
      outerClothing:
      - state: CAP-equipped-OUTERCLOTHING
  - type: ToggleableClothing
    clothingPrototype: USSPSFClothingHeadHatHoodWinterCaptain
  # DS14-start: CaptainResprite
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.65
        Slash: 0.65
        Piercing: 0.6
        Heat: 0.7
        Caustic: 0.75 # not the full 90% from ss13 because of the head
  # DS14-end
- type: entity
  parent: [ClothingOuterWinterCoatToggleable, BaseCommandContraband]
