# source: Entities/Objects/Tools/access_configurator.yml
- type: entity
  parent: BaseItem
  id: USSPSFAccessConfigurator
  categories: [ USSP ]
  suffix: USSP
  name: access configurator
  description: Used to modify the access level requirements for airlocks and other lockable devices.
  components:
    - type: EmitSoundOnLand
      sound:
        path: /Audio/Items/multitool_drop.ogg
    - type: Sprite
      sprite: Objects/Tools/access_configurator.rsi
      state: icon
    - type: Item
      size: Small
    - type: Clothing
      sprite: Objects/Tools/access_configurator.rsi
      quickEquip: false
      slots:
        - Belt
    - type: AccessOverrider
      accessLevels:
      - USSPCaptain
      - USSPHeadOfPersonnel
      - USSPHeadOfSecurity
      - USSPChiefEngineer
      - USSPResearchDirector
      - USSPChiefMedicalOfficer
      - USSPQuartermaster
      - USSPCommand
      - USSPLawyer
      - USSPArmory
      - USSPDetective
      - USSPBrigmedic
      - USSPSecurity
      - USSPBrig
      - USSPChemistry
      - USSPMedical
      - USSPResearch
      - USSPAtmospherics
      - USSPEngineering
      - USSPSalvage
      - USSPCargo
      - USSPService
      - USSPBar
      - USSPChapel
      - USSPHydroponics
      - USSPJanitor
      - USSPKitchen
      - USSPTheatre
      - USSPMaintenance
      - USSPExternal
      - USSPSOD
      privilegedIdSlot:
        name: id-card-console-privileged-id
        ejectSound: /Audio/Machines/id_swipe.ogg
        insertSound: /Audio/Weapons/Guns/MagIn/batrifle_magin.ogg
        ejectOnBreak: true
        swap: false
        whitelist:
          components:
          - IdCard
      denialSound:
        path: /Audio/Machines/custom_deny.ogg
      doAfter: 0.5
    - type: UserInterface
      interfaces:
        enum.AccessOverriderUiKey.Key:
          type: AccessOverriderBoundUserInterface
    - type: ActivatableUI
      key: enum.AccessOverriderUiKey.Key
      requiresComplex: true
      requireActiveHand: false
      singleUser: true
      inHandsOnly: true
    - type: ItemSlots
    - type: ContainerContainer
      containers:
        AccessOverrider-privilegedId: !type:ContainerSlot
    #DS14-Start
    - type: EmitSoundOnPickup
      sound:
        path: /Audio/_Goobstation/Items/handling/component_pickup.ogg
    - type: EmitSoundOnDrop
      sound:
        path: /Audio/_Goobstation/Items/handling/component_drop.ogg
    #DS14-End
