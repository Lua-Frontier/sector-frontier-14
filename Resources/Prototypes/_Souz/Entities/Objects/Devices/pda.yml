- type: entity

  parent: BaseWidePDA

  id: USSPSFPolitrukPDA

  categories: [ USSP ]

  suffix: USSP

  name: КПК Политического Руководителя

  description: Скромный, алый как Советской флаг, КПК Политического руководителя Управления ПолитКонтроля НКВБ. В нем довольно много записей о разного рода коммунизме. Почему этот глаз смотрит вечно на тебя?

  components:

  - type: Pda

    id: USSPSFPolitrukIDCard

    penSlot:

      startingItem: USSPSFLuxuryPen

      priority: -1

      whitelist:

        tags:

        - Write

  - type: Sprite

    sprite: _Souz/Objects/Devices/pda.rsi

    layers:

    - map: [ "enum.PdaVisualLayers.Base" ]

      state: pda-politruk

    - state: light_overlay_wide

      map: [ "enum.PdaVisualLayers.Flashlight" ]

      shader: unshaded

      visible: false

    - state: id_overlay_wide

      map: [ "enum.PdaVisualLayers.IdLight" ]

      shader: unshaded

      visible: false

  - type: Appearance

    appearanceDataInit:

     enum.PdaVisuals.PdaType:

       !type:String

       pda-politruk

  - type: PdaBorderColor

    borderColor: "#9b2d30"

  - type: Icon

    sprite: _Souz/Objects/Devices/pda.rsi

    state: pda-politruk

