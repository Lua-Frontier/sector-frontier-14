# source: Entities/Objects/Devices/pda.yml

- type: entity

  parent: BasePDA

  id: USSPSFPassengerPDA

  categories: [ USSP ]

  suffix: USSP

  name: passenger PDA

  description: Why isn't it gray?

  components:

  - type: Pda

    id: USSPSFPassengerIDCard

  - type: Sprite

    sprite: _Souz/Objects/Devices/pda.rsi

    layers:

    - map: [ "enum.PdaVisualLayers.Base" ]

      state: pda

    - state: light_overlay

      map: [ "enum.PdaVisualLayers.Flashlight" ]

      shader: unshaded

      visible: false

    - state: id_overlay

      map: [ "enum.PdaVisualLayers.IdLight" ]

      shader: unshaded

      visible: false

  - type: Icon

    sprite: _Souz/Objects/Devices/pda.rsi

    state: pda

  - type: PdaBorderColor

    borderColor: "#67665a" # DS14

