# source: Entities/Objects/Misc/pen.yml
- type: entity
  name: pen
  parent: BaseItem
  id: USSPSFPen
  categories: [ USSP ]
  suffix: USSP
  description: A dark ink pen.
  components:
  - type: Sprite
    sprite: _Souz/Objects/Misc/pens.rsi
    state: pen
  - type: Item
    sprite: _Souz/Objects/Misc/pens.rsi
    heldPrefix: pen
    size: Tiny
  - type: Tag
    tags:
    - Write
    - Pen
  - type: PhysicalComposition
    materialComposition:
      Steel: 25
  - type: EmitSoundOnUse
    sound:
      path: /Audio/Items/pen_click.ogg
      params:
        volume: -4
        maxDistance: 2
  - type: UseDelay
    delay: 1.5
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PolygonShape
          vertices:
          - -0.3,0.1
          - -0.1,0.3
          - 0.3,-0.1
          - 0.1,-0.3
        density: 20 # derived from base_item
        mask:
        - ItemMask
        restitution: 0.3
        friction: 0.2
  #DS14-Start
  - type: EmitSoundOnPickup
    sound:
      path: /Audio/_Goobstation/Items/handling/component_pickup.ogg
  - type: EmitSoundOnDrop
    sound:
      path: /Audio/_Goobstation/Items/handling/component_drop.ogg
  - type: EmitSoundOnLand
    sound:
      path: /Audio/_Goobstation/Items/handling/component_drop.ogg
  #DS14-End
- type: entity
  name: luxury pen
  parent: USSPSFPen
  id: USSPSFLuxuryPen
  categories: [ USSP ]
  suffix: USSP
  description: A fancy and expensive pen that you only deserve to own if you're qualified to handle vast amounts of paperwork.
  components:
  - type: Sprite
    state: luxury_pen
  - type: Item
    heldPrefix: luxury_pen
- type: entity
  name: captain's fountain pen
  parent: PenEmbeddable
  id: USSPSFPenCap
  categories: [ USSP ]
  suffix: USSP
  description: A luxurious fountain pen for the captain of the station.
  components:
  - type: Sprite
    state: pen_cap
- type: entity
  name: HoP's fountain pen
  parent: PenEmbeddable
  id: USSPSFPenHop
  categories: [ USSP ]
  suffix: USSP
  description: A luxurious fountain pen for the HoP of the station.
  components:
  - type: Sprite
    state: pen_hop
