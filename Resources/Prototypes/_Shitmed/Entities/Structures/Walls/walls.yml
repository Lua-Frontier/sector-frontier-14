#shuttle walls
# Mono: WallNanolaminate uses BaseWallTierFour + ArmorThickness.

- type: entity
  id: WallNanolaminateDiagonal # Mono
  name: nanolaminate wall # Mono
  suffix: ADS ONLY, Diagonal # Mono
  description: A dense wall made of a strange material, the texture is smooth yet rough. # Mono
  parent: BaseWallTierFour
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  - type: Transform
    anchored: true
  - type: Clickable
  - type: Tag
    tags:
    - Wall
    - Diagonal
    - WallT4
  - type: Sprite
    drawdepth: Walls
    sprite: _Shitmed/Structures/Walls/abductor_diagonal.rsi
    state: state0
  - type: IconSmooth
    mode: Diagonal
    key: walls
    base: state
  - type: Icon
    sprite: _Shitmed/Structures/Walls/abductor_diagonal.rsi
    state: state0
  - type: Physics
    bodyType: Static
  - type: Pullable
  - type: Airtight
    noAirWhenFullyAirBlocked: false
    airBlockedDirection:
    - South
    - East
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PolygonShape
            vertices:
            - "-0.5,-0.5"
            - "0.5,0.5"
            - "0.5,-0.5"
        mask:
        - FullTileMask
        layer:
        - WallLayer
        density: 7500
  - type: Construction
    graph: Girder
    node: diagonalshuttleWall
  - type: StaticPrice
    price: 250 # must cover diagonalshuttleWall deconstruct materials (BaseWallTierFour is only 75)
  - type: ArmorThickness
    thickness: 10
  - type: ShipRepairable
    repairTime: 3
    repairCost: 6
  - type: Occluder
    enabled: false

- type: entity
  parent: BaseWallTierFour
  id: WallNanolaminate # Mono
  name: nanolaminate wall # Mono
  suffix: ADS ONLY # Mono
  description: A dense wall made of a strange material, the texture is smooth yet rough. # Mono
  components:
  - type: StaticPrice
    price: 250
  - type: RadiationBlocker
    resistance: 5
  - type: Sprite
    sprite: _Shitmed/Structures/Walls/abductor.rsi
  - type: Icon
    sprite: _Shitmed/Structures/Walls/abductor.rsi
    state: full
  - type: Construction
    graph: Girder
    node: shuttleWall
  - type: IconSmooth
    key: walls
    base: state
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        mask:
        - FullTileMask
        layer:
        - WallLayer
        density: 15000
  - type: Appearance
  - type: Tag
    tags:
    - Wall
    - WallT4
