- type: entityTable
  id: NFBasicCalmEventsTable
  table: !type:AllSelector # we need to pass a list of rules, since rules have further restrictions to consider via StationEventComp
    children:
    - id: NFBreakerFlip
    - id: NFIonStorm
    - id: NFPowerGridCheck
    # - id: NFRandomSentience Lua Disable
    - id: NFVentClog
    - id: NFBluespaceCargoCrate
    - id: NFBluespaceMcCargoCrate
    - id: NFBluespaceBrokenMcDelivery
    - id: NFSmugglingFax
    - id: SectorDarkness # Lua
    - id: SectorBrightness # Lua

- type: entity
  id: NFBreakerFlip
  parent: BaseGameRule
  components:
  - type: StationEvent
    startAudio:
      path: /Audio/_NF/Announcements/PocketSizedAndy/andy2_breaker_flip.ogg
    announcementScope: Station
    weight: 7
    earliestStart: 15 # Frontier
    duration: 1
    minimumPlayers: 15
  - type: BreakerFlipRule

- type: entity
  id: NFPowerGridCheck
  parent: BaseStationEventShortDelay
  components:
  - type: StationEvent
    earliestStart: 15 # Frontier
    startAnnouncement: station-event-power-grid-check-nf-start-announcement # Frontier: add nf-
    endAnnouncement: station-event-power-grid-check-nf-end-announcement # Frontier: add nf-
    announcementScope: Station
    startAudio:
      params:
        volume: -0
      path: /Audio/_Lua/Announcements/poweroff2.ogg # Lua
  #  endAudio:
  #    path: /Audio/_NF/Announcements/PocketSizedAndy/andy1_power_onnf.ogg  ##PowerGridCheckRule handles end audio, leaving this incase that breaks
  #    params:
  #     volume: -4
    weight: 5
    duration: 60
    maxDuration: 120
  - type: PowerGridCheckRule

- type: entity
  id: NFVentClog
  parent: BaseStationEventLongDelay
  components:
  - type: StationEvent
    startAnnouncement: station-event-vent-clog-nf-start-announcement # Frontier: add nf-
    announcementScope: Station
    startAudio:
      path: /Audio/_Lua/Announcements/attention.ogg # Lua
    earliestStart: 15
    minimumPlayers: 15
    weight: 5
    duration: 60
  - type: VentClogRule

- type: entity
  parent: BaseGameRule
  id: NFIonStorm
  components:
  - type: StationEvent
    earliestStart: 45 # Lua: 15<45
    startAnnouncement: station-event-ion-storm-nf-start-announcement
    announcementScope: Map
    weight: 2 # Lua: 8<2
    reoccurrenceDelay: 300 # Lua: 120<300
    duration: 1
  - type: IonStormRule
    sectors: # Lua
    - AsteroidSectorDefault
    - FrontierSector
