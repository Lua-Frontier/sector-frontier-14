# BASE
- type: entity
  parent: SyndieDuffelGiftBox
  id: ExplorerDuffelGiftBox
  name: explorer's bundle
  abstract: true
  categories: [ HideSpawnMenu ]
  suffix: NPC Loot
  components:
  - type: Sprite
    sprite: Clothing/Back/Duffels/salvage.rsi
    state: icon

