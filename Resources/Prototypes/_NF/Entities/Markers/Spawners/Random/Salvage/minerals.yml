# Mineral tables for asteroids
# region Rock Spawner
- type: entityTable
  id: NFRockMineralSoft
  table: !type:GroupSelector
    children:
    - id: WallRock
      weight: 0.4
    - id: WallRockCoal
      weight: 0.1
    - id: WallRockTin
      weight: 0.16
    - id: WallRockQuartz
      weight: 0.06
    - id: WallRockSalt
      weight: 0.06
    - id: WallRockGold
      weight: 0.01
    - id: WallRockSilver
      weight: 0.04
    - id: WallRockPlasma
      weight: 0.07
    - id: WallRockUranium
      weight: 0.04
    - id: WallRockBananium
      weight: 0.01
    - id: WallRockArtifactFragment
      weight: 0.01
    - id: WallRockDiamond
      weight: 0.002
    - id: NFWallRockBluespace
      weight: 0.003
    - id: SalvageRockElementalSpawner
      weight: 0.06
    - id: WallRockChromiteMagmite #Lua
      weight: 0.001

- type: entity
  id: NFRockMineralSoft
  parent: MarkerBase
  name: rock mineral spawner
  suffix: Soft
  components:
  - type: Sprite
    layers:
    - sprite: Structures/Walls/rock.rsi
      state: rock
    - state: green
    - sprite: Objects/Weapons/Melee/pickaxe.rsi
      state: pickaxe
  - type: EntityTableSpawner
    offset: 0
    table: !type:NestedSelector
      tableId: NFRockMineralSoft

# endregion Rock Spawners

