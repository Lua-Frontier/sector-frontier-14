- type: entity
  id: BaseHoverbikePacked
  parent: BaseItem
  abstract: true
  name: packed hoverbike
  description: A folded hoverbike. Use it on the floor to unpack. Keys included.
  components:
  - type: MultiHandedItem
  - type: Sprite
    sprite: _Lua/Objects/Vehicles/hoverbike_packed.rsi
    state: packed
  - type: Item
    size: Ginormous
    shape:
    - 0,0,3,3
    sprite: _Lua/Objects/Vehicles/hoverbike_packed.rsi

- type: entity
  id: HoverbikePacked
  parent: BaseHoverbikePacked
  name: packed hoverbike
  suffix: Neutral
  description: A folded hoverbike. Use it on the floor to unpack. Keys included.
  components:
  - type: SpawnAfterInteract
    prototype: NFVehicleHoverbikeKeys
    doAfter: 5
    removeOnInteract: true

