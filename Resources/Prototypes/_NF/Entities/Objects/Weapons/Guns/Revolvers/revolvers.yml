  name: fitz special
  description: |-
    A compact and concealable self defence snub revolver.
  suffix: Need balance test
  components:
  - type: Gun #Lua
    minAngle: 1 #Lua
    maxAngle: 3.5 #Lua
    angleIncrease: 0.2 #Lua
    angleDecay: 1 #Lua
    fireRate: 1 #Lua
  - type: Sprite
