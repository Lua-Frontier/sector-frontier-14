- type: entity
  id: WeaponRevolverLucky
  parent: [ NFBaseWeaponRevolverChamber45Magnum, NFBaseWeaponFrameRevolverFrontierGunsmith ] #Lua 45 -> magnum
  name: lucky
  description: |-
    Luck always beats skill, ya weasel.
  suffix: Need balance test
  components:
  - type: Sprite
    sprite: _DV/Objects/Weapons/Guns/Revolvers/lucky.rsi
  - type: Clothing
    sprite: _DV/Objects/Weapons/Guns/Revolvers/lucky.rsi
  - type: Gun #Lua
    examineCaliber: gun-examine-caliber-45acp
    minAngle: 3.1
    maxAngle: 15.5
    angleIncrease: 0.7
    angleDecay: 5
