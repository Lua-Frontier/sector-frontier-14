#region WizDen leftovers (Mono has no N1984; keep under vanilla ID for catalogs)
- type: entity
  id: WeaponPistolN1984
  parent: [ BaseC1Contraband, NFBaseWeaponPistolChamber45ACP, NFBaseWeaponFramePistolNanotrasen ] #Lua 45 -> 45ACP
  name: N1984
  description: |-
    The sidearm of any self respecting officer. On the handle is a label that says 'for authorized use only.'
  suffix: Need balance test
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Pistols/N1984.rsi
  - type: Clothing
    sprite: Objects/Weapons/Guns/Pistols/N1984.rsi
  - type: Gun #Lua
    examineCaliber: gun-examine-caliber-45acp #Lua
    minAngle: 3.1 #Lua
    maxAngle: 15.5 #Lua
    angleIncrease: 0.7 #Lua
    angleDecay: 5 #Lua
    fireRate: 6

# Upstream / Mono leftover
- type: entity
  id: WeaponPistolMk58Nonlethal
  parent: WeaponPistolMk58
  suffix: Non-lethal
  components:
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: Magazine45_ACPPistolRubber
        insertSound: /Audio/Weapons/Guns/MagIn/pistol_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/pistol_magout.ogg
        priority: 2
        whitelist:
          tags:
            - Magazine45_ACPPistolFMJ
            - Magazine45_ACPPistolHighCapacityFMJ
      gun_chamber:
        name: Chamber
        startingItem: Cartridge45_ACPRubber
        priority: 1
        whitelist:
          tags:
            - Cartridge45_ACPFMJ
      # Mono
      attachment_grip:
        insertSound: /Audio/Items/screwdriver2.ogg
        ejectSound: /Audio/Items/screwdriver2.ogg
        priority: 0
        whitelist:
          tags:
          - MonoGripPistolMount
      # Mono
      attachment_barrel:
        insertSound: /Audio/Items/screwdriver.ogg
        ejectSound: /Audio/Items/screwdriver.ogg
        priority: 0
        whitelist:
          tags:
          - MonoSuppressorMulticalRifle
