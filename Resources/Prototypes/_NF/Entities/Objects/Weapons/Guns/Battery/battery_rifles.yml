# Shared laser/pulse IDs restored as vanilla Weapon*. Keep Lua temperature gun (Mono has no WeaponTemperatureGun).
#region Thermal
- type: entity
  id: WeaponTemperatureGun
  parent: [ BaseC3ContrabandUnredeemable, NFBaseWeaponFrameEnergyRifleNanotrasen ]
  name: temperature gun
  description: An advanced gun that shoots beams capable of heating or cooling their target.
  suffix: Need balance test
  components:
  - type: Item
    shape:
    - 0,0,2,1
  - type: Gun
    selectedMode: FullAuto
    availableModes:
    - SemiAuto
    - FullAuto
    minAngle: 8.1 #Maksimvini 3.1>8.1
    maxAngle: 22.5 #Maksimvini 15.5>22.5
    angleIncrease: 0.7
    angleDecay: 5
    fireRate: 4.2 # Maksimvini 6<4.2
    soundGunshot:
      path: /Audio/_DV/Weapons/Guns/Gunshots/laser.ogg
  - type: Sprite
    sprite: Objects/Weapons/Guns/Battery/temp_gun.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-unshaded-1
      map: ["enum.GunVisualLayers.MagUnshaded"]
      shader: unshaded
  - type: Clothing
    sprite: Objects/Weapons/Guns/Battery/temp_gun.rsi
  - type: Battery
    maxCharge: 480 # 12 shoots with 40 cost each. By maksimvini
    startingCharge: 480 #Maksimvini
  - type: ProjectileBatteryAmmoProvider
    proto: NFBoltTempgunCold
    fireCost: 40 # Maksimvini 25>40
  - type: MagazineVisuals
    magState: mag
    steps: 5
    zeroVisible: false
  - type: NFWeaponDetails
    manufacturer: weapon-details-manufacturer-custom-made
  - type: BatterySelfRecharger
    autoRecharge: true
    autoRechargeRate: 35 # Maksimvini 20>35

- type: entity
  name: freezing bolt
  id: NFBoltTempgunCold
  parent: BoltTempgunCold
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    impactEffect: BulletImpactEffectDisabler
    damage:
      types:  # Maksimvini - Removed 15 shock, 5 Caustic. New types from temperature-reality weapon: Blunt, Cold, Heat.
        Blunt: 7
        Cold: 2
        Heat: 12 # Maksimvini - Total DMG was 20, now 21
