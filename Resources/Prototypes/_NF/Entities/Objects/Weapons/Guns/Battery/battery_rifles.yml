# Shared laser/pulse IDs restored as vanilla Weapon*. Keep Lua temperature gun (Mono has no WeaponTemperatureGun).
#region Thermal
- type: entity
  id: WeaponTemperatureGun
  parent: [ BaseC3ContrabandUnredeemable, NFBaseWeaponFrameEnergyRifleNanotrasen ]
  name: temperature gun
  description: An advanced gun that shoots beams capable of heating or cooling their target.
  suffix: Need balance test
  components:
  - type: Item
    shape:
    - 0,0,2,1
  - type: Gun
    selectedMode: FullAuto
    availableModes:
    - SemiAuto
    - FullAuto
    minAngle: 3.1
    maxAngle: 15.5
    angleIncrease: 0.7
    angleDecay: 5
    fireRate: 6
    soundGunshot:
      path: /Audio/_DV/Weapons/Guns/Gunshots/laser.ogg
  - type: Sprite
    sprite: Objects/Weapons/Guns/Battery/temp_gun.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-unshaded-1
      map: ["enum.GunVisualLayers.MagUnshaded"]
      shader: unshaded
  - type: Clothing
    sprite: Objects/Weapons/Guns/Battery/temp_gun.rsi
  - type: Battery
    maxCharge: 500
    startingCharge: 500
  - type: ProjectileBatteryAmmoProvider
    proto: NFBoltTempgunCold
    fireCost: 20
  - type: MagazineVisuals
    magState: mag
    steps: 5
    zeroVisible: false
  - type: NFWeaponDetails
    manufacturer: weapon-details-manufacturer-custom-made
  - type: BatterySelfRecharger
    autoRecharge: true
    autoRechargeRate: 20

- type: entity
  name: freezing bolt
  id: NFBoltTempgunCold
  parent: BoltTempgunCold
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    impactEffect: BulletImpactEffectDisabler
    damage:
      types:
        Shock: 15
        Caustic: 5
