#region WizDen
- type: entity
  id: WeaponSubMachineGunAtreides
  parent: [ NFBaseWeaponSubMachineGunChamber9x19, NFBaseWeaponFrameSubMachineGunGorlex ] #Lua 35 -> 9x19 base
  name: Atreides
  description: |-
    Pla-ket-ket-ket-ket! An illegal firearm often used by Syndicate agents.
  components:
  - type: Gun
    fireRate: 5.5 #_Lua
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/atreides.ogg
  - type: Sprite
    sprite: _NF/Objects/Weapons/Guns/SMGs/atreides.rsi
  - type: Clothing
    sprite: _NF/Objects/Weapons/Guns/SMGs/atreides.rsi

- type: entity
  id: WeaponSubMachineGunC20r
  parent: [ NFBaseWeaponSubMachineGunChamber9x19, NFBaseWeaponFrameSubMachineGunCybersun ] #Lua 35 -> 9x19 base
  name: C-20r
  description: |-
    An illegal firearm that is often used by the infamous nuclear operatives.
  suffix: Need balance test
  components:
  - type: Item #Lua
    shape:
    - 0,0,2,1
  - type: Gun
    examineCaliber: gun-examine-caliber-45acp #Lua
    minAngle: 3.1 #Lua
    maxAngle: 15.5 #Lua
    angleIncrease: 0.7 #Lua
    angleDecay: 5 #Lua
    fireRate: 4 #Lua
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/c-20r.ogg
  - type: Sprite
    sprite: Objects/Weapons/Guns/SMGs/c20r.rsi
  - type: Clothing
    sprite: Objects/Weapons/Guns/SMGs/c20r.rsi
  - type: ChamberMagazineAmmoProvider
    autoEject: false #Lua true<false
  - type: MagazineVisuals
    magState: mag
    steps: 6
    zeroVisible: true
  - type: ItemSlots #Lua
    slots:
      gun_magazine:
        name: Magazine
        startingItem: Magazine45_ACPSubMachineGunFMJ #Lua Magazine9x19mmSubMachineGunFMJ<Magazine45_ACPSubMachineGunFMJ
        insertSound: /Audio/Weapons/Guns/MagIn/smg_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/smg_magout.ogg
        priority: 2
        whitelist: &mag35Whitelist
          tags:
            - Magazine45_ACPSubMachineGunFMJ #Lua Magazine9x19mmSubMachineGunFMJ<Magazine45_ACPSubMachineGunFMJ
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber: &chamber35Standard
        name: Chamber
        startingItem: Cartridge45_ACPFMJ #Lua Cartridge9x19mmFMJ<Cartridge45_ACPFMJ
        priority: 1
        whitelist:
          tags:
            - Cartridge45_ACPFMJ #Lua Cartridge9x19mmFMJ<Cartridge45_ACPFMJ

- type: entity
  id: WeaponSubMachineGunDrozd
  parent: [ NFBaseWeaponSubMachineGunChamber9x19, NFBaseWeaponFrameSubMachineGunNanotrasen ] #Lua 35 -> 9x19 base
  name: Drozd
  description: A fully automatic SMG.
  suffix: Need balance test
  components: &drozdComponents
  - type: Item #Lua
    shape:
    - 0,0,2,1
  - type: Gun
    examineCaliber: gun-examine-caliber-919 #Lua
    minAngle: 3.1 #Lua
    maxAngle: 15.5 #Lua
    angleIncrease: 0.7 #Lua
    angleDecay: 5 #Lua
    fireRate: 4.5 #Lua 5.5<4.5
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/atreides.ogg
  - type: Sprite
    sprite: _NF/Objects/Weapons/Guns/SMGs/drozd.rsi
  - type: Clothing
    sprite: _NF/Objects/Weapons/Guns/SMGs/drozd.rsi
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: Magazine9x19mmSubMachineGunFMJ
        insertSound: /Audio/Weapons/Guns/MagIn/smg_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/smg_magout.ogg
        priority: 2
        whitelist:
          tags:
            - Magazine9x19mmSubMachineGunFMJ
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        startingItem: Cartridge9x19mmFMJ
        priority: 1
        whitelist:
          tags:
            - Cartridge9x19mmFMJ
      attachment_barrel:
        insertSound: /Audio/Items/screwdriver.ogg
        ejectSound: /Audio/Items/screwdriver.ogg
        priority: 0
        whitelist:
          tags:
          - MonoSuppressorMulticalPistol
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
      attachment_barrel: !type:ContainerSlot

- type: entity
  id: WeaponSubMachineGunDrozdRubber
  parent: WeaponSubMachineGunDrozd
  suffix: Non-Lethal
  components:
    - type: ItemSlots
      slots:
        gun_magazine:
          name: Magazine
          startingItem: Magazine45_ACPSubMachineGunRubber
          insertSound: /Audio/Weapons/Guns/MagIn/smg_magin.ogg
          ejectSound: /Audio/Weapons/Guns/MagOut/smg_magout.ogg
          priority: 2
          whitelist:
            tags:
              - Magazine45_ACPSubMachineGunFMJ
          whitelistFailPopup: gun-magazine-whitelist-fail
        gun_chamber:
          name: Chamber
          startingItem: Cartridge45_ACPRubber
          priority: 1
          whitelist:
            tags:
              - Cartridge45_ACPFMJ
        # Mono
        attachment_barrel:
          insertSound: /Audio/Items/screwdriver.ogg
          ejectSound: /Audio/Items/screwdriver.ogg
          priority: 0
          whitelist:
            tags:
            - MonoSuppressorMulticalPistol
