#region WizDen
- type: entity
  id: WeaponSniperHristov
  parent: [NFBaseWeaponFrameRifleSniperCybersun, BaseWeaponSniperNoContainer ] #NFBaseWeaponRifleChamber60
  name: SKR-WS M96 Hristov (14.5x114mm)
  description: A portable, 3-round anti-material rifle. Fires high velocity 14.5mm shells. Uses 14.5x114mm ammo.
  suffix: Need balance test
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Snipers/heavy_sniper.rsi
  - type: Clothing
    sprite: Objects/Weapons/Guns/Snipers/heavy_sniper.rsi
  - type: Gun #Lua
    examineCaliber: gun-examine-caliber-145
    minAngle: 0 #Lua # Я ебал эту логику, ставлю нули и мне похуй
    maxAngle: 0 #Lua
    angleIncrease: 0 #Lua
    angleDecay: 0 #Lua
    fireRate: 1.2
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/sniper.ogg
  - type: Item #Lua
    shape:
    - 0,0,4,3
  - type: ItemToggle #Lua
    onUse: false
    onActivate: false
    soundActivate:
      path: /Audio/_Lua/Weapons/mantison.wav
      params:
        volume: 3
    soundDeactivate:
      path: /Audio/_Lua/Weapons/mantisoff.wav
      params:
        volume: 3
  - type: ToggleClothing #Lua
    action: ActionToggleScope
    mustEquip: false
  - type: ComponentToggler #Lua
    components:
    - type: HeldSpeedModifier #Lua
    - type: ClothingSpeedModifier #Lua
      walkModifier: 0.8
      sprintModifier: 0.8
    - type: CursorOffsetRequiresWield
    - type: EyeCursorOffset
      maxOffset: 10
      pvsIncrease: 1
  - type: BallisticAmmoProvider
    autoCycle: false
    whitelist:
      tags:
      - Cartridge145x114mm
    capacity: 3
    proto: null
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
        ents: []
