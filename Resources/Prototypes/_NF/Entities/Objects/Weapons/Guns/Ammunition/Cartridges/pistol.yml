# Lua-only leftover cartridges (mapped NFCartridgePistol35/45 live IDs restored as metric)
#region base
- type: entity
  id: NFBaseCartridgePistol35
  name: cartridge (.35 pistol)
  parent: BaseCartridgePistol
  abstract: true
  components:
  - type: Tag
    tags:
      - Cartridge
      - Cartridge9x19mmFMJ
  - type: CartridgeAmmo
    proto: Bullet9x19mmFMJ
  - type: Sprite
    layers:
      - state: base
        map: [ "enum.AmmoVisualLayers.Base" ]
      - state: tip
        map: [ "enum.AmmoVisualLayers.Tip" ]
        color: "#666666"

- type: entity
