- type: entity
  id: NFBaseMagazineSubMachineGunTopMounted35
  name: top mounted smg magazine (.35 pistol)
  parent: [ BaseC1Contraband, MagazinePistolSubMachineGunTopMounted, RecyclableItemSteelTiny ]
