# Lua leftover .35 mags: high-cap, Overpressure/EMP, top-mounted extras. Mapped standard/SMG IDs restored as 9x19.
#region base
- type: entity
  id: NFBaseMagazinePistol35
  name: pistol magazine (.35 pistol)
  parent: [ BaseC1Contraband, BaseMagazinePistol, RecyclableItemSteelTiny ]
  abstract: true
  components:
  - type: Tag
    tags:
      - Magazine9x19mmPistolFMJ
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
        - Cartridge9x19mmFMJ
    capacity: 10
  - type: Sprite
    sprite: _NF/Objects/Weapons/Guns/Ammunition/Magazine/Pistol35/pistol_mag.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: Item
    sprite: _NF/Objects/Weapons/Guns/Ammunition/Magazine/Pistol35/pistol_mag.rsi
    inhandVisuals:
      left:
      - state: inhand-left-mag
      right:
      - state: inhand-right-mag

- type: entity
  id: NFBaseMagazineHighCapacityPistol35
