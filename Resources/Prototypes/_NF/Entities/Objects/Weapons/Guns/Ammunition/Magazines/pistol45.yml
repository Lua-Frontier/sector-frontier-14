# Lua leftover .45 SMG mags. Mapped pistol .45 mag IDs restored as .45 ACP / leftover Overpressure uses kept cartridge.
#region base
- type: entity
  id: NFBaseMagazinePistol45
  name: pistol magazine (.45 pistol)
  parent: [ BaseC1Contraband, BaseMagazineMagnum, RecyclableItemSteelTiny ]
  abstract: true
  components:
  - type: Tag
    tags:
      - Magazine45_ACPPistolFMJ
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
        - Cartridge357_magnumFMJ
    capacity: 8
  - type: Sprite
    sprite: _NF/Objects/Weapons/Guns/Ammunition/Magazine/Pistol35/pistol_mag.rsi
    layers:
    - state: base
      color: "#666666"
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: Item
    sprite: _NF/Objects/Weapons/Guns/Ammunition/Magazine/Pistol35/pistol_mag.rsi
    inhandVisuals:
      left:
      - state: inhand-left-mag
        color: "#666666"
      right:
      - state: inhand-right-mag
        color: "#666666"

- type: entity
  id: NFBaseMagazinePistolSubMachineGun45
  name: smg magazine (.45 pistol)
  parent: [ BaseC1Contraband, BaseMagazineMagnum, RecyclableItemSteelTiny ]
  abstract: true
  components:
  - type: Tag
    tags:
      - NFMagazineSubMachineGunPistol45
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
        - Cartridge357_magnumFMJ
    capacity: 25
  - type: Sprite
    sprite: _NF/Objects/Weapons/Guns/Ammunition/Magazine/Pistol45/smg_mag.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 6
    zeroVisible: false
  - type: Item
    sprite: _NF/Objects/Weapons/Guns/Ammunition/Magazine/Pistol45/smg_mag.rsi
    inhandVisuals:
      left:
      - state: inhand-left-mag
      right:
      - state: inhand-right-mag

- type: entity
  id: NFMagazineSubMachineGun45Empty
  name: SMG magazine (.45 pistol, any)
  parent: NFBaseMagazinePistolSubMachineGun45
  components:
  - type: BallisticAmmoProvider
    proto: null

- type: entity
  id: NFMagazineSubMachineGun45
  name: SMG magazine (.45 pistol)
  parent: NFBaseMagazinePistolSubMachineGun45
  components:
  - type: BallisticAmmoProvider
    proto: Cartridge357_magnumFMJ

- type: entity
  id: NFMagazineSubMachineGun45Overpressure
  name: SMG magazine (.45 pistol, overpressure)
  parent: NFBaseMagazinePistolSubMachineGun45
  components:
  - type: BallisticAmmoProvider
    proto: NFCartridgePistol45Overpressure
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: decal-01
      color: "#ff8d00"
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left-mag
      - state: inhand-left-stripe
        color: "#ff8d00"
      right:
      - state: inhand-right-mag
      - state: inhand-right-stripe
        color: "#ff8d00"

- type: entity
  id: NFMagazineSubMachineGun45Rubber
  name: SMG magazine (.45 pistol, rubber)
  parent: NFBaseMagazinePistolSubMachineGun45
  components:
  - type: BallisticAmmoProvider
    proto: Cartridge357_magnumRubber
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: decal-01
      color: "#00b0ff"
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left-mag
      - state: inhand-left-stripe
        color: "#00b0ff"
      right:
      - state: inhand-right-mag
      - state: inhand-right-stripe
        color: "#00b0ff"
