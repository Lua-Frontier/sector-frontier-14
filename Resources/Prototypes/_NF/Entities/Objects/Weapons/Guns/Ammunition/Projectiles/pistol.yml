# Lua leftover pistol bullets used by Overpressure/EMP cartridges.
- type: entity
  id: NFBulletPistol35Overpressure
  name: bullet (.35 pistol, overpressure)
  parent: NFBaseBulletOverpressure
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Piercing: 14 #Lua 10<14
        Blunt: 8 #Lua 5<8
  - type: StaminaDamageOnCollide
    damage: 5 # 12 hits to slowdown

- type: entity
  id: NFBulletPistol35Emp
  name: bullet (.35 pistol, EMP)
  parent: NFBaseBulletEmp
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Shock: 4
        Blunt: 4
  - type: StaminaDamageOnCollide
    damage: 4 # 15 hits to slowdown

- type: entity
  id: NFBulletPistol45Overpressure
  name: bullet (.45 pistol, overpressure)
  parent: NFBaseBulletOverpressure
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Piercing: 25 #Lua 6<25
        Blunt: 15 #Lua 7<15
  - type: StaminaDamageOnCollide
    damage: 7 # ~9 hits to slowdown

- type: entity
  id: NFBulletPistol45Emp
  name: bullet (.45 pistol, EMP)
  parent: NFBaseBulletEmp
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Shock: 6
        Blunt: 6
  - type: StaminaDamageOnCollide
    damage: 6 # 10 hits to slowdown
