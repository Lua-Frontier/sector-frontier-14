- type: entity
  id: BaseSpeedLoaderHeavyRifle
  name: "speed loader (.20 rifle)"
  parent: BaseItem
  abstract: true
  components:
  - type: Tag
    tags:
      - SpeedLoaderRifleHeavy
  - type: SpeedLoader
  - type: BallisticAmmoProvider
    whitelist:
      tags:
        - Cartridge556x45mmFMJ
    capacity: 8
  - type: Sprite
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
        ents: []

- type: entity
  id: SpeedLoaderRifleHeavy
  categories: [ HideSpawnMenu ]
  name: "speed loader (.20 rifle)"
  parent: BaseSpeedLoaderHeavyRifle
  components:
  - type: BallisticAmmoProvider
    proto: Cartridge556x45mmFMJ
  - type: Icon
    sprite: _NF/Objects/Weapons/Guns/Ammunition/SpeedLoaders/HeavyRifle/argenti_speed_loader.rsi
    state: icon
  - type: Sprite
    sprite: _NF/Objects/Weapons/Guns/Ammunition/SpeedLoaders/HeavyRifle/argenti_speed_loader.rsi
    layers:
      - state: base
        map: [ "enum.GunVisualLayers.Base" ]
      - state: base-8
        map: [ "enum.GunVisualLayers.Mag" ]
  - type: MagazineVisuals
    magState: base
    steps: 9
    zeroVisible: false
  - type: Appearance
  - type: Item
    sprite: _NF/Objects/Weapons/Guns/Ammunition/SpeedLoaders/HeavyRifle/argenti_speed_loader.rsi
    inhandVisuals:
      left:
      - state: inhand-left
      right:
      - state: inhand-right

