  components:
  - type: BallisticAmmoProvider
    whitelist:
      tags:
        - Cartridge9x19mmFMJ
    proto: Cartridge9x19mmFMJ
    capacity: 80
  - type: Sprite
    sprite: _NF/Objects/Weapons/Guns/Ammunition/Boxes/pistol.rsi

- type: entity
  id: NFBaseAmmunitionBoxPistol45
  parent: NFBaseAmmunitionBox
  name: ammunition box (.45 pistol)
  abstract: true
  components:
  - type: BallisticAmmoProvider
    whitelist:
      tags:
        - Cartridge357_magnumFMJ
    proto: Cartridge357_magnumFMJ
    capacity: 60
  - type: Sprite
    sprite: _NF/Objects/Weapons/Guns/Ammunition/Boxes/pistol.rsi

- type: entity
  id: NFAmmunitionBoxPistol45Rubber
  categories: [ HideSpawnMenu ]
