# Lua leftover pistol boxes: Overpressure .35/.45, rubber/EMP .45. Mapped fills restored as metric boxes.
#region base
- type: entity
  id: NFBaseAmmunitionBoxPistol35
  parent: NFBaseAmmunitionBox
  name: ammunition box (.35 pistol)
  abstract: true
  components:
  - type: BallisticAmmoProvider
    whitelist:
      tags:
        - Cartridge9x19mmFMJ
    proto: Cartridge9x19mmFMJ
    capacity: 80
  - type: Sprite
    sprite: _NF/Objects/Weapons/Guns/Ammunition/Boxes/pistol.rsi

- type: entity
  id: NFBaseAmmunitionBoxPistol45
  parent: NFBaseAmmunitionBox
  name: ammunition box (.45 pistol)
  abstract: true
  components:
  - type: BallisticAmmoProvider
    whitelist:
      tags:
        - Cartridge357_magnumFMJ
    proto: Cartridge357_magnumFMJ
    capacity: 60
  - type: Sprite
    sprite: _NF/Objects/Weapons/Guns/Ammunition/Boxes/pistol.rsi

- type: entity
  id: NFAmmunitionBoxPistol35Overpressure
  parent: NFBaseAmmunitionBoxPistol35
  name: ammunition box (.35 pistol, overpressure)
  components:
  - type: BallisticAmmoProvider
    proto: NFCartridgePistol35Overpressure
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
      color: "#3b7b9c"
    - state: decal-01
      color: "#ff8d00"
    - state: decal-calibre-35
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]

- type: entity
  id: NFAmmunitionBoxPistol45Overpressure
  parent: NFBaseAmmunitionBoxPistol45
  name: ammunition box (.45 pistol, overpressure)
  components:
  - type: BallisticAmmoProvider
    proto: NFCartridgePistol45Overpressure
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
      color: "#7d3c40"
    - state: decal-01
      color: "#ff8d00"
    - state: decal-calibre-45
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]

- type: entity
  id: NFAmmunitionBoxPistol45Rubber
  parent: NFBaseAmmunitionBoxPistol45
  name: ammunition box (.45 pistol, rubber)
  components:
  - type: BallisticAmmoProvider
    proto: Cartridge357_magnumRubber
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
      color: "#7d3c40"
    - state: decal-01
      color: "#00b0ff"
    - state: decal-calibre-45
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]

- type: entity
  id: NFAmmunitionBoxPistol45Emp
  parent: NFBaseAmmunitionBoxPistol45
  name: ammunition box (.45 pistol, EMP)
  components:
  - type: BallisticAmmoProvider
    proto: NFCartridgePistol45Emp
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
      color: "#7d3c40"
    - state: decal-01
      color: "#00ffff"
    - state: decal-calibre-45
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
