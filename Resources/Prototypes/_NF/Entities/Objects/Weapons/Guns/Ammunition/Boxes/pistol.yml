  name: ammunition box (.45 pistol, rubber)
  components:
  - type: BallisticAmmoProvider
    proto: Cartridge357_magnumRubber
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
      color: "#7d3c40"
    - state: decal-01
      color: "#00b0ff"
    - state: decal-calibre-45
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
