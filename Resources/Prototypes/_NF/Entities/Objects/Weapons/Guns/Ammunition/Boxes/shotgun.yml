#region base
- type: entity
  id: NFBaseAmmunitionBoxShellShotgun
  parent: NFBaseAmmunitionBox
  name: shell box (.50 shell)
  abstract: true
  components:
  - type: BallisticAmmoProvider
    whitelist:
      tags:
      - ShellShotgun12_gaugeBuckshot
    capacity: 20
  - type: Sprite
    sprite: _NF/Objects/Weapons/Guns/Ammunition/Boxes/shotgun.rsi

- type: entity
  id: NFAmmunitionBoxShellShotgunOverpressure
  parent: NFBaseAmmunitionBoxShellShotgun
  name: shell box (.50 overpressure)
  components:
  - type: BallisticAmmoProvider
    proto: NFShellShotgunBuckshotOverpressure
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
      color: "#897e6a"
    - state: decal-01
      color: "#ff8d00FF"
    - state: decal-shell-overpressure
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
