# Lua leftover .20: Overpressure mag, drums, box mag, Novalite clips. Mapped rifle20 mags restored as 5.56.
#region base
- type: entity
  id: NFBaseMagazineRifle20
  name: magazine (.20 rifle)
  parent: [ BaseC1Contraband, RecyclableItemSteelTiny, BaseMagazineRifle ]
  abstract: true
  components:
  - type: Tag
    tags:
      - Magazine556x45mmFMJ
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
        - Cartridge556x45mmFMJ
    proto: Cartridge556x45mmFMJ
    capacity: 25
  - type: Sprite
    sprite: _NF/Objects/Weapons/Guns/Ammunition/Magazine/Rifle/rifle20_mag.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-6
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 7
    zeroVisible: false
  - type: Item
    sprite: _NF/Objects/Weapons/Guns/Ammunition/Magazine/Rifle/rifle20_mag.rsi
    inhandVisuals:
      left:
      - state: inhand-left-mag
      right:
      - state: inhand-right-mag

- type: entity
  id: NFBaseMagazineDrumRifle556x45
  name: drum magazine (5.56x45mm rifle)
  parent: [ BaseC1Contraband, RecyclableItemSteelTiny, BaseMagazineRifle ]
  abstract: true
  components:
  - type: Tag
    tags:
      - NFMagazineDrumRifle556x45
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
        - Cartridge556x45mmFMJ
    proto: Cartridge556x45mmFMJ
    capacity: 60
  - type: Sprite
    sprite: _NF/Objects/Weapons/Guns/Ammunition/Magazine/Rifle/rifle20_drum.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
      scale: 0.8, 0.8
    - state: mag-6
      map: ["enum.GunVisualLayers.Mag"]
      scale: 0.8, 0.8
  - type: MagazineVisuals
    magState: mag
    steps: 10
    zeroVisible: false
  - type: Item
    sprite: _NF/Objects/Weapons/Guns/Ammunition/Magazine/Rifle/rifle20_drum.rsi
    inhandVisuals:
      left:
      - state: inhand-left-mag
      right:
      - state: inhand-right-mag

- type: entity
  id: NFBaseMagazineBoxRifle556x45
  name: box magazine (556x45 rifle)
  parent: NFBaseMagazineRifle20
  abstract: true
  components:
  - type: Tag
    tags:
      - NFMagazineBoxRifle556x45
  - type: BallisticAmmoProvider
    whitelist:
        tags:
          - Cartridge556x45mmFMJ
    proto: Cartridge556x45mmFMJ
    capacity: 100
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Magazine/LightRifle/light_rifle_box.rsi
  - type: MagazineVisuals
    magState: mag
    steps: 8
    zeroVisible: false
  - type: Item
    sprite: Objects/Weapons/Guns/Ammunition/Magazine/LightRifle/light_rifle_box.rsi
    inhandVisuals:
      left:
      - state: inhand-left
      right:
      - state: inhand-right

- type: entity
  id: NFMagazineRifle20Overpressure
  name: magazine (.20 rifle, overpressure)
  parent: NFBaseMagazineRifle20
  components:
  - type: BallisticAmmoProvider
    proto: NFCartridgeRifle20Overpressure
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: decal-01
      color: "#ff8d00"
    - state: mag-6
      map: ["enum.GunVisualLayers.Mag"]
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left-mag
      - state: inhand-left-stripe
        color: "#ff8d00"
      right:
      - state: inhand-right-mag
      - state: inhand-right-stripe
        color: "#ff8d00"

- type: entity
  id: NFMagazineDrumRifle556x45Empty
  name: drum magazine (5.56x45mm rifle, any)
  parent: NFBaseMagazineDrumRifle556x45
  suffix: empty
  components:
  - type: BallisticAmmoProvider
    proto: null

- type: entity
  id: NFMagazineDrumRifle556x45
  name: drum magazine (5.56x45mm rifle)
  parent: NFBaseMagazineDrumRifle556x45

- type: entity
  id: NFMagazineBoxRifle556x45
  name: box magazine (5.56x45mm rifle)
  parent: NFBaseMagazineBoxRifle556x45

- type: entity
  parent: BaseMagazineRifle
  id: NFMagazineClipRifle556x45Empty
  name: clip (.20 rifle, any)
  suffix: empty
  components:
  - type: Tag
    tags:
      - NFMagazineClipRifle556x45
  - type: Item
    size: Small
    sprite: _NF/Objects/Weapons/Guns/Ammunition/Magazine/Rifle/rifle20_novalite_clip.rsi
    inhandVisuals:
      left:
      - state: inhand-left-mag
      right:
      - state: inhand-right-mag
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
        - Cartridge556x45mmFMJ
    capacity: 15
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    sprite: _NF/Objects/Weapons/Guns/Ammunition/Magazine/Rifle/rifle20_novalite_clip.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-15
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 16
    zeroVisible: false
  - type: Appearance

- type: entity
  parent: NFMagazineClipRifle556x45Empty
  id: NFMagazineClipRifle556x45
  name: clip (.20 rifle)
  suffix: full
  components:
  - type: BallisticAmmoProvider
    proto: Cartridge556x45mmFMJ
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-15
      map: ["enum.GunVisualLayers.Mag"]

- type: entity
  parent: NFMagazineClipRifle556x45Empty
  id: NFMagazineClipRifle556x45Rubber
  name: clip (.20 rifle, rubber)
