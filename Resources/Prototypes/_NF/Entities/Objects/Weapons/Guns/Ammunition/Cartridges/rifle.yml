# Lua leftover rifle cartridges (.10/.25 plus Overpressure). Mapped .20/.30/.60 IDs restored as metric.
#region base
- type: entity
  id: NFBaseCartridgeRifle10
  name: cartridge (.10 rifle)
  parent: BaseCartridgeHeavyRifle
  abstract: true
  components:
  - type: Tag
    tags:
      - Cartridge
      - NFCartridgeRifle10

- type: entity
  id: NFBaseCartridgeRifle20
  name: cartridge (.20 rifle)
  parent: BaseCartridgeRifle
