- type: entity
  id: VendingMachineNutriMachineCircuitboard
  parent: BaseMachineCircuitboard
  name: NutriMax machine board
  description: A machine printed circuit board for a NutriMax vendor.
  components:
  - type: Sprite
    state: service
  - type: MachineBoard
    prototype: VendingMachineNutriEmpty
    requirements:
      Manipulator: 1
      MatterBin: 1
    stackRequirements:
      Steel: 5
      Glass: 2
      Cable: 2

