# Integration tests set game.map=Empty (PoolManager.TestMap). DEBUG GameTicker loads this instead of starmap sectors.
- type: gameMap
  id: Empty
  mapName: Empty
  mapPath: /Maps/_Lua/Test/empty.yml
  minPlayers: 0
  stations:
    Empty:
      stationProto: StandardNanotrasenStation
      components:
        - type: StationNameSetup
          mapNameTemplate: "Empty"
        - type: StationJobs
          availableJobs:
            Passenger: [ -1, -1 ]

- type: gameMap
  id: NFDev
  mapName: NFDev
  mapPath: /Maps/_Lua/Test/dev_map.yml
  minPlayers: 0
  stations:
    NFDev:
      stationProto: DebugFrontierStation
      components:
        - type: StationNameSetup
          mapNameTemplate: "NFDev"
        - type: StationJobs
          availableJobs:
            Contractor: [ -1, -1 ]
            Pilot: [ -1, -1 ]
            Borg: [ -1, -1]
            StationRepresentative: [ -1, -1 ]
            StationTrafficController: [ -1, -1 ]
            SecurityGuard: [ -1, -1 ]
            Valet: [ -1, -1 ]
            NFJanitor: [ -1, -1 ]
            MailCarrier: [ -1, -1 ]
            Sheriff: [ -1, -1]
            Bailiff: [ -1, -1]
            SeniorOfficer: [ -1, -1]
            Brigmedic: [ -1, -1]
            NFDetective: [ -1, -1]
            Deputy: [ -1, -1]
            Cadet: [ -1, -1]
            PublicAffairsLiaison: [ -1, -1]
            NFPirateCaptain: [ -1, -1]
            NFPirateFirstMate: [ -1, -1]
            NFPirate: [ -1, -1]
            Prisoner: [ -1, -1]
        - type: StationDeadDrop
          maxDeadDrops: 20 # Testing
