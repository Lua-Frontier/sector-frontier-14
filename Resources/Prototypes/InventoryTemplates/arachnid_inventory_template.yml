      slotTexture: underweart
      slotFlags: UNDERWEART
      stripTime: 6
      uiWindowPos: 2.5,0.5
      strippingWindowPos: 2,6
      displayName: Bra
      stripHidden: true
    - name: belt
      slotTexture: belt
