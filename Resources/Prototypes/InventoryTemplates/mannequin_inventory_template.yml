- type: inventoryTemplate
  id: mannequin
  slots:
    - name: jumpsuit
      slotTexture: uniform
      slotFlags: INNERCLOTHING
      stripTime: 3
      uiWindowPos: 0,1
      strippingWindowPos: 1,2
      displayName: Jumpsuit
    - name: outerClothing
      slotTexture: suit
      slotFlags: OUTERCLOTHING
      stripTime: 3
      uiWindowPos: 1,1
      strippingWindowPos: 2,2
      displayName: Suit
    - name: neck
      slotTexture: neck
      slotFlags: NECK
      stripTime: 3
      uiWindowPos: 0,2
      strippingWindowPos: 0,1
      displayName: Neck
    - name: mask
      stripTime: 3
      slotTexture: mask
      slotFlags: MASK
      uiWindowPos: 1,2
      strippingWindowPos: 1,1
      displayName: Mask
    - name: eyes
      slotTexture: glasses
      slotFlags: EYES
      stripTime: 3
      uiWindowPos: 0,3
      strippingWindowPos: 0,0
      displayName: Eyes
    - name: head
      slotTexture: head
      slotFlags: HEAD
      stripTime: 3
      uiWindowPos: 1,3
      strippingWindowPos: 1,0
      displayName: Head
    # Mono slots
    - name: rightarmband
      slotTexture: armband_right
      slotFlags: ARMBANDRIGHT
      stripTime: 3
      uiWindowPos: 2.5,3
      strippingWindowPos: 3,2
      displayName: Right_armband
    - name: leftarmband
      slotTexture: armband_left
      slotFlags: ARMBANDLEFT
      stripTime: 3
      uiWindowPos: 2,3
      strippingWindowPos: 3,1
      displayName: Left_armband
    - name: balaclava
      slotTexture: balaclava
      slotFlags: BALACLAVA
      stripTime: 3
      uiWindowPos: 3,3
      strippingWindowPos: 3,0
      displayName: Balaclava
    - name: helmetcover
      slotTexture: helmet_cover
      slotFlags: HELMETCOVER
      stripTime: 3
      uiWindowPos: 2.5,3.5
      strippingWindowPos: 3,3
      dependsOn: head
      displayName: Helmet cover
    - name: helmetattachment
      slotTexture: helmet_attachment
      slotFlags: HELMETATTACHMENT
      stripTime: 3
      uiWindowPos: 2,3.5
      strippingWindowPos: 3,4
      dependsOn: head
      displayName: Helmet_attachment
    # End Mono slots
    - name: necklace
      slotTexture: necklace
      slotFlags: NECKLACE
      stripTime: 3
      uiWindowPos: 3,1.5
      strippingWindowPos: 4,0
      displayName: Necklace
    - name: finger
      slotTexture: finger
      slotFlags: FINGER
      stripTime: 3
      uiWindowPos: 3,1
      strippingWindowPos: 4,1
      displayName: Finger
    - name: earring
      slotTexture: earring
      slotFlags: EARRING
      stripTime: 3
      uiWindowPos: 3,2
      strippingWindowPos: 4,2
      displayName: Earring
    - name: hairpin
      slotTexture: hairpin
      slotFlags: HAIRPIN
      stripTime: 3
      uiWindowPos: 3,2.5
      strippingWindowPos: 4,3
      displayName: Hairpin
    - name: suitstorage
      slotTexture: suit_storage
      slotFlags:   SUITSTORAGE
      slotGroup: MainHotbar
      stripTime: 3
      uiWindowPos: 2,0
      strippingWindowPos: 1,3
      dependsOn: outerClothing
      dependsOnComponents:
      - type: AllowSuitStorage
      displayName: Suit Storage
    - name: back
      slotTexture: back
      fullTextureName: template_small
      slotFlags: BACK
      stripTime: 3
      uiWindowPos: 3,0
      strippingWindowPos: 0,2
      displayName: Back
