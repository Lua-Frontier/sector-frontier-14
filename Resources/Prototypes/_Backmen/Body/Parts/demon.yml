- type: entity
  id: PartDemon
  parent: [BaseItem, BasePart]
  name: "demon body part"
  abstract: true
  components:
  - type: Damageable
    damageContainer: OrganicPart # #Backmen-Edit
  - type: BodyPart
    species: Demon
  - type: ContainerContainer #Backmen-Edit
    containers:
      bodypart: !type:Container
        ents: []
  - type: StaticPrice #Backmen-Edit
    price: 100
  - type: Tag #Backmen-Edit
    tags:
    - Trash
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 3
      - ReagentId: Blood
        Quantity: 10

- type: entity
  id: ChestDemon
  name: "demon chest"
  parent: [BaseTorso, PartDemon]
  components:
  - type: Sprite
    sprite: _ADT/Mobs/Demon/parts.rsi
    state: "torso_m"
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 10
      - ReagentId: Blood
        Quantity: 20

- type: entity
  id: HeadDemon
  name: "demon head"
  parent: [BaseHead, PartDemon]
  components:
  - type: Input #Backmen-Edit
    context: "ghost"
  - type: Tag #Backmen-Edit
    tags:
    - Head
  - type: Sprite
    sprite: _ADT/Mobs/Demon/parts.rsi
    state: "head_m"
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 5
      - ReagentId: Blood
        Quantity: 10

