- type: language
  id: Universal
  obfuscation:
    !type:ReplacementObfuscation
    replacement:
    - <непонятно>
  speech:
    allowRadio: true
    requireSpeech: false

- type: language
  id: FreeSpeak
  obfuscation:
    !type:PhraseObfuscation
    replacement:
    - бла
    - бла-бла
    - блабла
    minPhrases: 1
    maxPhrases: 3
  speech:
    allowRadio: true

