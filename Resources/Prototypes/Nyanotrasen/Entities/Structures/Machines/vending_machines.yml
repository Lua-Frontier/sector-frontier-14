- type: entity
  parent: [VendingMachine, SmallConstructibleMachine]
  id: VendingMachineRepDrobe
  name: RepDrobe
  description: A machine for all your reporting needs, as long as you need clothes.
  components:
  - type: VendingMachine
    pack: RepDrobeInventory
  - type: DatasetVocalizer
    dataset: DetDrobeAds
  - type: Sprite
    sprite: Structures/Machines/VendingMachines/detdrobe.rsi
    layers:
    - state: "off"
      map: ["enum.VendingMachineVisualLayers.Base"]
    - state: "off"
      map: ["enum.VendingMachineVisualLayers.BaseUnshaded"]
      shader: unshaded
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: WiresVisuals
  - type: Machine
    board: VendingMachineRepDrobeMachineCircuitboard
  - type: ContainerContainer
    containers:
      cash_slot: !type:ContainerSlot
      machine_board: !type:Container
      machine_parts: !type:Container
  - type: Construction
    graph: Machine
    node: machine
    containers:
    - machine_board
    - machine_parts

- type: entity
  parent: [VendingMachine, SmallConstructibleMachine]
  id: VendingMachineBoxingDrobe
  name: Boxing Drobe
  description: Always short on stock.
  components:
  - type: VendingMachine
    pack: BoxingDrobeInventory
  - type: Sprite
    sprite: Nyanotrasen/Structures/Machines/VendingMachines/boxingdrobe.rsi
    layers:
    - state: off
      map: ["enum.VendingMachineVisualLayers.Base"]
    - state: normal-unshaded
      map: ["enum.VendingMachineVisualLayers.BaseUnshaded"]
      shader: unshaded
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: Machine
    board: VendingMachineBoxingDrobeMachineCircuitboard
  - type: ContainerContainer
    containers:
      cash_slot: !type:ContainerSlot
      machine_board: !type:Container
      machine_parts: !type:Container
  - type: Construction
    graph: Machine
    node: machine
    containers:
    - machine_board
    - machine_parts

- type: entity
  parent: [VendingMachine, SmallConstructibleMachine]
  id: VendingMachineMailDrobe
  name: MailDrobe
  description: Neither solar flares nor meteors nor plasma fire nor void of space stays these couriers from the swift completion of their appointed rounds.
  components:
  - type: VendingMachine
    pack: MailDrobeInventory
    offState: off
    brokenState: broken
    normalState: normal-unshaded
    # ejectState: eject-unshaded  No sprite, see chefvend/dinnerware/BODA/etc for expamples
  - type: DatasetVocalizer
    dataset: MailDrobeAds
  - type: Sprite
    sprite: Nyanotrasen/Structures/Machines/VendingMachines/maildrobe.rsi
    layers:
    - state: "off"
      map: ["enum.VendingMachineVisualLayers.Base"]
    - state: "off"
      map: ["enum.VendingMachineVisualLayers.BaseUnshaded"]
      shader: unshaded
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: PointLight
    radius: 1.5
    energy: 1.6
    color: "#4b93ad"
  - type: AccessReader # Frontier
    access: [["Mail"]] # Frontier
  - type: Machine
    board: VendingMachineMailDrobeMachineCircuitboard
  - type: ContainerContainer
    containers:
      cash_slot: !type:ContainerSlot
      machine_board: !type:Container
      machine_parts: !type:Container
  - type: Construction
    graph: Machine
    node: machine
    containers:
    - machine_board
    - machine_parts
