- type: entity
  id: MobSpaceWhale
  parent: [ SimpleSpaceMobBase, FlyingMobBase, MobCombat, NightVisionComfortOrange ] # LuaM add NightVisionComfortOrange
  name: Космический Кит
  description: Любимый питомец богов
  categories: [ HideSpawnMenu ]
  components:
  - type: SpaceWhale
  - type: TailedEntity
    amount: 55
    speed: 86
    spacing: 1
    kinematicFollow: true
    followLerp: 0.65
    followInterval: 1
    followLerpFalloff: 0.015
    wiggleAmplitude: 0
    wiggleFrequency: 0
    stiffness: 40
    damping: 80
    minLengthMultiplier: 1
    maxLengthMultiplier: 1
    prototype: MobSpaceWhaleSegment
  - type: MovementSpeedModifier
    baseRunningSpeed: 80
    baseWalkSpeed: 80
    baseSprintSpeed: 80
  - type: RadarBlip
    radarColor: "#FF4444"
    scale: 3
    shape: Circle
    visibleFromOtherGrids: true
    requireNoGrid: true
    maxDistance: 4096
  - type: RadarSonarEcho
  - type: MovementIgnoreGravity
    weightless: true
  - type: MovementAlwaysTouching
  - type: WarpPoint
    follow: true
    location: Левиафан
  - type: HTN
    rootTask:
      task: SpaceWhaleCompound
    sleepPlayerCheckRangeOverride: 2500
    blackboard:
      NavSmash: !type:Bool
        true
      MeleeRange: !type:Single
        4
      VisionRadius: !type:Single
        2000
      AggroVisionRadius: !type:Single
        2000
  - type: NpcFactionMember
    factions:
    - Dragon
  - type: InputMover
  - type: MobMover
  - type: Physics
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 2
        density: 137992
        mask:
        - FlyingMobMask
        layer:
        - FlyingMobLayer
  - type: MeleeWeapon
    altDisarm: false
    attackRate: 0.3
    angle: 0
    animation: WeaponArcBite
    soundHit:
      path: /Audio/Effects/bite.ogg
    damage:
      types:
        Blunt: 10
        Slash: 15
        Structural: 150
  - type: Speech
    speechVerb: LargeMob
  - type: InteractionPopup
    interactSuccessString: petting-success-leviathan
    interactFailureString: petting-failure-leviathan
    interactFailureSound:
      path: /Audio/Effects/bite.ogg
  - type: Sprite
    sprite: _Goobstation/Mobs/SpaceWhale/leviathan.rsi
    layers:
    - state: head
    - state: overlay
      shader: unshaded
    noRot: false
  # - type: NightVision # LuaM delete
  #   color: "#808080"
  #   activateSound: null
  #   deactivateSound: null
  - type: AmbientSound
    enabled: true
    volume: 1
    range: 700
    sound:
      path: /Audio/_Goobstation/Ambience/SpaceWhale/leviathan-ambient.ogg
  - type: MobState
  - type: MobThresholds
    thresholds:
      0: Alive
      36000: Dead
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 36000
      behaviors:
      - !type:GibBehavior { }
  - type: DamageOnCollide
    inverted: true
    damage:
      types:
        Structural: 320
        Blunt: 5
  - type: SpaceWhaleTileDevour
    devourInterval: 0.5
    tilesPerBite: 3
    entitiesPerBite: 6
    damage:
      types:
        Structural: 350
        Blunt: 10
    ignoreWhitelist:
      tags:
      - SpaceLeviathan
  - type: CombatMode
  - type: Appearance
  - type: Damageable
    damageContainer: Biological
  - type: Stamina
    critThreshold: 600
  - type: Flammable
    damage:
      types: {}
  - type: StatusEffects
    allowed:
    - Stutter
    - Electrocution
    - TemporaryBlindness
    - Pacified
    - RadiationProtection
    - Adrenaline
  - type: Temperature
    heatDamageThreshold: 800
  - type: Tag
    tags:
    - CannotSuicide
    - DoorBumpOpener
    - StunImmune
    - SpaceLeviathan
  - type: Butcherable
    spawned:
    - id: FoodMeatFish
      amount: 8

- type: entity
  id: MobSpaceWhaleSegment
  parent: FlyingMobBase
  name: space whale segment
  suffix: do not spawn
  categories: [ HideSpawnMenu ]
  components:
  - type: RadarBlip
    scale: 2
    shape: Circle
    visibleFromOtherGrids: true
  - type: RadarSonarEcho
  - type: Sprite
    sprite: _Goobstation/Mobs/SpaceWhale/leviathan.rsi
    state: segment
    noRot: false
  - type: Tag
    tags:
    - HideContextMenu
    - SpaceLeviathan
  - type: Physics
    bodyType: KinematicController
    canCollide: false
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 2
        hard: false
        density: 1
        mask: []
        layer: []

- type: entity
  parent: RogueSiliconGiftBox # Нужно дополнить
  id: SpaceWhaleLootBox
  name: space whale innards
  description: The processed remains of a space whale. Contains a recovered drone data recorder.
  suffix: Space Whale Loot
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _NF/Objects/Tools/bundles.rsi
    state: engi-base
    scale: 0.8, 0.8
  - type: RadarBlip
    radarColor: "#44FF44"
    scale: 1.5
    requireNoGrid: true
    shape: Square
  - type: SpawnItemsOnUse
    items:
    - id: ClothingBackpackDroneLootT1W #Lua: added W suffix to avoid conflict with T1 loot box
      orGroup: droneLoot
    - id: ClothingBackpackDroneLootT21W #Lua: added W suffix to avoid conflict with T21 loot box
      orGroup: droneLoot
    - id: ClothingBackpackDroneLootT22W #Lua: added W suffix to avoid conflict with T22 loot box
      orGroup: droneLoot
    sound:
      path: /Audio/Machines/windoor_open.ogg


# просто клон прошлого ИИ-китового дропа с суфиксами, без изменений
- type: entity
  parent: RogueSiliconGiftBox
  id: ClothingBackpackDroneLootT1W
  name: blackbox data recorder (T1)
  description: Data recorder from a drone. Contains valuable components.
  suffix: Drone Loot
  components:
  - type: RadarBlip
    radarColor: "#FFFF00"
    scale: 1
    requireNoGrid: true
    shape: square
  - type: SpawnItemsOnUse
    items:
    # Money - 30k # removed
    # Scrap chunks
    - id: ScrapOre100
      amount: 1
    # Material
    - id: SheetPlastitanium10
      amount: 2
    # Parts
    - id: SuperCapacitorStockPart
      prob: 0.8
      amount: 3
    - id: SuperMatterBinStockPart
      prob: 0.6
      amount: 2
    - id: PicoManipulatorStockPart
      prob: 0.8
      amount: 2
    - id: SpawnDungeonLootPowerCell
      prob: 0.5
    # - id: SpawnDungeonLootPartsEngi #Mono: mostly trash and bloat
    #   amount: 3
    #   prob: 0.25
    # Circuit boards
    - id: SpawnDungeonLootCircuitBoardEngi
      prob: 0.3
    - id: SpawnDungeonLootCircuitBoardScience
      prob: 0.3
    - id: SpawnDungeonLootCircuitBoardSalvage
      prob: 0.3
    - id: SpawnDungeonLootCircuitBoard
      prob: 0.3
    # Flatpacks
    - id: SpawnDungeonLootFlatpacks
      prob: 0.6
    # rare shard drop even from T1
    - id: WeaponTurretShardFlatpack
      prob: 0.5
    # Research disk, expected value ~30k/drone
    - id: RogueSiliconResearchDisk5000
    - id: RogueSiliconResearchDisk10000
    - id: RogueSiliconResearchDisk25000
      prob: 0.6
    # Tech disk
    - id: SpawnLootTechDisksT1
      prob: 0.5
    sound:
      path: /Audio/Machines/windoor_open.ogg

