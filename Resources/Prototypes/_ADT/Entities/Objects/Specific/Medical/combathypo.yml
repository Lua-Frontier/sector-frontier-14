- type: entity
  parent: BaseItem
  id: ADTCombatHypo
  name: Боевой джет-инъектор
  description: Модель джет-инъектора, разработанная NT для использования в боевых ситуациях - с повышенным объемом в ущерб скорости применения.
  components:
  - type: Sprite
    sprite: ADT/Objects/Specific/Medical/adt_combathypo.rsi
    state: icon
  - type: Item
    sprite: ADT/Objects/Specific/Medical/adt_combathypo.rsi
  - type: SolutionContainerManager
    solutions:
      hypospray:
        maxVol: 30
  - type: RefillableSolution
    solution: hypospray
  - type: ExaminableSolution
    solution: hypospray
  - type: Injector
    solutionName: hypospray
    activeModeProtoId: HyposprayDynamicMode
    allowedModes:
    - HyposprayDynamicMode
    - HyposprayInjectMode
  - type: UseDelay
    delay: 1.0
