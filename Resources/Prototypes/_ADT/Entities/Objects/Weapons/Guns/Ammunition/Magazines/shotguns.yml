- type: entity
  id: BaseMagazine12_gaugeXL
  name: ammo drum XL (12 gauge shells)
  parent: BaseItem
  abstract: true
  components:
  - type: Tag
    tags:
    - Magazine12_gaugeBuckshot
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
        - ShellShotgun12_gaugeBuckshot
    capacity: 16
    soundRack:
      path: /Audio/_Corvax/Weapons/Guns/Cock/shotgun_cock.ogg # Corvax-Guns
  - type: Item
    size: Small
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    sprite: /Textures/ADT/Objects/Weapons/Guns/Ammunition/Magazine/xl.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 2
    zeroVisible: false
  - type: Appearance

- type: entity
  id: Magazine12_gaugeXLEmpty
  name: ammo drum XL (12 gauge shells any)
  suffix: empty
  parent: BaseMagazine12_gaugeXL
  components:
  - type: BallisticAmmoProvider
    proto: null
  - type: Sprite
    layers:
    - state: pellets
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]

- type: entity
  id: Magazine12_gaugeXLSlug
  categories: [ HideSpawnMenu ]
  name: ammo drum XL (12 gauge slug)
  parent: BaseMagazine12_gaugeXL
  components:
  - type: BallisticAmmoProvider
    proto: ShellShotgun12_gaugeSlug
  - type: Sprite
    layers:
    - state: slug
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]

- type: entity
  id: Magazine12_gaugeXL
  categories: [ HideSpawnMenu ]
  name: ammo drum XL (12 gauge buckshot)
  parent: BaseMagazine12_gaugeXL
  components:
  - type: BallisticAmmoProvider
    proto: ShellShotgun12_gaugeBuckshot
  - type: Sprite
    layers:
    - state: pellets
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
