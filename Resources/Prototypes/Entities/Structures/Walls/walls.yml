    snap:
    - Wall
  components:
  - type: Tag
    tags:
    - Diagonal
  - type: Sprite
    drawdepth: Walls
    sprite: _NF/Structures/Walls/reinforced_diagonal.rsi # Frontier: _NF folder
    state: state0
  - type: IconSmooth
    mode: DiagonalNF # Frontier: Diagonal<DiagonalNF
    key: walls
    base: state
  - type: Icon
    sprite: _NF/Structures/Walls/reinforced_diagonal.rsi # Frontier: _NF folder
    state: state0
  - type: RadiationBlocker
    resistance: 5
  - type: Construction # Lua
    graph: DiagonalGirder
    node: diagonalReinforcedWall
  - type: RCDDeconstructable # Lua
    cost: 6 # Lua
    delay: 8 # Lua
  - type: Destructible # Mono - override HP from diagonal parent
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 1100 # Mono
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalSlam
    - trigger:
        !type:DamageTrigger
        damage: 1000 # Mono
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalSlam
      - !type:ChangeConstructionNodeBehavior
        node: girder
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: ShipRepairable
    repairTime: 2
    repairCost: 3

