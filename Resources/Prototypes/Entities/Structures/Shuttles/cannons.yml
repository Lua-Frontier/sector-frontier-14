# Most of these have DO NOT MAP, since stations are completely unequipped to deal with ship combat + these are basically placeholder.

- type: entity
  id: ShuttleGunBase
  parent: BaseStructure
  name: shittle gun
  abstract: true
  categories: [ ShuttleGun ]
  components:
  - type: RadarBlip
    radarColor: "#CF0E0E"
    scale: 1
  - type: ExtensionCableReceiver
  - type: LightningTarget
    priority: 1
  - type: ApcPowerReceiver
    powerLoad: 250
  - type: FireControllable
  - type: Appearance
  - type: InteractionOutline
  - type: Anchorable
    delay: 120
  - type: Rotatable
  - type: ContainerContainer
  - type: Gun
    recoil: 0
    recoilRotation: 0
    selectedMode: SemiAuto
    availableModes:
      - SemiAuto
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Electronic
  - type: DeviceNetwork
    deviceNetId: Wireless
    receiveFrequencyId: BasicDevice
  - type: WirelessNetworkConnection
    range: 200
  - type: DeviceLinkSink
    ports:
    - Trigger
    - Toggle
    - On
    - Off
  - type: AutoShootGun
  - type: GunSignalControl
  - type: StaticPrice
    price: 1500
  - type: Repairable # Frontier
    doAfterDelay: 3 # Frontier

# ---- Laser weapon branch ----

- type: entity
  id: ShuttleGunSvalinnMachineGun
  parent:
  - BallisticArtillery
  - BallisticArtilleryTier1HP
  - ConstructibleMachine
  name: LSE-400c "Svalinn machine gun"
  description: Basic stationary laser unit. Effective against live targets and electronics. Uses regular power cells to fire, and has an extremely high rate of fire.
  components:
  - type: StaticPrice
    price: 1500
  - type: RadarBlip
    radarColor: "#1c89d1"
    scale: 1
    visibleFromOtherGrids: true
  - type: ShipGunType
    shipType: Energy
  - type: ShipGunClass
    shipClass: Superlight
  - type: Sprite
    sprite: Objects/Weapons/Guns/Shuttles/laser.rsi
    layers:
    - state: lse-400c
    - state: mag-unshaded-9
      map: ["enum.GunVisualLayers.MagUnshaded"]
      shader: unshaded
  - type: Appearance
  - type: AmmoCounter
  - type: Battery
    maxCharge: 20000
    startingCharge: 20000
  - type: BatterySelfRecharger
    autoRecharge: true
    autoRechargeRate: 400
  - type: ExaminableBattery
  - type: WirelessNetworkConnection
    range: 500
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 900
      behaviors:
        - !type:ChangeConstructionNodeBehavior
          node: machineFrame
        - !type:DoActsBehavior
          acts: ["Destruction"]
  - type: Gun
    fireRate: 6
    useKey: false
    recoil: 0
    minAngle: 0
    maxAngle: 5
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/ship_svalinn.ogg
      params:
        variation: 0.05
    soundEmpty:
      path: /Audio/Weapons/Guns/EmptyAlarm/smg_empty_alarm.ogg
  - type: SpaceArtillery
    powerChargeRate: 400
    powerUsePassive: 150
    powerUseActive: 0
  - type: FireControlRotate
  - type: Actions
  - type: AutoShootGun
  - type: GunSignalControl
  - type: DeviceLinkSink
    ports:
    - SpaceArtilleryLoad
    - Toggle
    - On
    - Off
  - type: MagazineVisuals
    magState: mag
    steps: 10
    zeroVisible: true
  - type: HitscanBatteryAmmoProvider
    proto: NFRedSvalinnShuttleLaser
    fireCost: 10
  - type: ShipRepairable
    repairTime: 10
    repairCost: 20
  - type: Machine
    board: ShuttleGunSvalinnMachineGunCircuitboard
  - type: ContainerContainer
    containers:
      machine_board: !type:Container
      machine_parts: !type:Container

