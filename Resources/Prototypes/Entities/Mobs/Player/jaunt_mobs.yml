- type: entity
  name: jaunt
  parent: [Incorporeal, BaseMob]
  id: BaseMobJaunt
  description: Faint traces of a humanoid figure linger here
  suffix: Ethereal
  components:
  - type: ContentEye
    maxZoom: 1.44,1.44
  - type: Eye
    drawFov: false
  - type: Input
    context: "ghost"
  - type: InputMover
  - type: MovementSpeedModifier
    baseRunningSpeed: 12
    baseWalkSpeed: 8
  - type: Visibility
    layer: 2
  - type: Spectral

# Should be slow, for balance
- type: entity
  name: jaunt
  parent: BaseMobJaunt
  id: EtherealJaunt
  suffix: Wizard
  components:
  - type: Sprite
    sprite: Mobs/Ghosts/ghost_human.rsi
    color: "#60f7eb"
    layers:
    - state: animated
      shader: unshaded
    noRot: true
    overrideContainerOcclusion: true
    drawdepth: Ghosts
  - type: MovementSpeedModifier
    baseRunningSpeed: 6
    baseWalkSpeed: 4

- type: entity
  parent: [Incorporeal, BaseMobUnmovable]
  id: DesynchronizedPocket
  name: desynchronized pocket
  description: A pocket in spacetime, keeping the user a fraction of a second in the future.
  components:
  - type: Spectral
  - type: MovementSpeedModifier
    baseRunningSpeed: 0
    baseWalkSpeed: 0

- type: entity
  save: false
  id: BaseMobUnmovable
  abstract: true
  components:
  - type: Sprite
    noRot: true
    drawdepth: Mobs
  - type: MobCollision
  - type: Physics
    bodyType: KinematicController
  - type: ForceAnchor
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 50
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: Clickable
  - type: InteractionOutline
  - type: LagCompensation
  - type: Actions
  - type: Alerts
  - type: Appearance
  - type: RotationVisuals
    defaultRotation: 0
    horizontalRotation: 0
  - type: DoAfter
  - type: Examiner
  - type: Eye
  - type: ContentEye
  - type: CameraRecoil
  - type: Telescope # Lua: СТАРОЕ<НОВОЕ default look-up aiming source like Hullrot base mob
  - type: MindContainer
  - type: RequireProjectileTarget
    active: False
  - type: AnimatedEmotes # goob edit - animated emotes
  - type: TTS # Corvax-TTS
  - type: PassiveThermalSignature # Mono
    signature: 225 # if nothing else is generating heat, 30m radius, 60m with 4 mobs, 120 with 16
  - type: ThermalSignature # Mono
  - type: StunVisuals
