- type: entity
  parent: BaseItem
  id: VipShareholderGiftBox
  name: vip-shareholder-bundle
  abstract: true
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Lua/Objects/Tools/vipbundles.rsi
    state: share-base
    scale: 0.7, 0.7
  - type: Item
    size: Normal
  - type: Clothing
    slots:
    - back
    quickEquip: false
    sprite: _Lua/Objects/Tools/vipbundles.rsi
    clothingVisuals:
      back:
      - state: mask_null
  - type: SpawnItemsOnUse
    items: []
    sound:
      path: /Audio/Machines/windoor_open.ogg

- type: entity
  id: ScienceLabBundleLootAnchor
  abstract: true
  categories: [ HideSpawnMenu ]
  components:
  - type: SpawnItemsOnUse
    items: &ScienceLabBundleLoot
    - id: ExosuitFabricatorFlatpack
    - id: MachineAnomalyVesselFlatpack
    - id: CircuitImprinterFlatpack
    - id: BlueprintLithographFlatpack
    - id: ResearchAndDevelopmentServerFlatpack
    - id: ComputerResearchAndDevelopmentFlatpack
    - id: MachineArtifactAnalyzerFlatpack
    - id: AutolatheFlatpack
    - id: ProtolatheFlatpack
    - id: ComputerAnalysisConsoleFlatpack
    - id: MachineAPEFlatpack
    - id: AnomalyScanner
    - id: NodeScanner
    - id: Multitool

- type: entity
  parent: VipShareholderGiftBox
  id: VipBundleScienceLab
  name: uplink-vip-LabBundle-name
  description: uplink-vip-LabBundle-desc
  components:
  - type: SpawnItemsOnUse
    items: *ScienceLabBundleLoot
    sound:
      path: /Audio/Machines/windoor_open.ogg

