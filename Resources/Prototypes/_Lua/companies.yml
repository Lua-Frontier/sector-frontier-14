- type: company
  id: Nanotrasen
  name: Nanotrasen
  iconPath: /Textures/Structures/Decoration/banner.rsi/banner.png
  description: Галактическая мегакорпорация, основанная в 2137 году. Лидер в области исследований, БлюСпейс-технологий и добычи плазмы. Управляется Советом Директоров, обладает мощными вооружёнными силами. Доминирует в ОПЗ и СНК, ведёт холодную войну с Синдикатом. Контролирует станции, экономику и законодательство через строгую корпоративную структуру.
  motd: "Вы действуете от имени Nanotrasen. Поддерживайте корпоративный порядок, защищайте инфраструктуру и действуйте в рамках иерархии и регламентов."
  color: "#2595db"
  form: Протогонисты
  showCompanyRadar: true
  hiddenFromNonMembers: true
  leaderJobs: [ StationRepresentative ]
  npcFactions: [ NanoTrasen ]

- type: company
  id: Security
  name: Служба Безопасности
  iconPath: /Textures/_NF/Structures/Decoration/banner.rsi/nfsd-banner.png
  description: Вооружённое подразделение, обеспечивающее порядок на объектах корпорации. В её задачи входят охрана персонала, борьба с внутренними и внешними угрозами, задержание преступников, поддержание режима. Подчиняется КЗ и кодам угроз станции.
  motd: "Служба Безопасности ожидает дисциплины и быстрой реакции. Защищайте объекты, пресекайте угрозы и работайте в координации с командованием фракции."
  color: "#009954"
  form: Протогонисты
  showCompanyRadar: true
  hiddenFromNonMembers: true
  leaderJobs: [ Sheriff ]
  npcFactions: [ NanoTrasen ]

- type: company
  id: Neutral
  name: Нейтральные
  iconPath: /Textures/Structures/Wallmounts/flags.rsi/blank_flag.png
  description: Независимые гражданские и наёмники Фронтира. Не входят в корпоративные или военизированные структуры и зарабатывают контрактами, перевозками, охраной и другой свободной работой. Их основной точкой сбора служит Чёрный рынок.
  motd: "Вы представляете нейтральных жителей Фронтира. Ваши решения остаются за вами, но выживание зависит от осторожности, выгодных связей и понимания текущего баланса сил."
  color: "#b39b6b"
  form: Нейтральные
  hiddenFromNonMembers: true
  npcFactions: [ Neutral ]

- type: company
  id: StormCreed
  name: Кодекс Бури
  iconPath: /Textures/Structures/Wallmounts/flags.rsi/Stormcreed_flag.png
  description: Фракция, состоящая из бывших наёмников ныне несуществующего Братства Бури. Nanotrasen называет их террористами, остатки Братства - предателями, а Синдикат - удобным инструментом. Сам Кодекс не придумывает названий - он тихо копит силы в неосвоенных периферийных секторах, чтобы в один день вернуть власть и свободу в родной дом...
  motd: "Кодекс Бури требует верности делу и скрытности. Действуйте организованно, не раскрывайте лишнего и помните, что каждая операция должна усиливать фракцию."
  color: "#948471"
  form: Антаганисты
  showCompanyRadar: true
  hiddenFromNonMembers: true
  aliesOnRadar: true
  leaderJobs: [ StormCreedCaptain ]

- type: company
  id: Pirates
  name: Пираты
  iconPath: /Textures/Structures/Wallmounts/flags.rsi/pirate_flag.png
  description: Разрозненные команды налётчиков и вольных капитанов, для которых Фронтир служит одновременно убежищем, рынком добычи и охотничьими угодьями. Они не подчиняются Кодексу Бури и действуют ради наживы, славы и собственных пиратских договорённостей.
  motd: "Пираты живут добычей и репутацией. Берите то, что можете удержать, не подставляйте свою команду по глупости и уважайте силу капитана."
  color: "#3a2616"
  form: Антаганисты
  showCompanyRadar: true
  hiddenFromNonMembers: true
  aliesOnRadar: true
  leaderJobs: [ NFPirateCaptain ]
  npcFactions: [ NFPirate ]

- type: company
  id: Syndicate
  name: Синдикат
  iconPath: /Textures/Structures/Wallmounts/flags.rsi/syndie_flag.png
  description: Преступная организация на Фронтире с разрозненной структурой, торгующая оружием, наркотиками и имплантами. Поддерживается такими корпорациями, как Cybersun и Saibasan. Влияет на экономику, коррупцией проникает во власть. Использует насилие, шантаж и вербовку. Черный рынок — основа его существования и деятельности.
  motd: "Синдикат ценит результат, прибыль и влияние. Работайте скрытно, используйте связи и не забывайте, что слабость быстро становится товаром для чужих рук."
  color: "#990816"
  form: Антаганисты
  hiddenFromNonMembers: true
  aliesOnRadar: true
  leaderJobs: [ OutpostTypanTelecommunicationsOfficer ]
  npcFactions: [ Syndicate, NFSyndicate, LuaNordFoll ]
