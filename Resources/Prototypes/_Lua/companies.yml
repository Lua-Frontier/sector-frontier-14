- type: company
  id: Traders
  name: Гильдия Торговцев
  description: Это место собрания всех гуманоидов занимающихся торговлей, легальной и нелегальной, основной целью Гильдии Торговцев это выгода и кредиты. Гильдия состоит из множество разрозненных торговых станций по всем секторам имеющий прибыл, руководить же всем совет Торговцев из несколько самых крупных станций В пределах секторов где есть станции, исследователи, пилоты и наёмники из Гильдии Торговцев обязаны платить часть выручки за проданный товар, взамен же те получают охрану и рыночную информацию из первых. В дальних секторах на подобии фронтира - защиты уже нету, но в месте с этим и налога за проданный товар, хоть все еще и может дойти информация об рыночных ценах и выгодных сделках, но в далеких краях она часто устраивает.
  color: "#7e92af"
  form: Нейтральные

- type: company
  id: Medical
  name: Орден Гиппократа
  description: Бывшие специалисты медицинского ремесла, покинувшие работу по личному желанию или сокращению штата, но все еще остались верны клятве Гиппократа. Орден Гиппократа это только название, не имеющего структуры, в свою же очередь, это место где врачи совершенствуются в этом деле, передавая опыт от гуманоида к гуманоиду, от поколения к поколению и все ради одной цели - помочь нуждающимся. Хоть Орден без официальной структуры и правил, в него просто так не попасть. Требуется диплом медицинских наук и отсутствия уголовного преступления завязанного на вреде живому гуманоиду, в ином случае вас никто не признает из настоящего члена Ордена. У Ордена Гиппократа есть только единственное место где присутствует структура власти и правила - независимая станция “Белый свет”. Место управляет совет Врачей и Хирургов, прошедших через множество операций. С согласования совета можно стать настоящим представителем фракции, но это не только статус но и обязательства которых нету у простых приверженцев Ордена. Орден же не раскрывает своих правил, только общую цель - “Помочь всем нуждающимся в медицинской помощи.” А сама станция закрыта для свободного посещения.

  color: "#c2e7ff"
  form: Нейтральные

- type: company
  id: Miners
  name: Шахтёры Бездны
  description: Спецы шахтёрского ремесла, которым нету равных в добыче ископаемых ресурсов на астероидах и планетах, обычно это гуманоиды которые любят выпить в шахтёрских барах которые и являются неофициальным место встреч всех шахтёров. Структуры же у них нету, лишь статус великолепного шахтёра и навыки, которые обычно не сравнимы с другими любителями покапать. Хоть и шахтёров нету структуры, но у ветеранов этого ремесла почти на всех шахтёрских верфях есть неплохие скидки на ремонт и обслуживание шаттлов.
  color: "#ffdfae"
  form: Нейтральные

- type: company
  id: Science
  name: Научный Флот
  description: Рассыпанные по галактике исследователи, ранее бывшие в одном больше флоте, занимались наукой и продажей технологий, имеющие руководство и иерархию на флагманском шаттле-станция, но после коллапса нескольких аномалий, уничтожившие станцию и руководство. С момента потери руководства, Научный Флот распался на одиночных ученых, странствующих в дальних секторах в поисках научных открытий будучи верны своей работе. Нередки случая маленьких эскадрилий научного флота, работавшие в дальних секторах на подобии фронтира, правил в таких эскадрильях нету, но обычно преследуется цель в продаже технологий для личного обогащения.
  color: "#e8bbfd"
  form: Нейтральные

