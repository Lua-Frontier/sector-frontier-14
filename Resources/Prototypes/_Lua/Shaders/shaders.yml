# Hair/fur linear gradient used in customization
- type: shader
  id: HairGradient
  kind: source
  path: "/Textures/_Lua/Shaders/hair_linear_gradient.swsl"
  params:
    color1: 1, 0, 0
    color2: 1, 1, 1
    direction: 0
  light_mode: shaded

# Monolith addition
# Cuts out everything outside of a circle
# Anti-aliased so the edges are smooth
# Radius is relative to target size (0.5 is a full circle)
- type: shader
  id: CircleAlphaMask
  kind: source
  path: "/Textures/_Lua/Shaders/circle_alpha_mask.swsl"

- type: shader
  id: EmpLua
  kind: source
  path: "/Textures/_Lua/Shaders/emp_lua.swsl"
  params:
    positionInput: 0,0
    life: 0

# Luna UI SDF strokes (starmap etc.) — coverage AA at original 1px weight.
# Per-draw color/params are vertex-packed (UV + modulate); no uniforms — Clyde
# defers draws and would otherwise apply the last SetParameter to every stroke.
- type: shader
  id: LunaSdfLine
  kind: source
  path: "/Textures/_Lua/Shaders/luna_sdf_line.swsl"

- type: shader
  id: LunaSdfDisk
  kind: source
  path: "/Textures/_Lua/Shaders/luna_sdf_disk.swsl"
