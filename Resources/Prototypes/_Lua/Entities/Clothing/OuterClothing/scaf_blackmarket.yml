- type: entity
  parent: [ClothingOuterHardsuitBase, BaseC3SyndicateContraband, HardsuitIdentify]
  id: ClothingOuterHardsuitWarlord
  name: Warlord Elite Hardsuit
  description: Довольно дорогая модель легкого боевого скафандра, не так давно появившаяся на Черном Рынке. Краска цвета хаки не имеет ни одного скола.
  suffix: BlackMarket, Light, Standart
  components:
  - type: Sprite
    sprite: _Mono/Clothing/OuterClothing/Hardsuits/merc_warlordsuit.rsi
  - type: Item
    size: Huge
  - type: Clothing
    sprite: _Mono/Clothing/OuterClothing/Hardsuits/merc_warlordsuit.rsi
  - type: PressureProtection
    highPressureMultiplier: 0.5
    lowPressureMultiplier: 1000
  - type: ExplosionResistance
    damageCoefficient: 0.5
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.65
        Slash: 0.6
        Piercing: 0.6
        Heat: 0.65
        Radiation: 0.6
        Caustic: 0.8
  - type: StaminaDamageResistance
    coefficient: 0.6
  - type: ClothingSpeedModifier
    walkModifier: 0.95
    sprintModifier: 0.95
  - type: HeldSpeedModifier
  - type: ToggleableClothing
    requiredSlot: outerclothing
    blockUnequipWhenAttached: false
    replaceCurrentClothing: true
    clothingPrototypes:
      head: ClothingHeadHelmetHardsuitWarlord
      helmetcover: ClothingHeadHelmetCoverBlock
      helmetattachment: ClothingHeadHelmetAttachmentBlock
  - type: StaticPrice
    price: 750
    vendPrice: 2500

