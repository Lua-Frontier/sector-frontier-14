# Universal company spawn point: any job of the company can spawn here
# (round-start and latejoin). Place on faction stations instead of per-job spawners.

- type: entity
  id: SpawnPointCompanyBase
  parent: MarkerBase
  abstract: true
  suffix: Company Spawn
  components:
  - type: SpawnPoint
    spawn_type: LateJoin
  - type: Sprite
    sprite: Markers/jobs.rsi
    state: green

- type: entity
  id: SpawnPointCompanyUssp
  parent: SpawnPointCompanyBase
  name: точка спавна фракции
  suffix: СССП
  categories: [ USSP ]
  components:
  - type: SpawnPoint
    company: Ussp
    spawn_type: LateJoin
  - type: Sprite
    sprite: _Souz/Structures/Wallmounts/flags.rsi
    state: USSPCompany

