#TreasureSpawner from Armories
- type: entity
  parent: MarkerBase
  id: LuaArmorySpawnerTreasure
  name: Armory Treasure Spawner
  components:
  - type: Sprite
    layers:
    - state: pink
    - sprite: Objects/Materials/materials.rsi
      state: diamond
  - type: RandomSpawner
    prototypes:
    - SpaceCash5000
    - SpaceCash10000
    - SpaceCash20000
    - SpaceCash30000
    chance: 0.7
    offset: 0.0
    rarePrototypes:
    - MaterialDiamond
    rareChance: 0.1

