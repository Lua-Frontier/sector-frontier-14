- type: entity
  id: GameruleWeaponSpawnerT2
  parent: MarkerBasePlaceFree
  suffix: "Weapon, T2"
  components:
  - type: Sprite
    layers:
    - state: green
      scale: 0.7, 0.7
    - sprite: Objects/Weapons/Melee/katana.rsi
      state: icon
    - sprite: Effects/crayondecals.rsi
      state: 3
      color: red
  - type: RandomSpawner
    prototypes:
    # T2 Civilian
    - WeaponCaseLongVulcanExpedition
    - WeaponCaseLongJackdaw
    - WeaponCaseLongSniperCeremonialExpedition
    - WeaponCaseShortFaithExpedition
    - WeaponCaseLongC20r
    - WeaponCaseShortLuckyExpedition
    - WeaponCaseLongWT550Expedition
    - WeaponCaseLongEnforcerExpedition
    # T2 Blackmarket
    # T2 Civil Energy Weapons
    - WeaponCaseLongGunTurboExpedition
    - WeaponCaseLongWeaponLaserCannon
    - WeaponCaseLongEnergyGunExpedition
    - WeaponCaseLongWeaponXrayCannon
    - WeaponCaseShortWeaponMakeshiftLaser
    - WeaponCaseShortAdvancedLaserExpedition
    # T2 BlackMarket Energy Weapons
    - WeaponCaseShortAsakim
    chance: 1.0
    offset: 0.0
    rarePrototypes:
    - MercenaryTechFabCircuitboardNF
    - MedicalTechFabCircuitboard
    - ComputerIFFCircuitboard
    rareChance: 0.1

