- type: entity
  id: NfsdSectorPayoutCollector
  parent: [BaseComputer, BaseStructureDisableToolUse, BaseStructureIndestructible]
  categories: [ Security ]
  components:
  - type: Sprite
    sprite: _Lua/Structures/Machines/atm/sector_atm.rsi
    layers:
    - map: ["computerLayerBody"]
      state: atm_sector_nfsd
    - map: ["computerLayerScreen"]
      state: unshaded
  - type: ActivatableUI
    key: enum.PayoutCollectorUiKey.Key
  - type: UserInterface
    interfaces:
      enum.PayoutCollectorUiKey.Key:
        type: PayoutCollectorBoundUserInterface
  - type: ItemSlots
  - type: ContainerContainer
    containers:
      board: !type:Container
      payout-cashSlot: !type:ContainerSlot
  - type: FactionPayoutCollector
    faction: Security
    cashType: FrontierUplinkCoin
    cashSlot:
      name: payout-cashSlot
      insertSound: /Audio/Machines/scanning.ogg
      ejectSound: /Audio/Machines/tray_eject.ogg
      ejectOnBreak: true
      swap: false
      whitelist:
        components:
        - Currency
    payoutIntervalSeconds: 3600
    payoutPerStation: 1

