- type: entity
  parent: [VendingMachine, SmallConstructibleMachine]
  id: VendingMachineChiefEngineer
  name: ChiefEngiDrobe
  description:
  components:
  - type: VendingMachine
    pack: ChiefEngineerDrobeInventory
    offState: off
    brokenState: broken
    normalState: normal-unshaded
  - type: DatasetVocalizer
    dataset: EngiDrobeAds
  - type: SpeakOnUIClosed
    pack: GenericVendGoodbyes
  - type: Sprite
    sprite: _Lua/Structures/Machines/VendingMachines/CEDrobe.rsi
    layers:
    - state: "off"
      map: ["enum.VendingMachineVisualLayers.Base"]
    - state: "off"
      map: ["enum.VendingMachineVisualLayers.BaseUnshaded"]
      shader: unshaded
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: PointLight
    radius: 1.5
    energy: 1.6
    color: "#73ebe1"
  - type: Machine
    board: VendingMachineChiefEngineerMachineCircuitboard
  - type: ContainerContainer
    containers:
      cash_slot: !type:ContainerSlot
      machine_board: !type:Container
      machine_parts: !type:Container
  - type: Construction
    graph: Machine
    node: machine
    containers:
    - machine_board
    - machine_parts
