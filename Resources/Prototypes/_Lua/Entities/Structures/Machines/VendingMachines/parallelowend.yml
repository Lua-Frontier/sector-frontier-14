- type: entity
  parent: [VendingMachine, SmallConstructibleMachine]
  id: VendingMachineClothingParallelOwend
  name: Параллель-О-Венд
  description: Лучшие наряды из неизведанных краёв! Создано BrennNight Industries
  components:
  - type: VendingMachine
    pack: FrontierParallelInventory
    offState: off
    brokenState: broken
    normalState: normal-unshaded
    denyState: deny-unshaded
  - type: Sprite
    sprite: _Lua/Structures/Machines/VendingMachines/ParallelOWend.rsi
    layers:
    - state: "off"
      map: ["enum.VendingMachineVisualLayers.Base"]
    - state: "off"
      map: ["enum.VendingMachineVisualLayers.BaseUnshaded"]
      shader: unshaded
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: PointLight
    radius: 2
    energy: 1
    color: "#fa3667"
  - type: Machine
    board: VendingMachineClothingParallelOwendMachineCircuitboard
  - type: ContainerContainer
    containers:
      cash_slot: !type:ContainerSlot
      machine_board: !type:Container
      machine_parts: !type:Container
  - type: Construction
    graph: Machine
    node: machine
    containers:
    - machine_board
    - machine_parts
