# Faction-locked nuclear reactors adapted for Sector Frontier companies.

- type: entity
  id: NuclearReactorUnaffiliated
  parent: NuclearReactorCrew
  suffix: Neutral, Captain Locked
  components:
  - type: NuclearReactor
    prefab: ReactorPrefab7x7Normal
  - type: NameIdentifier
    group: NuclearReactor
  - type: AccessReader
    access: [["Captain"]]

- type: entity
  id: NuclearReactorPirate
  parent: NuclearReactorCrew
  suffix: Pirate Locked
  components:
  - type: NuclearReactor
    prefab: ReactorPrefab7x7Normal
  - type: NameIdentifier
    group: NuclearReactorPirate
  - type: AccessReader
    access: [["Pirate"]]

- type: entity
  id: NuclearReactorSmallEmpty
  parent: [NuclearReactorSmall, ConstructibleMachine]
  suffix: Empty
  components:
  - type: NuclearReactor
    prefab: ReactorPrefabEmpty
  - type: Machine
    board: NuclearReactorSmallEmptyMachineCircuitboard
  - type: Construction
    graph: Machine3x3
    node: machine
    containers:
    - machine_parts
    - machine_board
  - type: NameIdentifier
    group: NuclearReactorSmall
