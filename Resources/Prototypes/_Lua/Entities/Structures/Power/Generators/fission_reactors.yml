# Faction-locked nuclear reactors adapted for Sector Frontier companies.
# Access mapping:
#   Neutral / unaffiliated ships -> Captain
#   Security (NFSD)              -> Security
#   Pirates                      -> Pirate
#   Syndicate                    -> SyndicateAgent
#   CentComm                     -> CentralCommand

- type: entity
  id: NuclearReactorUnaffiliated
  parent: NuclearReactorCrew
  suffix: Neutral, Captain Locked
  components:
  - type: NuclearReactor
    prefab: ReactorPrefab7x7Normal
  - type: NameIdentifier
    group: NuclearReactor
  - type: AccessReader
    access: [["Captain"]]

- type: entity
  id: NuclearReactorSecurity
  parent: NuclearReactorCrew
  suffix: Security Locked
  components:
  - type: NuclearReactor
    prefab: ReactorPrefab7x7Normal
