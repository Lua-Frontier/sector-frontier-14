- type: entity
  id: BaseThruster
  parent: BaseStructureDynamic
  name: thruster
  description: A thruster that allows a shuttle to move.
  abstract: true
  components:
  - type: AmbientSound
    enabled: false
    range: 4
    volume: -4
    sound:
      path: /Audio/Effects/shuttle_thruster.ogg
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
  - type: Rotatable
    rotateWhileAnchored: true
  - type: Thruster
    baseThrust: 100
    thrust: 100
    damage:
      types:
        Heat: 40
        Structural: 40
  - type: ThermalSignature
  - type: InteractionOutline
  - type: Sprite
  - type: Appearance
  - type: ThrusterVisuals
  - type: ApcPowerReceiver
    powerLoad: 1500
  - type: ExtensionCableReceiver
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Electronic
  - type: StaticPrice
    price: 300
  - type: GuideHelp
    guides:
    - ShuttleCraft
  placement:
    mode: SnapgridCenter

- type: entity
  id: BaseThrusterNormal
  parent: [BaseThruster, ConstructibleMachine]
  abstract: true
  components:
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 190
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 600
      behaviors:
        - !type:DoActsBehavior
          acts: ["Destruction"]
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
        - !type:DoActsBehavior
          acts: ["Destruction"]
        - !type:PlaySoundBehavior
          sound:
            collection: MetalBreak
        - !type:ChangeConstructionNodeBehavior
          node: machineFrame
  - type: DeviceNetwork
    deviceNetId: Wireless
    receiveFrequencyId: BasicDevice
  - type: WirelessNetworkConnection
    range: 200
  - type: DeviceLinkSink
    ports:
    - On
    - Off
    - Toggle
  - type: RadarBlip
    radarColor: "#99FF99"
    scale: 1
    shape: diamond
    gridConfig:
      color: "#99FF99"
      shape: Square
      respectZoom: true
      rotate: true
      bounds: "-0.5,-0.5,0.5,0.5"
  - type: ShipRepairable
    repairCost: 2

- type: entity
  id: BaseThrusterMedium
  parent: [BaseThruster, ConstructibleMachine]
