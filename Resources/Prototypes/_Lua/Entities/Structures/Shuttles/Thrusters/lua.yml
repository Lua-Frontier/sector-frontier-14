- type: entity
  id: ThrusterLua
  parent: Thruster
  suffix: LuaTech, 120
  components:
  - type: LuaTech
  - type: NebulaThrustResistance
    resistance: 0.65
  - type: Machine
    board: ThrusterLuaMachineCircuitboard
  - type: Thruster
    baseThrust: 100
    thrust: 240
  - type: Sprite
    sprite: _Lua/Structures/Shuttles/thruster32.rsi
    layers:
    - state: base_luatech
      map: ["enum.ThrusterVisualLayers.Base"]
    - state: thrust_luatech
      map: ["enum.ThrusterVisualLayers.ThrustOn"]
      shader: unshaded
      visible: false
      color: "#7653BA"
    - state: thrust_burn_unshaded
      map: ["enum.ThrusterVisualLayers.ThrustingUnshaded"]
      shader: unshaded
      visible: false
      offset: 0, 1
      color: "#7653BA"

- type: entity
  id: OmniThrusterLua
  parent: BaseThrusterLarge
  name: omni thruster
  suffix: LuaTech, Magnetic, 120
  components:
  - type: LuaTech
  - type: NebulaThrustResistance
    resistance: 0.65
  - type: Tag
    tags:
    - OmniBurnAlwaysOn
  - type: Construction
    graph: Machine
    node: machine
    containers:
    - machine_parts
    - machine_board
  - type: Machine
    board: OmnidirectionalThrusterMachineCircuitboard
  - type: ApcPowerReceiver
    powerLoad: 10000
  - type: Thruster
    thrusterType: Omnidirectional
    baseThrust: 800
    thrust: 1920
    angularThrustExtra: 2850
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-1.49,-0.49,1.49,0.49"
        density: 1750
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Sprite
    sprite: _Lua/Structures/Shuttles/thruster96.rsi
    layers:
    - state: base_luatech_omni
      map: ["enum.ThrusterVisualLayers.Base"]
    - state: thrust_omni_luatech
      map: ["enum.ThrusterVisualLayers.ThrustOn"]
      shader: unshaded
      visible: false
      color: "#7962a8"
    - state: thrust_burn_omni_unshaded
      map: ["enum.ThrusterVisualLayers.ThrustingUnshaded"]
      shader: unshaded
      visible: false
      offset: 0, 1.85
      color: "#d5c9ee"
  - type: PointLight
    enabled: false
    castShadows: false
    radius: 1.5
    color: "#7962a8"
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 15000
      behaviors:
        - !type:DoActsBehavior
          acts: ["Destruction"]
        - !type:SpawnEntitiesBehavior
          spawn:
            TeslaMiniEnergyBall:
              min: 1
              max: 3
        - !type:PlaySoundBehavior
          sound:
            collection: MetalBreak
    - trigger:
        !type:DamageTrigger
        damage: 7500
      behaviors:
        - !type:DoActsBehavior
          acts: ["Destruction"]
        - !type:PlaySoundBehavior
          sound:
            collection: MetalBreak
        - !type:ChangeConstructionNodeBehavior
          node: machineFrame
