- type: entity
  id: ThrusterPirates
  parent: Thruster
  suffix: Pirates, 68
  components:
  - type: Machine
    board: ThrusterPiratesMachineCircuitboard
  - type: Thruster
    baseThrust: 100
    thrust: 136
  - type: Sprite
    sprite: _Lua/Structures/Shuttles/thruster32.rsi
    layers:
    - state: base_pirate
      map: ["enum.ThrusterVisualLayers.Base"]
    - state: thrust
      map: ["enum.ThrusterVisualLayers.ThrustOn"]
      shader: unshaded
      visible: false
      color: "#C4511C"
    - state: thrust_burn_unshaded
      map: ["enum.ThrusterVisualLayers.ThrustingUnshaded"]
      shader: unshaded
      visible: false
      offset: 0, 1
      color: "#C4511C"

