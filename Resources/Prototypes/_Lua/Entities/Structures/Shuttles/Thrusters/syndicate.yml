- type: entity
  id: ThrusterRogue
  parent: Thruster
  suffix: Syndicate, 76
  components:
  - type: Machine
    board: ThrusterRogueMachineCircuitboard
  - type: Thruster
    baseThrust: 100
    thrust: 152
  - type: Sprite
    sprite: _Lua/Structures/Shuttles/thruster32.rsi
    layers:
    - state: base_rogue
      map: ["enum.ThrusterVisualLayers.Base"]
    - state: thrust
      map: ["enum.ThrusterVisualLayers.ThrustOn"]
      shader: unshaded
      visible: false
      color: "#8F002B"
    - state: thrust_burn_unshaded
      map: ["enum.ThrusterVisualLayers.ThrustingUnshaded"]
      shader: unshaded
      visible: false
      offset: 0, 1
      color: "#8F002B"

- type: entity
  id: ThrusterRogueStealth
  parent: [BaseStructureDisableToolUse, ThrusterRogue]
  name: stealth thruster
  suffix: Syndicate, Stealth, 60
  description: A thruster with a reduced drive-plume and thermal output, but significantly less thrust.
  components:
  - type: NebulaThrustResistance
    resistance: 0.5
  - type: Thruster
    baseThrust: 50
    thrust: 60
    heatSignatureRatio: 7.5
  - type: Sprite
    sprite: _Lua/Structures/Shuttles/thruster32.rsi
    layers:
    - state: base_stealth
      map: ["enum.ThrusterVisualLayers.Base"]
    - state: thrust
      map: ["enum.ThrusterVisualLayers.ThrustOn"]
      shader: unshaded
      visible: false
      color: "#8F002B"
    - state: thrust_burn_unshaded
      map: ["enum.ThrusterVisualLayers.ThrustingUnshaded"]
      shader: unshaded
      visible: false
      offset: 0, 1
      color: "#8F002B"
  - type: Anchorable
    flags: Anchorable

