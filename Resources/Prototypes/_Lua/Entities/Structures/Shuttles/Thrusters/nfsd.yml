- type: entity
  id: ThrusterNfsd
  parent: ThrusterSecurity
  suffix: NFSD, 64
  components:
  - type: Machine
    board: ThrusterNfsdMachineCircuitboard
  - type: Sprite
    sprite: _Lua/Structures/Shuttles/thruster32.rsi
    layers:
    - state: base_nfsd_new
      map: ["enum.ThrusterVisualLayers.Base"]
    - state: thrust
      map: ["enum.ThrusterVisualLayers.ThrustOn"]
      shader: unshaded
      visible: false
      color: "#FF0DA1"
    - state: thrust_burn_unshaded
      map: ["enum.ThrusterVisualLayers.ThrustingUnshaded"]
      shader: unshaded
      visible: false
      offset: 0, 1
      color: "#FF0DA1"

