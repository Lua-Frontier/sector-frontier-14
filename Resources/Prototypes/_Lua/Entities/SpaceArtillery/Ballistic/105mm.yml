- type: entity
  parent: WeaponTurretDravon
  id: Weapon105mm
  name: Миномёт "105мм"
  description: Малый миномёт, использует снаряды 105мм.
  suffix: ShuttleGun
  components:
  - type: Sprite
    sprite: _Lua/Objects/Weapons/Guns/Turrets/turrets105mm.rsi
    drawdepth: Mobs
    layers:
    - state: turrets105mm
  - type: Gun
    damageModifier: 1
    fireRate: 0.1
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazineLua105mm
        insertSound: /Audio/Weapons/Guns/MagIn/hpistol_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/sfrifle_magout.ogg
        priority: 2
        whitelist:
          tags:
          - MagazineLua105mm
        whitelistFailPopup: gun-magazine-whitelist-fail

- type: entity
  parent: BaseNFFlatpack
  id: Weapon105mmBaseFlatpack
  name: упакованный малый миномёт
  description: Упакованный Малый Миномёт (.105мм)
  components:
  - type: Flatpack
    entity: Weapon105mm
  - type: StaticPrice
    price: 250
  - type: Sprite
    sprite: _Lua/Flatpack/flatpack.rsi
    layers:
    - state: ship_weapon
