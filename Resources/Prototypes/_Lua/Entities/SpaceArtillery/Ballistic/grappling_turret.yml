- type: entity
  categories: [ ShuttleGun ]
  parent: [BallisticArtillery, BallisticArtilleryTier1HP]
  id: WeaponShuttleGrapplingTurret
  name: Турель-гарпун
  description: Шаттл-гарпун для зацепа за другой шаттл. Крюк отображается на радаре.
  suffix: ShuttleGun
  placement:
    mode: SnapgridCenter
  components:
    - type: RadarBlip
      radarColor: "#229e51"
      scale: 1
    - type: Sprite
      sprite: _Lua/Objects/SpaceArtillery/grappling.rsi
      drawdepth: Mobs
      layers:
        - state: turret
    - type: ContainerContainer
      containers:
        machine_board: !type:Container
        machine_parts: !type:Container
    - type: Battery
      maxCharge: 5000
      startingCharge: 5000
    - type: ExaminableBattery
    - type: AutoShootGun
    - type: GunSignalControl
    - type: WirelessNetworkConnection
      range: 700
    - type: FireControllable
    - type: Gun
      fireRate: 1
      projectileSpeed: 75
      selectedMode: FullAuto
      availableModes:
        - FullAuto
      soundGunshot: /Audio/Weapons/Guns/Gunshots/harpoon.ogg
    - type: ProjectileBatteryAmmoProvider
      proto: BulletShuttleGrapplingHook
      fireCost: 200
    - type: SpaceArtillery
      powerChargeRate: 100
      powerUseActive: 20
      powerUsePassive: 1100
    - type: ShipGunClass
      shipClass: Light
    - type: ShipGunType
      shipType: Other
    - type: BatterySelfRecharger
      autoRecharge: true
      autoRechargeRate: 100
    - type: ShuttleGrappleTurret
