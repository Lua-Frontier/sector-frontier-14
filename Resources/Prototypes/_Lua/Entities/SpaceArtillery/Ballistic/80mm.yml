- type: entity
  parent: WeaponTurretDravon
  id: Weapon80mm
  name: Пулемёт "80мм"
  description: Тяжёлый пулемёт, использует снаряды 80мм.
  suffix: ShuttleGun
  components:
  - type: Sprite
    sprite: _Lua/Objects/Weapons/Guns/Turrets/turrets80mm.rsi
    drawdepth: Mobs
    layers:
    - state: turrets80mm
  - type: Gun
    damageModifier: 1
    fireRate: 1
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazineLua80mm
        insertSound: /Audio/Weapons/Guns/MagIn/hpistol_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/sfrifle_magout.ogg
        priority: 2
        whitelist:
          tags:
          - MagazineLua80mm
        whitelistFailPopup: gun-magazine-whitelist-fail

- type: entity
  parent: BaseNFFlatpack
  id: Weapon80mmBaseFlatpack
  name: упакованный тяжёлый пулемёт
  description: Упакованный Средний Пулемёт (.80мм)
  components:
  - type: Flatpack
    entity: Weapon80mm
  - type: StaticPrice
    price: 250
  - type: Sprite
    sprite: _Lua/Flatpack/flatpack.rsi
    layers:
    - state: ship_weapon
