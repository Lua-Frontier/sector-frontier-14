- type: entity
  parent: WeaponTurretAK570
  id: Weapon53mm
  name: Пулемёт "53мм"
  description: Средний пулемёт, использует снаряды 53мм.
  suffix: ShuttleGun
  components:
  - type: Sprite
    sprite: _Lua/Objects/Weapons/Guns/Turrets/turrets53mm.rsi
    drawdepth: Mobs
    layers:
    - state: turrets53mm
  - type: Gun
    fireRate: 6
    selectedMode: FullAuto
    availableModes:
    - FullAuto
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazineLua53mm
        insertSound: /Audio/Weapons/Guns/MagIn/hpistol_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/sfrifle_magout.ogg
        priority: 2
        whitelist:
          tags:
          - MagazineLua53mm
        whitelistFailPopup: gun-magazine-whitelist-fail

- type: entity
  parent: BaseNFFlatpack
  id: Weapon53mmBaseFlatpack
  name: упакованный средний пулемёт
  description: Упакованный Средний Пулемёт (.53мм)
  components:
  - type: Flatpack
    entity: Weapon53mm
  - type: StaticPrice
    price: 250
  - type: Sprite
    sprite: _Lua/Flatpack/flatpack.rsi
    layers:
    - state: ship_weapon
