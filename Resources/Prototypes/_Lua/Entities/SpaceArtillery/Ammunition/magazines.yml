# ---- 20mm ----
- type: entity
  categories: [ ShuttleGun ]
  id: CartridgeLua20mm
  name: cartridge (20mm)
  parent: 20mmCartridge
  components:
  - type: Tag
    tags:
    - Cartridge
    - CartridgeLua20mm
  - type: CartridgeAmmo
    proto: Bullet20mm
  - type: Sprite
    sprite: _Lua/Objects/Weapons/Guns/Projectiles/explosives.rsi
    layers:
    - state: 20mmhe
      map: ["enum.AmmoVisualLayers.Base"]

- type: entity
  categories: [ ShuttleGun ]
  id: MagazineLua20mm
  name: 20mm ammo loader
  description: An ammunition loader for Lua 20mm ship guns.
  parent: Magazine20mm
  components:
  - type: Tag
    tags:
    - MagazineLua20mm
  - type: BallisticAmmoProvider
    infiniteUnspawned: true
    mayTransfer: true
    capacity: 1
    proto: CartridgeLua20mm
    whitelist:
      tags:
      - CartridgeLua20mm

