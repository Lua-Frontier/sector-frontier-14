  name: packed mauler
  suffix: Syndicate, Packed
  description: A folded Mauler. Use it on the floor to unpack. Battery and weapons included.
  components:
  - type: Sprite
    sprite: Objects/Specific/Mech/mecha.rsi
    state: mauler
  - type: Item
    size: Ginormous
    shape:
    - 0,0,3,3
    sprite: Objects/Specific/Mech/mecha.rsi
  - type: SpawnAfterInteract
    prototype: MechMaulerSyndieFilled
