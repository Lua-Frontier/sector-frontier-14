- type: entity
  id: GeneratorCRPinchMachineCircuitboard
  parent: BaseMachineCircuitboard
  name: CR-pinch generator machine board
  description: A machine printed circuit board for a SKR CR-class Z-pinch fusion generator. Uses a 2x1 machine frame.
  components:
  - type: Sprite
    state: engineering
  - type: MachineBoard
    prototype: GeneratorCRPinch
    frameSize: 2x1
    requirements:
      Capacitor: 4
      Manipulator: 2
    stackRequirements:
      Steel: 10
      Plasteel: 5
      Plasma: 5
    tagRequirements:
      ComponentBrickEconomy1:
        amount: 2
        defaultPrototype: ComponentBrickEconomy1
      MotorEconomy1:
        amount: 2
        defaultPrototype: MotorEconomy1

