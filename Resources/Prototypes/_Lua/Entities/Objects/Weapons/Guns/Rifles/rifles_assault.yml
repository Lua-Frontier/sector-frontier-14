- type: entity # TODO: switch to .25 rifle (caseless)
  id: NFWeaponRifleAssaultSm
  parent: [ NFBaseWeaponRifleAssaultChamber30, NFBaseWeaponFrameRifleAssaultCybersun ]
  name: АК-74М
  description: |-
    An iconic weapon of war. An illegal firearm often used by Syndicate agents.
  components:
  - type: Clothing
    sprite: _Mono/Objects/Weapons/Guns/Rifles/akm_inhands_32x.rsi
  - type: Sprite
    sprite: _Mono/Objects/Weapons/Guns/Rifles/akm.rsi
    layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
      - state: mag-0
        map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true

