- type: entity
  parent: BaseWeaponBatterySmall
  id: ADTWeaponPistolX01
  name: X-01 мультифазовый энергетический пистолет
  description: Это дорогая, современная версия антикварного лазерного пистолета. У этого оружия есть несколько уникальных режимов огня, но нет возможности самостоятельно перезаряжаться с течением времени.
  suffix: Пистолет, НЕ МАППИТЬ
  components:
  - type: Sprite
    sprite: _Lua/Objects/Weapons/Guns/Battery/x01.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-unshaded-4-2
      map: ["enum.GunVisualLayers.MagUnshaded"]
      shader: unshaded
  - type: Appearance
  - type: MagazineVisuals
    magState: mag
    steps: 5
    zeroVisible: false
  - type: Clothing
    sprite: _Lua/Objects/Weapons/Guns/Battery/x01.rsi
  - type: Gun
    fireRate: 1.5
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/laser_cannon.ogg
  - type: ProjectileBatteryAmmoProvider
    proto: NFBulletDisabler
    fireCost: 100
  - type: BatteryWeaponFireModes
    fireModes:
    - proto: NFBulletDisabler
      fireCost: 100
    - proto: NFBulletTaser
      fireCost: 200
    - proto: ADTBulletLaser
      fireCost: 100
  - type: Battery
    maxCharge: 2000
    startingCharge: 2000
  - type: Tag
    tags:
    - HighRiskItem
    - BatteryWeaponFireModesSprites
  - type: StaticPrice
    price: 7500

- type: entity
  name: tesla gun
  parent: [WeaponTeslaGun, BaseWeaponBattery, BaseC3Contraband]
  id: LuaWeaponTeslaGun
  description: The power of the primordial element of lightning in your hands. An experimental and illegal weapon.

- type: entity
  name: taser
  parent: [ WeaponTaser, BaseWeaponBatterySmall, BaseC2ContrabandUnredeemable ]
  id: LuaWeaponTaser
  description: A low-capacity, energy-based stun gun used by security teams to subdue targets at close range. On the handle is a label that says 'for authorized use only.'

- type: entity
  name: energy shotgun
  parent: [WeaponEnergyShotgun, BaseWeaponBattery, BaseGunWieldable, BaseC2ContrabandUnredeemable]
  id: LuaWeaponEnergyShotgun
  description: A one-of-a-kind prototype energy weapon that uses various shotgun configurations. It offers the possibility of both lethal and non-lethal shots, making it a versatile weapon.

