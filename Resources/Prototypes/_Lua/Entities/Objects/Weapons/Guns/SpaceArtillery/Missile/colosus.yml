  - type: BallisticAmmoProvider
    whitelist:
      tags:
      - MissileStarColosus
    capacity: 1
    unspawnedCount: 0
    proto: MissileTND

- type: entity
  parent: BaseNFFlatpack
  id: WeaponMissileLauncherStarColosusFlatpack
