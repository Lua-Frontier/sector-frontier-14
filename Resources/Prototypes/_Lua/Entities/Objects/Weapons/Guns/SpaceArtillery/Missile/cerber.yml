- type: entity
  parent: WeaponTurretPaladin
  id: WeaponMissileLauncherCerber
  name: Артиллерийская установка "Цербер-Х"
  description: Мощное космическое орудие для уничтожения вражеских флотов. Снаряд "Анаконда" разворачивается при ударе, охватывая огромную площадь и вызывая разрушения на всей территории поражения.
  suffix: ShuttleGun
  components:
  - type: Sprite
    sprite: _Lua/Objects/ShuttleWeapons/cheapmissile.rsi
    drawdepth: Mobs
    layers:
    - state: rocket
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazineCerber
        insertSound: /Audio/Weapons/Guns/MagIn/hpistol_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/sfrifle_magout.ogg
        priority: 2
        whitelist:
          tags:
          - MagazineCerber
        whitelistFailPopup: gun-magazine-whitelist-fail
