# ---- 20mm ----
- type: entity
  id: CartridgeLua20mm
  name: cartridge (20mm)
  parent: BaseCartridge
  components:
  - type: Tag
    tags:
    - Cartridge
    - CartridgeLua20mm
  - type: CartridgeAmmo
    deleteOnSpawn: true
    proto: Bullet20mm
  - type: Sprite
    sprite: _Lua/Objects/Weapons/Guns/Projectiles/explosives.rsi
    layers:
    - state: 20mmhe
      map: ["enum.AmmoVisualLayers.Base"]
  - type: Appearance
  - type: SpentAmmoVisuals
  - type: StaticPrice
    price: 1

- type: entity
  id: MagazineLua20mm
  name: 20mm ammo loader
  description: An ammunition loader for Lua 20mm ship guns.
  parent: [BaseItem, RecyclableItemSteelTiny]
  components:
  - type: Tag
    tags:
    - MagazineLua20mm
  - type: Item
    size: Small
  - type: BallisticAmmoProvider
    infiniteUnspawned: true
    proto: CartridgeLua20mm
    capacity: 1
    mayTransfer: true
    whitelist:
      tags:
      - CartridgeLua20mm
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    sprite: _Mono/Objects/Weapons/Guns/Ammunition/Boxes/generic_shipgun_box.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 4
    zeroVisible: false
  - type: Appearance
  - type: StaticPrice
    price: 50

