- type: entity
  name: shuttle control tablet
  parent: BaseHandheldComputer
  id: ShuttleControlTablet
  description: A portable tablet for shuttle control. Has a slot for ID card. To function at least one powered console must be present at the shuttle.
  components:
  - type: Item
    sprite: _Lua/Objects/Tools/handheldshuttleconsole.rsi
  - type: Sprite
    sprite: _Lua/Objects/Tools/handheldshuttleconsole.rsi
    state: default
  - type: ShuttleTablet
  - type: ShuttleConsole
    zoom: 1.0, 1.0
  - type: ShuttleConsoleLock
    locked: false
  - type: ActivatableUI
    key: enum.ShuttleConsoleUiKey.Key
  - type: UserInterface
    interfaces:
        enum.ShuttleConsoleUiKey.Key:
          type: ShuttleConsoleBoundUserInterface
  - type: RadarConsole
    maxRange: 512
    maxIffRange: 512
  - type: DetectionRangeMultiplier
    infraredMultiplier: 2
    visualMultiplier: 16
    infraredOutlinePortion: 1.0
  - type: Appearance
  - type: ItemSlots
    slots:
      id_container:
        name: shuttle-tablet-id-slot
        priority: 3
        whitelist:
          components:
          - IdCard
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellSmall
  - type: ContainerContainer
    containers:
      id_container: !type:ContainerSlot
      cell_slot: !type:ContainerSlot
  - type: DeviceLinkSource
    ports:
    - device-button-1
    - device-button-2
    - device-button-3
    - device-button-4
    - device-button-5
    - device-button-6
    - device-button-7
    - device-button-8
    range: 3
  - type: PowerCellDraw
    drawRate: 1.5
  - type: StaticPrice
    price: 250

- type: entity
  id: ShuttleControlTabletMicroreactor
  parent: ShuttleControlTablet
  suffix: Microreactor
  components:
  - type: ItemSlots
    slots:
      id_container:
        name: shuttle-tablet-id-slot
        priority: 3
        whitelist:
          components:
          - IdCard
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellMicroreactor

- type: entity
  id: ShuttleControlTabletEmpty
  parent: ShuttleControlTablet
  suffix: Empty
  components:
  - type: ItemSlots
    slots:
      id_container:
        name: shuttle-tablet-id-slot
        priority: 3
        whitelist:
          components:
          - IdCard
      cell_slot:
        name: power-cell-slot-component-slot-name-default

- type: entity
  parent: ShuttleControlTablet
  id: ShuttleControlTabletSalvage
  suffix: Salvage
  components:
  - type: Sprite
    state: salvage

- type: entity
  parent: ShuttleControlTablet
  id: ShuttleControlTabletSecurity
  suffix: Security
  components:
  - type: Sprite
    state: security

- type: entity
  parent: ShuttleControlTablet
  id: ShuttleControlTabletSyndicate
  suffix: Syndicate
  components:
  - type: Sprite
    state: syndicate
