#region база для следов от джета

- type: entity
  id: JetpackEffectBase
  categories: [ HideSpawnMenu ]
  components:
  - type: TimedDespawn
    lifetime: 2
  - type: Sprite
    sprite: _Lua/Effects/jetpack_trails.rsi
    drawdepth: SmallMobs
    color: "#0093c0"
    noRot: true
    layers:
    - shader: unshaded
      state: chem_gas_old
  - type: EffectVisuals
  - type: RadarBlip
    radarColor: "#0093c0"
    scale: 0.7
    shape: Circle
    visibleFromOtherGrids: true
    requireNoGrid: true
    maxDistance: 400
  - type: Tag
    tags:
      - HideContextMenu
  - type: AnimationPlayer

- type: entity
  id: JetpackRadarTrail
  categories: [ HideSpawnMenu ]
  components:
  - type: TimedDespawn
    lifetime: 2
  - type: RadarBlip
    radarColor: "#0093c0"
    scale: 0.7
    shape: Circle
    visibleFromOtherGrids: true
    requireNoGrid: true
    maxDistance: 400
  - type: Tag
    tags:
      - HideContextMenu

