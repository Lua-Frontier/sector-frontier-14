- type: entity
  parent: GasTankBase
  id: JetpackStealth
  name: стелс-джетпак
  description: Джетпак с практически неразличимым на радаре следом. Стелс-модификация выпускает при полёте четырёхкратное количество газа, делая след почти чёрным, а поисковый маячок демонтирован.
  components:
  - type: Sprite
    sprite: Objects/Tanks/Jetpacks/black.rsi
    layers:
    - state: icon
      map: ["enum.JetpackVisuals.Layer"]
  - type: Item
    sprite: Objects/Tanks/Jetpacks/black.rsi
    size: Huge
  - type: ActivatableUI
    verbOnly: true # Lua
  - type: UserInterface
    interfaces:
      enum.SharedGasTankUiKey.Key:
        type: GasTankBoundUserInterface
  - type: UseDelay
    delays:
      gasTank:
        length: 1.0
  - type: Clothing
    sprite: Objects/Tanks/Jetpacks/black.rsi
    quickEquip: true # Lua false > true
    slots:
    - Back
    - SuitStorage
  - type: GasTank
    outputPressure: 21.3
    air:
      volume: 5
      temperature: 293.15
  - type: Jetpack
    acceleration: 1.15
    weightlessModifier: 2.4
    moleUsage: 0.0034
    radarBlip: false
    jetpackEffect: JetpackEffectTrailStealth
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.JetpackVisuals.Enabled:
        enum.JetpackVisuals.Layer:
          True: {state: icon-on}
          False: {state: icon}
  - type: StaticPrice
    price: 150

- type: entity
  parent: JetpackStealth
  id: JetpackStealthFilled
  suffix: Filled
  components:
  - type: GasTank
    outputPressure: 42.6
    air:
      volume: 5
      temperature: 293.15
      moles:
        - 1.025689525
        - 1.025689525
