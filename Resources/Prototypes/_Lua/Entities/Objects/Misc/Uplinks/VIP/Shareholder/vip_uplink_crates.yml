# VIP BUNDLES (shareholder resource boxes)

- type: listing
  id: UplinkVipCratesLabBundle
  name: uplink-vip-LabBundle-name
  description: uplink-vip-LabBundle-desc
  productEntity: VipBundleScienceLab
  icon: { sprite: _Lua/Objects/Tools/vipbundles.rsi, state: share-base }
  cost:
    Speso: 34000
  categories:
    - UplinkVipCrates
    - UplinkVipTierShareholder
    - UplinkVipTierShareholderLua
  conditions:
    - !type:StoreWhitelistCondition
      whitelist:
        tags:
          - VipUplink
    - !type:BuyerSponsorTierCondition
      whitelist:
      - shareholder
      - shareholderlua

