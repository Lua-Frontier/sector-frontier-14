  - type: TTS
    enabled: true
    voice: Overwatch
  - type: PointLight
    color: "#faa70f"
    enabled: true
    radius: 6
    energy: 4
    mask: /Textures/Effects/LightMasks/cone.png
    autoRot: true
    netsync: false

