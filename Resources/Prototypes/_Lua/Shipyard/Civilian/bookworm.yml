- type: vessel
  id: PZBookworm
  parent: BaseVessel
  name: PZ Bookworm
  description: A cozy medium-size library for travellers who wish to relax with a book or perhaps a board game.
  price: 29500
  category: Medium
  group: Shipyard
  shuttlePath: /Maps/_Lua/Shuttles/Civilian/bookworm.yml
  guidebookPage: ShipyardBookworm
  class:
  - Civilian
  engine:
  - Plasma
  addComponents:

    - type: IFF
      color: "#ffffff"
    - type: NanotrasenFtl

- type: gameMap
  id: PZBookworm
  mapName: 'PZ Bookworm'
  mapPath: /Maps/_Lua/Shuttles/Civilian/bookworm.yml
  minPlayers: 0
  stations:
    PZBookworm:
      stationProto: StandardFrontierVessel
      components:
        - type: StationNameSetup
          mapNameTemplate: 'PZ Bookworm {1}'
          nameGenerator:
            !type:NanotrasenNameGenerator
            prefixCreator: '14'
        - type: StationJobs
          availableJobs:
            ContractorInterview: [ 0, 0 ]
            PilotInterview: [ 0, 0 ]
            MercenaryInterview: [ 0, 0 ]
