- type: vessel
  parent: BaseVessel
  id: Nutter
  name: MXZ Nutter
  description: Был назван в честь схожести с Орехом. Боевой шаттл, выполненный и эксплуатируемый для разнообразия вооружения сил ДСБФ
   сделанный на заказ у корпорации Mimir Xeno-Zythos Project.
  limit: 3
  price: 1 #проверка
  category: Medium
  group: Security
  class:
  - Nfsd
  engine:
  - Uranium
  shuttlePath: /Maps/_Lua/Shuttles/SD/Nutter.yml
