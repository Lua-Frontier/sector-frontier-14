  id: Nutter
  mapName: 'MXZ Nutter'
  mapPath: /Maps/_Lua/Shuttles/SD/Nutter.yml
  minPlayers: 0
  stations:
    Nutter:
      stationProto: StandardFrontierVessel
      components:
      - type: StationNameSetup
        mapNameTemplate: 'MXZ Nutter {1}'
        nameGenerator:
          !type:NanotrasenNameGenerator
            prefixCreator: '14'
