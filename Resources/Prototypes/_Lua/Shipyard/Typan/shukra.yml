- type: vessel
  parent: BaseVessel
  id: GFShukra
  name: Shukra
  description: Этот корабль оборудован радаром и несет мощные дальнобойные орудия, однако за огневую мощь расплачивается слабой броней.
  limit: 2
  price: 226148
  category: Large
  group: Typan
  whitelist:
  - Frontier
  class:
  - Syndicate
  engine:
  - Singularity
  shuttlePath: /Maps/_Lua/Shuttles/Typan/shukra-2.yml

- type: gameMap
  id: GFShukra
  mapName: 'Shukra'
  mapPath: /Maps/_Lua/Shuttles/Typan/shukra-2.yml
  minPlayers: 0
  stations:
    GFShukra:
      stationProto: StandardFrontierVessel
      components:
      - type: StationNameSetup
        mapNameTemplate: 'Shukra {1}'
        nameGenerator:
          !type:NanotrasenNameGenerator
            prefixCreator: '14'

