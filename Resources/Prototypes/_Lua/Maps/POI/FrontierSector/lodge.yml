# Notes:
# Provides higher end expeditionary ships and a space for vets to spawn in away from potential frontier shenanigans
- type: pointOfInterest
  id: Lodge
  parent: [BasePOI, BaseRepairablePOI]
  name: 'Повреждённый Аванпост Экспедиций'
  minimumDistance: 2300 #1650 Lua
  maximumDistance: 5400 #3400 Lua
  spawnGroup: Required
  # gridPath: /Maps/_Lua/POI/Expedition_Outpost.yml
  gridPath: /Maps/_Lua/POI/ExpeditionOutpostDamaged.yml
  addComponents:
  - type: RadarBlipIcon
    icon: /Textures/_Lua/Interface/Radar/space-outpost.png
    scale: 1.2
    allowWhenHidden: true
  # - type: IFF
  #   color: "#3737F8"

- type: gameMap
  id: Lodge
  mapName: 'Повреждённый Аванпост Экспедиций'
  # mapPath: /Maps/_Lua/POI/Expedition_Outpost.yml
  mapPath: /Maps/_Lua/POI/ExpeditionOutpostDamaged.yml
  minPlayers: 0
  stations:
    Lodge:
      # stationProto: MarketFrontierOutpost
      stationProto: StandardFrontierOutpost
      components:
        - type: FactionCapture
          captureWholeStation: true
        - type: SolarPoweredGrid
          trackOnInit: true
          doNotCull: true
        - type: StationNameSetup
          mapNameTemplate: 'Повреждённый Аванпост Экспедиций'
        # - type: ExtraStationInformation
        #   iconPath: /Textures/Structures/Wallmounts/flags.rsi/expedition_flag.png
        #   stationSubtext: 'frontier-lobby-erc-subtext'
        #   stationDescription: 'frontier-lobby-erc-description'
        #   lobbySortOrder: 3
        #   requiredCompany: Nanotrasen
        - type: StationJobs
          availableJobs: {}
