- type: gameMap
  id: AsteroidTradeOutpost
  mapName: 'Чёрный Рынок'
  mapPath: /Maps/_Lua/POI/BlackMarket.yml
  isGrid: true
  minPlayers: 0
  stations:
    AsteroidTradeOutpost:
      stationProto: MarketFrontierOutpost
      components:
        - type: FactionCapture
          captureWholeStation: true
        - type: BecomesStation
          id: AsteroidTradeOutpost
        - type: RadarBlipIcon
          icon: /Textures/_Lua/Interface/Radar/black_market.png
          scale: 1.2
          allowWhenHidden: true
        - type: FactionOwnedStation
          originalCompany: Neutral
          currentCompany: Neutral
          mainBase: true
        - type: StationNameSetup
          mapNameTemplate: 'Чёрный Рынок'
        - type: ExtraStationInformation
          iconPath: /Textures/Structures/Wallmounts/flags.rsi/pirate_flag.png
          stationSubtext: 'frontier-lobby-blackmarket-subtext'
          stationDescription: 'frontier-lobby-blackmarket-description'
          requiredCompany: Neutral
          additionalSpawnCompanies: LuaTech
        - type: StationDeadDrop
          maxDeadDrops: 3
        - type: StationJobs
          availableJobs:
            Contractor: [ -1, -1 ]
            Mercenary: [ -1, -1 ]
            OpsLuaTech: [ 1, 1 ]
      gridComponents:
      - type: GridGodMode
      - type: IFF
        color: "#d93204"
      - type: ProtectedGrid
        preventArtifactTriggers: true
      - type: SolarPoweredGrid
        trackOnInit: true
        doNotCull: true
