- type: pointOfInterest
  id: Beacon
  parent: [BasePOI, BaseRepairablePOI]
  name: 'Маяк'
  minimumDistance: 2000
  maximumDistance: 4500
  spawnGroup: AsteroidRequired
  gridPath: /Maps/_Lua/Maps/beacon.yml
  addComponents:
  - type: RadarBlipIcon
    icon: /Textures/_Lua/Interface/Radar/beacon.png
    scale: 1.2
    allowWhenHidden: true
  - type: GridGodMode

- type: gameMap
  id: Beacon
  mapName: 'Маяк'
  mapPath: /Maps/_Lua/Maps/beacon.yml
  isGrid: true
  minPlayers: 0
  stations:
    Beacon:
      stationProto: StandardAsteroidSector
      components:
      - type: FactionCapture
        captureWholeStation: true
      - type: RadarBlipIcon
        icon: /Textures/_Lua/Interface/Radar/beacon.png
        scale: 1.2
        allowWhenHidden: true
      - type: StationNameSetup
        mapNameTemplate: 'Маяк'
