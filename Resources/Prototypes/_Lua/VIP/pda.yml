- type: entity
  parent: BasePDA
  id: VipPDA
  name: vip PDA
  description: Why isn't it not gray?
  components:
  - type: Sprite
    layers:
    - sprite: _Lua/Objects/Devices/pda.rsi
      map: [ "enum.PdaVisualLayers.Base" ]
      state: "pda_vip"
    - sprite: _NF/Objects/Devices/pda.rsi
      state: "light_overlay"
      map: [ "enum.PdaVisualLayers.Flashlight" ]
      shader: "unshaded"
      visible: false
    - sprite: _NF/Objects/Devices/pda.rsi
      state: "id_overlay"
      map: [ "enum.PdaVisualLayers.IdLight" ]
      shader: "unshaded"
      visible: false
  - type: Appearance
    appearanceDataInit:
     enum.PdaVisuals.PdaType:
       !type:String
       pda_vip
  - type: Pda
    id: VipIDCard
  - type: PdaBorderColor
    borderColor: "#171511"
    accentVColor: "#b0a813"
  - type: Icon
    sprite: _Lua/Objects/Devices/pda.rsi
    state: pda_vip

- type: entity
  parent: IDCardStandard
  id: VipIDCard
  name: vip ID card
  components:
  - type: PresetIdCard
    job: Vip
  - type: Sprite
    sprite: _Lua/Objects/Misc/id_cards.rsi
    layers:
    - state: vip
    - state: idvip
  - type: Clothing
    sprite: _NF/Objects/Misc/id_cards.rsi

- type: entity
  parent: BasePDA
  id: SyndieShareholderPDA
  name: shareholder PDA
  description: Why isn't it not gray?
  components:
  - type: Sprite
    layers:
    - sprite: _Lua/Objects/Devices/pda.rsi
      map: [ "enum.PdaVisualLayers.Base" ]
      state: "pda_shareholder_syndicate"
    - sprite: _NF/Objects/Devices/pda.rsi
      state: "light_overlay"
      map: [ "enum.PdaVisualLayers.Flashlight" ]
      shader: "unshaded"
      visible: false
    - sprite: _NF/Objects/Devices/pda.rsi
      state: "id_overlay"
      map: [ "enum.PdaVisualLayers.IdLight" ]
      shader: "unshaded"
      visible: false
  - type: Appearance
    appearanceDataInit:
     enum.PdaVisuals.PdaType:
       !type:String
       pda_shareholder_syndicate
  - type: Pda
    id: SynShareholderIDCard
  - type: PdaBorderColor
    borderColor: "#171511"
    accentVColor: "#b0a813"
  - type: Icon
    sprite: _Lua/Objects/Devices/pda.rsi
    state: pda_shareholder_syndicate

- type: entity
  parent: IDCardStandard
  id: SynShareholderIDCard
  name: shareholder ID card
  components:
  - type: PresetIdCard
    job: OutpostSyndicateShareholder
  - type: Sprite
    sprite: _Lua/Objects/Misc/id_cards.rsi
    layers:
    - state: synsharehold
    - state: idsynsharehold
  - type: Clothing
    sprite: _NF/Objects/Misc/id_cards.rsi
