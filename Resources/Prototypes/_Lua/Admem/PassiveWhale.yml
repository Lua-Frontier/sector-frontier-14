- type: entity
  parent: [ BaseItem ]
  id: AiTeleportPassiveWhale
  name: телепорт космокита
  suffix: "адмем"
  description: Унивенсальный телепорт для призыва космического кита, который будет следовать за вашим агостом. "Не мучайте им игроков только" - комментарий 25Hydra08
  components:
  - type: Sprite
    sprite: Objects/Devices/door_remote.rsi
    layers:
    - state: door_remotebase
    - state: door_remotelightscolour
      color: "#fffb00"
    - state: door_remotescreencolour
      color: "#9c9c9c"
  - type: Item
    storedRotation: -90
  - type: RechargeBasicEntityAmmo
    rechargeCooldown: 1
    rechargeSound: /Audio/Machines/phasein.ogg
  - type: BasicEntityAmmoProvider
    proto: MobSpaceWhalePassive
    capacity: 100
    count: 100
  - type: Gun
    fireRate: 1
    useKey: false
    selectedMode: FullAuto
    availableModes:
      - FullAuto
    soundGunshot: /Audio/Machines/phasein.ogg
    soundEmpty: /Audio/_NF/Effects/silence.ogg
  - type: Tag
    tags:
    - AIWhaleBeacon

- type: Tag
  id: AIWhaleBeacon

- type: entity
  id: MobSpaceWhalePassive
  parent: [ SimpleSpaceMobBase, FlyingMobBase, MobCombat ]
  name: Зубик
  description: Необычный космический кит, который не проявляет агрессии.
  categories: [ HideSpawnMenu ]
  components:
  # - type: SpaceWhale
  - type: TailedEntity
    amount: 55
    speed: 44
    spacing: 1.1
    wiggleAmplitude: 0.02
    wiggleFrequency: 0.02
    stiffness: 90
    damping: 5
    minLengthMultiplier: 0.9
    maxLengthMultiplier: 1.2
    prototype: MobSpaceWhaleSegment
  - type: MovementSpeedModifier
    baseRunningSpeed: 45
    baseWalkSpeed: 45
  - type: RadarBlip
    radarColor: "#FF4444"
    scale: 3
    shape: Circle
    visibleFromOtherGrids: true
    requireNoGrid: true
    maxDistance: 4096
  - type: RadarSonarEcho
  # - type: MovementIgnoreGravity
  #   weightless: true
  - type: HTN
    rootTask:
      task: SpaceWhaleCompound
    sleepPlayerCheckRangeOverride: 2500
    blackboard:
      NavSmash: !type:Bool
        true
      MeleeRange: !type:Single
        4
      VisionRadius: !type:Single
        2000
      AggroVisionRadius: !type:Single
        2000
  - type: NpcFactionMember
    factions:
    - Passive
  - type: InputMover
  - type: MobMover
  - type: Physics
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 2
        density: 137992
        mask:
        - FlyingMobMask
        layer:
        - FlyingMobLayer
  - type: Speech
    speechVerb: LargeMob
  - type: InteractionPopup
    interactSuccessString: petting-success-leviathan
    interactFailureString: petting-failure-leviathan
    interactFailureSound:
      path: /Audio/Effects/bite.ogg
  - type: Sprite
    sprite: _Goobstation/Mobs/SpaceWhale/leviathan.rsi
    layers:
    - state: head
    - state: overlay
      shader: unshaded
    noRot: false
  - type: NightVision
    color: "#808080"
    activateSound: null
    deactivateSound: null
  - type: AmbientSound
    enabled: true
    volume: 1
    range: 700
    sound:
      path: /Audio/_Goobstation/Ambience/SpaceWhale/leviathan-ambient.ogg
  - type: MobState
  - type: MobThresholds
    thresholds:
      0: Alive
      36000: Dead
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 36000
      behaviors:
      - !type:GibBehavior { }
  - type: DamageOnCollide
    inverted: true
    damage:
      types:
        Structural: 5000
        Blunt: 10
  - type: Appearance
  - type: Damageable
    damageContainer: Biological
  - type: SlowOnDamage
    speedModifierThresholds:
      2000: 0.7
      3000: 0.5
  - type: Stamina
    critThreshold: 600
  - type: Flammable
    damage:
      types: {}
  - type: StatusEffects
    allowed:
    - Stutter
    - Electrocution
    - TemporaryBlindness
    - Pacified
    - RadiationProtection
    - Adrenaline
  - type: Temperature
    heatDamageThreshold: 800
  - type: Tag
    tags:
    - CannotSuicide
    - DoorBumpOpener
    - StunImmune
    - SpaceLeviathan
  - type: Butcherable
    spawned:
    - id: FoodMeatFish
      amount: 8
  - type: NPCImprintingOnSpawnBehaviour
    whitelist:
      tags:
      - AIWhaleBeacon
    follow: true
    spawnFriendsSearchRadius: 5