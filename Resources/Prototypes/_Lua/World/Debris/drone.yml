# All world debris drone spawners (Mono BrokenAi + LuaTech).
# Bases/asteroids/wrecks: base.yml, debris.yml, wrecks.yml

# =============================================================================
# Mono / BrokenAi drones (was: Resources/Prototypes/_Mono/Entities/World/Debris/drone.yml)
# =============================================================================

#region Spawners

- type: entity
  id: SpawnDroneBase
  parent: MarkerBase
  abstract: true
  components:
  - type: GridSpawner
    addComponents:
    - type: Company
      companyName: BrokenAi
    - type: RadarBlipIcon
      icon: /Textures/_Lua/Interface/Radar/ai.png
      scale: 1.2
      maxDistance: 1024
      allowWhenHidden: true
    - type: DetectedAtRangeMultiplier
      visualBias: 1024
    - type: IFF
      flags: AlwaysShowColor
      color: "#9a2020"
    - type: GridCleanupGrid
      cleanupAcceleration: 3
      ignorePowered: true
      ignoreIFF: true
      ignorePrice: true
      distanceOverride: 1024 # so it doesn't despawn while in view
    - type: RandomMetadata
      nameSeparator: ""
      nameSegments:
      - DroneTitle
      - " 0x"
      - DroneHex
      - DroneHex
      - DroneHex
      - DroneHex
      - DroneHex
      - DroneHex
    nameGrid: false

- type: entity
  id: MonoDroneSpawnerT1
  parent: MarkerBase
  categories: [Spawner]
  components:
  - type: EntityTableSpawner
    table: !type:NestedSelector
      tableId: DroneSpawnTableT1

# Compat alias for old biome/map refs
- type: entity
  id: MonoRamDroneSpawnerT1
  parent: MonoDroneSpawnerT1
  categories: [Spawner, HideSpawnMenu]

- type: entity
