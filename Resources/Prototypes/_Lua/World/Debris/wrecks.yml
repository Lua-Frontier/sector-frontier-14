# Wreck / scrap debris prototypes (vanilla + NF).
# Bases -> base.yml (BaseDebris / NFBaseDebris) | Asteroids -> debris.yml
# Far-ring spawn tables: Biomes/mono_far.yml

#region Vanilla scrap

- type: entity
  id: BaseScrapDebris
  parent: BaseDebris
  name: Scrap Debris
  abstract: true
  components:
    - type: RadarBlipIcon
      icon: /Textures/_Lua/Interface/Radar/wreck.png
      scale: 1.2
      maxDistance: 1024
      allowWhenHidden: true
    - type: MapGrid
    - type: BlobFloorPlanBuilder
      floorTileset:
        - Plating
        - Plating
        - Plating
        - FloorSteel
        - Lattice
      blobDrawProb: 0.5
      radius: 6
      floorPlacements: 16
    - type: SimpleFloorPlanPopulator
      entries:
        Plating:
          - prob: 3 # Intentional blank.
          - id: RandomScrapSalvage
            prob: 0.8
          - id: SalvageMaterialCrateSpawner
            prob: 0.5
          # - id: RandomArtifactSpawner20
          #   prob: 0.3
          - id: SalvageCanisterSpawner
            prob: 0.3
          - id: NFSalvageLockerSpawner
            prob: 0.15
          - id: NFSalvageSuitStorageSpawner
            prob: 0.05
          - id: NFSalvageGeneratorSpawner
            prob: 0.1
          - id: SalvageMobSpawner
            prob: 0.3
          - id: SpawnMobBearSalvage
            prob: 0.02
          - id: SpawnMobSpiderSalvage
            prob: 0.02
          - id: SpawnMobKangarooSalvage
            prob: 0.02
          - id: SpawnMobSmallPurpleSnake
            prob: 0.03
          - id: SpawnMobPurpleSnake
            prob: 0.02
          - id: TableFrame
            prob: 0.2
          - id: SalvageMobSpawner
            prob: 0.7
          - id: MedicalBed
            prob: 0.025
          - id: Bed
            prob: 0.05
          - id: Bookshelf
            prob: 0.025
          - id: Dresser
            prob: 0.025
          - id: RollerBedSpawnFolded
            prob: 0.02
          - id: RollerBed
            prob: 0.02
          - id: CheapRollerBed
            prob: 0.02
          - id: EmergencyRollerBed
            prob: 0.02
          - id: NFSalvageHandheldFlagSpawner
            prob: 0.02
          - id: Girder
            prob: 1.7
          - id: WallSolid
            prob: 1
          - id: Grille
            prob: 0.4
          - id: WindowDirectional
            prob: 0.05
          - id: WindowReinforcedDirectional
            prob: 0.1
          - id: PlasmaWindowDirectional
            prob: 0.005
          - id: PlasmaWindow
            prob: 0.005
          - id: ReinforcedWindow
            prob: 0.1
          - id: Window
            prob: 0.05
        Lattice:
          - prob: 2
          - id: Grille
            prob: 0.2
          - id: SalvageMaterialCrateSpawner
            prob: 0.3
          - id: SalvageCanisterSpawner
            prob: 0.2
        FloorSteel:
          - prob: 3 # Intentional blank.
          - id: SalvageMaterialCrateSpawner
            prob: 1
          - id: CrateFilledSpawner
            prob: 0.2
          - id: ChairFolding
            prob: 0.05
          - id: ChairWood
            prob: 0.05
          - id: ComfyChair
            prob: 0.05
          - id: ChairOfficeDark
            prob: 0.05
          - id: ChairOfficeLight
            prob: 0.05
          - id: ChairPilotSeat
            prob: 0.05
          - id: Stool
            prob: 0.05
          - id: NFRandomBook
            prob: 0.2
          - id: SalvageCanisterSpawner
            prob: 0.2
          - id: SalvageMobSpawner
            prob: 0.3
          - id: SpawnMobBearSalvage
            prob: 0.02
          - id: SpawnMobSpiderSalvage
            prob: 0.02
          - id: SpawnMobKangarooSalvage
            prob: 0.02
          - id: SpawnMobSmallPurpleSnake
            prob: 0.03
          - id: SpawnMobPurpleSnake
            prob: 0.02
          - id: Gyroscope
            prob: 0.0025
          - id: Thruster
            prob: 0.005
    - type: GCAbleObject
      queue: SpaceDebris
    - type: IFF
      flags: HideLabel
      color: "#88b0d1"
    - type: DetectedAtRangeMultiplier
      visualBias: 1024

- type: entity
  id: ScrapDebrisSmall
