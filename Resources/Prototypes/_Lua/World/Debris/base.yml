# Base debris prototypes.
# Asteroids -> debris.yml | Wrecks -> wrecks.yml | Drones -> drone.yml
# Sizes + spawn rings: Biomes/mono_far.yml

# Shared floating grid debris base (radar + GC)
- type: entity
  id: BaseDebris
  abstract: true
  components:
  - type: OwnedDebris
  - type: LocalityLoader
  - type: GCAbleObject
    queue: SpaceDebris
  - type: MapGrid
  - type: LinkedLifecycleGridParent
  - type: ProtectedGrid
    preventArtifactTriggers: true
  - type: RadarBlipIcon
    icon: /Textures/_Lua/Interface/Radar/asteroid.png
    scale: 1.2
    maxDistance: 1512
    allowWhenHidden: true
  - type: DetectedAtRangeMultiplier
    visualBias: 2048
  - type: IFF
    flags: HideLabel

# NF alias — same as BaseDebris; kept for existing parent refs
- type: entity
  id: NFBaseDebris
  parent: BaseDebris
  abstract: true
  components:
  - type: DebrisGrid
