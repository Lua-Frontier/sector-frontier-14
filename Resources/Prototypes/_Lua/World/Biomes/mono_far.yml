# =============================================================================
# Worldgen picture — sizes + all debris/wreck spawn tables.
# Tilesets / loot / drones stay in Debris/debris.yml, wrecks.yml, drone.yml.
#
# Ring map:
#   Inner     0-4000      Density            small/medium/large
#   T1       4000-11000  DensityRare        huge/extra-huge/enormous, wreck large+
#   T2Inner 11000-15000  DensityRare        huge+, ice rare, T2 drones
#   T2Middle 15000-19000 DensityRarer       extra-huge+, ice, no small wrecks
#   T2Far   19000-23000  DensityRarer       enormous/ice, T2 large drones
#   T3Near  23000-27000  DensityUltraRare   ice/enormous, elite drones
#   T3Far   27000-30000  DensityUltraRare   ice gigantic, Mauler/Quake
#   DeepVoid 30000+      DensityUltraRare   ultra-sparse catch-all
#
# UsspSector (one ring):
#   ClearNear  0-11000     empty
#   T2Inner  11000-15000   only asteroid ring
#   ClearFar 15000+        empty catch-all
# =============================================================================

