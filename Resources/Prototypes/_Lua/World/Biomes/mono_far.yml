# Outer-ring space biomes (7k–30k+) + density/wreck noise.
# Debris entities: _Lua/World/Debris/ | Wired via worldgen_default.yml
# Inner (standard.yml): 0–7000
#
# Ring map:
#   T1       7000-11000  DensityRare      med/large rock, light wreck, Mono T1
#   T2Inner 11000-15000  DensityRare      large/huge, wreck++, T2 small + LuaTech
#   T2Middle 15000-19000 DensityRarer     large+, ice rare, drone++
#   T2Far   19000-23000  DensityRarer     ice bias, T2 large drones
#   T3Near  23000-27000  DensityUltraRare ice/huge, elite drones
#   T3Far   27000-30000  DensityUltraRare ice gigantic, Mauler/Quake
#   DeepVoid 30000+      DensityUltraRare ultra-sparse catch-all

#region Noise

- type: noiseChannel
  id: DensityRare
  noiseType: Perlin
  fractalLacunarityByPi: 0.666666666
  remapTo0Through1: true
  clippingRanges:
  - 0.4, 0.6
  clippedValue: 25 # BIGGER = SMALLER AMOUNT OF ASTEROIDS
  inputMultiplier: 3
  outputMultiplier: 5000.0
  minimum: 0.25

- type: noiseChannel
  id: DensityRarer
  noiseType: Perlin
  fractalLacunarityByPi: 0.666666666
  remapTo0Through1: true
  clippingRanges:
  - 0.4, 0.6
  clippedValue: 40
  inputMultiplier: 3
  outputMultiplier: 5000.0
  minimum: 0.25

- type: noiseChannel
  id: DensityUltraRare
  noiseType: Perlin
  fractalLacunarityByPi: 0.666666666
  remapTo0Through1: true
  clippingRanges:
  - 0.4, 0.6
  clippedValue: 60
  inputMultiplier: 4
  outputMultiplier: 5000.0
  minimum: 0.25

- type: noiseChannel
  id: WreckRare
  noiseType: Perlin
  fractalLacunarityByPi: 0.666666666
  clippingRanges:
  - 0.0, 0.4
  clippedValue: 0
  remapTo0Through1: true
  inputMultiplier: 16
  outputMultiplier: 0.35

#endregion

#region Base

- type: spaceBiome
  id: MonoFarRingBase
  abstract: true
  parent: NFBiomeBase
  noiseRanges: {}
  chunkComponents:
  - type: DebrisFeaturePlacerController
    densityNoiseChannel: DensityRare

#endregion

