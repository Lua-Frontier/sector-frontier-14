#region Noise

- type: noiseChannel
  id: Density
  noiseType: Perlin
  fractalLacunarityByPi: 0.666666666
  remapTo0Through1: true
  clippingRanges:
    - 0.4, 0.6
  clippedValue: 15.258 # BIGGER = SMALLER AMOUNT OF ASTEROIDS
  inputMultiplier: 1.7647059
  outputMultiplier: 5000.0
  minimum: 0.25

- type: noiseChannel
  id: Carver
  noiseType: Perlin
  fractalLacunarityByPi: 0.666666666
  remapTo0Through1: true
  inputMultiplier: 6

- type: noiseChannel
  id: Wreck
  noiseType: Perlin
  fractalLacunarityByPi: 0.666666666
  clippingRanges:
    - 0.0, 0.4
  clippedValue: 0
  remapTo0Through1: true
  inputMultiplier: 16
  outputMultiplier: 0.35

- type: noiseChannel
  id: DensityRare
  noiseType: Perlin
  fractalLacunarityByPi: 0.666666666
  remapTo0Through1: true
  clippingRanges:
  - 0.4, 0.6
  clippedValue: 25 # BIGGER = SMALLER AMOUNT OF ASTEROIDS
  inputMultiplier: 3
  outputMultiplier: 5000.0
  minimum: 0.25

- type: noiseChannel
  id: DensityRarer
  noiseType: Perlin
  fractalLacunarityByPi: 0.666666666
  remapTo0Through1: true
  clippingRanges:
  - 0.4, 0.6
  clippedValue: 40
  inputMultiplier: 3
  outputMultiplier: 5000.0
  minimum: 0.25

- type: noiseChannel
  id: DensityUltraRare
  noiseType: Perlin
  fractalLacunarityByPi: 0.666666666
  remapTo0Through1: true
  clippingRanges:
  - 0.4, 0.6
  clippedValue: 60
  inputMultiplier: 4
  outputMultiplier: 5000.0
  minimum: 0.25

- type: noiseChannel
  id: WreckRare
  noiseType: Perlin
  fractalLacunarityByPi: 0.666666666
  clippingRanges:
  - 0.0, 0.4
  clippedValue: 0
  remapTo0Through1: true
  inputMultiplier: 16
  outputMultiplier: 0.35

#endregion

#region Base

- type: spaceBiome
  id: NFBiomeBase
  abstract: true
  noiseRanges: {}
  chunkComponents:
  - type: DebrisFeaturePlacerController
    densityNoiseChannel: Density
  - type: NoiseDrivenDebrisSelector
    noiseChannel: Wreck
  - type: NoiseRangeCarver
    ranges:
    - 0.4, 0.6
    noiseChannel: Carver
  - type: PointSetDistanceCarver


- type: spaceBiome
  id: MonoFarRingBase
  abstract: true
  parent: NFBiomeBase
  noiseRanges: {}
  chunkComponents:
  - type: DebrisFeaturePlacerController
    densityNoiseChannel: DensityRare
    safetyZoneRadius: 96

#endregion


#region Inner 0-4000

- type: spaceBiome
