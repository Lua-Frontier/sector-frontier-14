# Random / alternate worldgen presets.
# No AsteroidsFallback / AsteroidSectorFallback / Failsafe.
# Far coverage: Mono rings + DeepVoid, or NFAsteroidsFar + DeepVoid.

#region Mix (inner standard + far rings)

- type: worldgenConfig
  id: WG_Asteroids_Mix_01
  components:
    - type: WorldController
    - type: BiomeSelection
      biomes:
        - AsteroidsStandard
        - MonoWorldgenVeryFarT1
        - MonoWorldgenVeryFarT2Inner
        - MonoWorldgenVeryFarT2Middle
        - MonoWorldgenVeryFarT2Far
        - MonoWorldgenVeryFarT3Near
        - MonoWorldgenVeryFarT3Far
