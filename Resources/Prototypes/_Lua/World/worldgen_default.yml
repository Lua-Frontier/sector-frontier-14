      biomes:
        - AsteroidsStandard
        - MonoWorldgenVeryFarT1
        - MonoWorldgenVeryFarT2Inner
        - MonoWorldgenVeryFarT2Middle
        - MonoWorldgenVeryFarT2Far
        - MonoWorldgenVeryFarT3Near
        - MonoWorldgenVeryFarT3Far
        - MonoWorldgenDeepVoid

- type: worldgenConfig
  id: AsteroidSectorDefault
  components:
    - type: WorldController
    - type: BiomeSelection
      biomes:
        - AsteroidSectorStandard
        - MonoWorldgenVeryFarT1
        - MonoWorldgenVeryFarT2Inner
        - MonoWorldgenVeryFarT2Middle
        - MonoWorldgenVeryFarT2Far
        - MonoWorldgenVeryFarT3Near
        - MonoWorldgenVeryFarT3Far
