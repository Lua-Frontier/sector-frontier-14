- type: worldgenConfig
  id: UsspSectorDefault
  components:
    - type: WorldController
    - type: BiomeSelection
      biomes:
        - UsspSectorClearNear          # 0-11000: empty
        - MonoWorldgenVeryFarT2Inner   # 11000-15000: single asteroid ring
        - UsspSectorClearFar           # 15000+: empty catch-all

- type: worldgenConfig
  id: NebulaSpace
  components:
    - type: WorldController
    - type: AmbientSpaceFieldPlacerController
      minCount: 360
      maxCount: 360
      minDistance: 300
      maxDistance: 29000
      minStationClearance: 300
      minSpacingFactor: 0.9
      minCenterSeparation: 2400
      fieldPrototype: AmbientSpaceFieldNebula

- type: worldgenConfig
  id: CelestialBodySpace
  components:
    - type: WorldController
    - type: SectorCelestialPlacerController
      spawnDistance: 8000

- type: worldgenConfig
  id: BackgroundPlanetSpace
  components:
    - type: WorldController
    - type: SectorBackgroundPlanetPlacerController
      minCount: 2
      maxCount: 4
      minDistance: 6000
      maxDistance: 12000
      planetPrototype: SectorBackgroundPlanet
