#region Антибиотик 2
- type: reagent
  id: Hexabione
  group: Medicine
  name: Гексабион
  desc: Более мощная версия антибиотика, которая может справиться даже с некоторыми устойчивыми штаммами бактерий. Однако, из-за своей силы, он может вызвать более серьёзные побочные эффекты и должен использоваться с осторожностью.
  physicalDesc: reagent-physical-desc-fibrous
  flavor: bitter
  color: "#fdff69"
  recognizable: true
  boilingPoint: 147.0
  meltingPoint: -11.0
  metabolisms:
    Medicine:
      metabolismRate: 0.02
      effects:
      - !type:HealthChange
        damage:
          types:
            Poison: 0.05
  pricePerUnit: 2

- type: reaction
  id: Hexabione
  reactants:
    Antibiotic:
      amount: 1
    SulfuricAcid:
      amount: 1
    Tricordrazine:
      amount: 3
  products:
    Hexabione: 2

#region фунгицид
- type: reagent
  id: CrimsonFungicide
  group: Medicine
  name: Красный фунгицид
  desc: Специальный препарат, разработанный для борьбы с красной спорой и её штаммами. Он содержит мощные антигрибковые компоненты, которые могут замедлить рост спор и помочь организму бороться с инфекцией. Однако, он не является универсальным средством и может быть неэффективным против других видов инфекций.
  physicalDesc: reagent-physical-desc-fibrous
  flavor: мерзко
  color: "#ff6969"
  recognizable: true
  boilingPoint: 147.0
  meltingPoint: -11.0
  metabolisms:
    Medicine:
      metabolismRate: 0.02
      effects:
      - !type:HealthChange
        damage:
          types:
            Cellular: 0.02
  pricePerUnit: 150

- type: reaction
  id: CrimsonFungicide
  reactants:
    Hexabione:
      amount: 1
    Blood:
      amount: 1
    Vinegar:
      amount: 1
    Phalanximine:
      amount: 1
  products:
    CrimsonFungicide: 4

#region рецепт антибиотика
- type: reaction
  id: Antibiotic
  reactants:
    Cornoil:
      amount: 1
    Enzyme:
      amount: 1
    Sugar:
      amount: 1
    Tricordrazine:
      amount: 1
  products:
    Antibiotic: 4

#region споровая кровь
- type: reagent
  id: CrimzonSporeBlood
  group: Biological
  name: Споровая кровь
  desc: Слизеподобное биологическое вещество, в котором можно различить комочки спорового материала. Крайне не рекомендуется к физическому контакту без костюма РХБЗЗ.
  physicalDesc: reagent-physical-desc-necrotic
  flavor: "как угроза всему сектору"
  color: "#5a001e"
  recognizable: true
  boilingPoint: 147.0
  meltingPoint: -11.0
  metabolisms:
    Medicine:
      metabolismRate: 1
      effects:
      - !type:HealthChange
        damage:
          types:
            Cellular: 0.1
  pricePerUnit: 100