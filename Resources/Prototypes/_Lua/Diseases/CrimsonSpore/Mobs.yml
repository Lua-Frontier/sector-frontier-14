#region базы

- type: soundCollection
  id: BiohazardousSounds
  files:
  - /Audio/_NF/Animals/dinosaur_breath1.ogg
  - /Audio/_NF/Animals/dinosaur_breath2.ogg
  - /Audio/_Lua/Diseases/Mobs/BiohazardousMobsSound1.ogg
  - /Audio/_Lua/Diseases/Mobs/BiohazardousMobsSound2.ogg
  - /Audio/_Lua/Diseases/Mobs/BiohazardousMobsSound3.ogg
  - /Audio/_Lua/Diseases/Mobs/BiohazardousMobsSound4.ogg
  - /Audio/_Lua/Diseases/Mobs/BiohazardousMobsSound5.ogg
  - /Audio/_Lua/Diseases/Mobs/BiohazardousMobsSound6.ogg
  - /Audio/_Lua/Diseases/Mobs/BiohazardousMobsSound7.ogg
  - /Audio/_Lua/Diseases/Mobs/BiohazardousMobsSound8.ogg
  - /Audio/_Lua/Diseases/Mobs/BiohazardousMobsSound9.ogg

#тела
- type: body
  id: BiohazardousBodyStructure
  name: BiohazardousBodyStructure
  root: torso
  slots:
    torso:
      part: TorsoAnimal

- type: body
  id: BiohazardousBodyMob
  name: BiohazardousBodyMob
  root: torso
  slots:
    torso:
      part: TorsoAnimal
      connections:
      - legs
    legs:
      part: LegsAnimal
      connections:
      - feet
    feet:
      part: FeetAnimal

- type: body
  id: BiohazardousBodyMob2Handed
  name: BiohazardousBodyMob2Handed
  root: torso
  slots:
    torso:
      part: TorsoAnimal
      connections:
      - legs
      - right_arm
      - left_arm
    right_arm:
      part: RightArmHuman
      connections:
      - right_hand
    left_arm:
      part: LeftArmHuman
      connections:
      - left_hand
    right_hand:
      part: RightHandHuman
    left_hand:
      part: LeftHandHuman
    legs:
      part: LegsAnimal
      connections:
      - feet
    feet:
      part: FeetAnimal

#автоудаление
- type: entity
  id: SelfRemove600
  abstract: true
  components:
  - type: TimedDespawn
    lifetime: 600

#region база всех мобов
- type: entity
  abstract: true
  parent:
  - BaseMob
  - MobMovementSpeedModifierMelee
  - MobStaminaFodder
  - MobDamageable
  - MobCombat
  - NFMobAtmos
  - MobBloodstream
  - MobFlammable
  - MobEnhancedMovement
  - SelfRemove600
  id: BiohazardousMobBase
  components:
  - type: NPCRetaliation
    attackMemoryLength: 30
  - type: Reactive
    groups:
      Flammable: [ Touch ]
      Extinguish: [ Touch ]
    reactions:
    - reagents: [ Vinegar ]
      methods: [ Touch ]
      effects:
      - !type:HealthChange
        scaleByQuantity: true
        damage:
          types:
            Heat: 2
    - reagents: [ CrimsonFungicide ]
      methods: [ Touch ]
      effects:
      - !type:HealthChange
        scaleByQuantity: true
        damage:
          types:
            Heat: 10
  - type: StatusEffects
    allowed:
    - SlowedDown
    - Stutter
    - Electrocution
    - TemporaryBlindness
    - Pacified
    - Drowsiness
    - Adrenaline
  - type: Buckle
  - type: StandingState
  - type: InputMover
  - type: MobMover
  - type: DiseaseProtection
  - type: ZombieImmune
  - type: Hands
  - type: Puller
  - type: SlowOnDamage
    speedModifierThresholds:
      30: 0.5
      50: 0.2
  - type: MobState
    allowedStates:
    - Alive
    - Critical
    - Dead
  - type: MobThresholds
    thresholds:
      0: Alive
      75: Critical
      125: Dead
  - type: Body
    prototype: BiohazardousBodyMob
    requiredLegs: 1
    thermalVisibility: true
  - type: NpcFactionMember
    factions:
    - SimpleHostile
  - type: Carriable # Carrying system from nyanotrasen.
  - type: Tag
    tags:
    - CanPilot
    - FootstepSound
    - DoorBumpOpener
    - CannotSuicide
    - Biohazard
  - type: FTLKnockdownImmune
  - type: TTS
    enabled: true
  - type: ComplexInteraction
  - type: NPCImprintingOnSpawnBehaviour
    whitelist:
      tags:
      - BiohazardLeader
    follow: true
    spawnFriendsSearchRadius: 50
  - type: InfectOnMelee
    disease: CrimsonSpore
    infectChance: 0.3
  - type: SpamEmitSound
    minInterval: 20
    maxInterval: 120
    sound:
      collection: BiohazardousSounds
      params:
        variation: 0.125
  - type: SoundWhileAlive
  - type: MeleeWeapon
    soundHit:
        path: /Audio/Weapons/bladeslice.ogg
    angle: 0
    animation: WeaponArcClaw
    damage:
      types:
        Slash: 15
        Structural: 30
  - type: Butcherable
    spawned:
    - id: CrimsonSporeFlesh1
      amount: 2
  - type: Bloodstream
    bloodReagent: CrimzonSporeBlood
  - type: StaticPrice
    price: 2000

#region HTN мобов
- type: htnCompound
  id: BiohazardousHTNRangedCompound
  branches:
    - tasks:
        - !type:HTNCompoundTask
          task: InnateRangedCombatCompound
    - tasks:
        - !type:HTNCompoundTask
          task: MeleeCombatCompound
    - tasks:
        - !type:HTNCompoundTask
          task: FollowCompound
    - tasks:
        - !type:HTNCompoundTask
          task: IdleCompound

- type: htnCompound
  id: BiohazardousHTNMeleeCompound
  branches:
    - tasks:
        - !type:HTNCompoundTask
          task: MeleeCombatCompound
    - tasks:
        - !type:HTNCompoundTask
          task: FollowCompound
    - tasks:
        - !type:HTNCompoundTask
          task: IdleCompound

- type: htnCompound
  id: BiohazardousHTNHandymanCompound
  branches:
    - tasks:
        - !type:HTNCompoundTask
          task: RangedCombatCompound
    - tasks:
        - !type:HTNCompoundTask
          task: MeleeCombatCompound
    - tasks:
        - !type:HTNCompoundTask
          task: FollowCompound
    - tasks:
        - !type:HTNCompoundTask
          task: IdleCompound


