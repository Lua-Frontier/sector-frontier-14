- type: gamePreset
  id: LuaAdventure
  alias:
    - luaadventure
    - luaadv
    - adventure
  name: lua-adventure-title
  description: lua-adventure-description
  showInVote: true
  supportedMaps: LuaMapPool
  rules:
    - NFAdventure
    - NFBasicStationEventScheduler
    - BluespaceEventScheduler
    - BluespaceSalvageEventScheduler
    - SmugglingEventScheduler
    - NFRoundstartVariation

# Hidden: lightweight preset for integration / local tests (no adventure POI bootstrap).
- type: gamePreset
  id: LuaTest
  alias:
    - luatest
    - test
  name: lua-test-title
  description: lua-test-description
  showInVote: false
  rules:
    - NFBasicStationEventScheduler
    - NFRoundstartVariation
