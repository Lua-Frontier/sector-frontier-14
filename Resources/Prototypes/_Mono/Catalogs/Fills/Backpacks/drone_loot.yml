- type: entity
  parent: RogueSiliconGiftBox
  id: ClothingBackpackDroneLootT1
  name: blackbox data recorder (T1)
  description: Data recorder from a drone. Contains valuable components.
  suffix: Drone Loot
  components:
  - type: RadarBlip
    radarColor: "#FFFF00"
    scale: 1
    requireNoGrid: true
    shape: square
  - type: SpawnItemsOnUse
    items:
    # Money - 30k # removed
    # Bonus Silicons!
    # - id: BlackboxSiliconsSpawnerT1
    #   amount: 1
    #   maxAmount: 2
    # - id: BlackboxSiliconsSpawnerT2
    #   amount: 1
    #   maxAmount: 2
    # Scrap chunks
    - id: ScrapOre100
      amount: 1
    # Material
    - id: SheetPlastitanium1 #Lua: 10>1
      amount: 1 #Lua: 2>1
    # Parts
    - id: SuperCapacitorStockPart
      prob: 0.4 #Lua: 0.8>0.4
      amount: 1 #Lua: 3>1
    - id: SuperMatterBinStockPart
      prob: 0.3 #Lua: 0.6>0.3
      amount: 1 #Lua: 2>1
    - id: PicoManipulatorStockPart
      prob: 0.15 #Lua: 0.3>0.15
      amount: 1 #Lua: 2>1
    - id: SpawnDungeonLootPowerCell
      prob: 0.1 #Lua: 0.5>0.1
    # - id: SpawnDungeonLootPartsEngi #Mono: mostly trash and bloat
    #   amount: 3
    #   prob: 0.25
    # Circuit boards
    - id: SpawnDungeonLootCircuitBoardEngi
      prob: 0.3
    - id: SpawnDungeonLootCircuitBoardScience
      prob: 0.3
    - id: SpawnDungeonLootCircuitBoardSalvage
      prob: 0.3
    - id: SpawnDungeonLootCircuitBoard
      prob: 0.3
    # Flatpacks
    - id: SpawnDungeonLootFlatpacks
      prob: 0.15 #Lua: 0.6>0.15
    # rare shard drop even from T1
    - id: WeaponTurretShardFlatpack
      prob: 0.05 #Lua: 0.5>0.05
    # Research disk, expected value ~30k/drone
    - id: RogueSiliconResearchDisk5000
      prob: 0.3 #Lua: added prob
    - id: RogueSiliconResearchDisk10000
      prob: 0.05  #Lua: added prob
    # - id: RogueSiliconResearchDisk25000  #Lua: removed for balance
    #   prob: 0.6
    # Tech disk
    - id: SpawnLootTechDisksT1
      prob: 0.2  #Lua: 0.5>0.2
    sound:
      path: /Audio/Machines/windoor_open.ogg



