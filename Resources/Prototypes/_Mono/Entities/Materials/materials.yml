# Plastitanium - ported from Monolith

- type: material
  id: Plastitanium
  stackEntity: SheetPlastitanium1
  name: materials-plastitanium
  unit: materials-unit-sheet
  icon: { sprite: /Textures/_Mono/Objects/Materials/plastitanium.rsi, state: plastitanium }
  color: "#5c5c5c"
  price: 4 # 400/sheet

- type: entity
  parent: MaterialBase
  id: SheetPlastitanium
  name: plastitanium
  description: A commonly produced high-strength alloy. Even if its rare here, its extremely abundant in core sectors.
  suffix: Full
  components:
  - type: Sprite
    sprite: _Mono/Objects/Materials/plastitanium.rsi
    state: plastitanium_3
    layers:
    - state: plastitanium_3
      map: ["base"]
  - type: Tag
    tags:
    - Sheet
  - type: Item
    sprite: _Mono/Objects/Materials/plastitanium.rsi
    heldPrefix: plastitanium
  - type: Stack
    stackType: Plastitanium
    count: 100
    baseLayer: base
    layerStates:
    - plastitanium
    - plastitanium_2
    - plastitanium_3
  - type: Material
  - type: Appearance
  - type: PhysicalComposition
    materialComposition:
      Plastitanium: 100

- type: entity
  parent: SheetPlastitanium
  id: SheetPlastitanium1
  suffix: 1
  components:
  - type: Stack
    count: 1

- type: entity
  parent: SheetPlastitanium
  id: SheetPlastitanium10
  suffix: 10
  components:
  - type: Stack
    count: 10

# Enriched uranium products

- type: material
  id: UraniumFissile
  stackEntity: SheetUraniumFissile1
  name: materials-uraniumfissile
  unit: materials-unit-sheet
  icon: { sprite: /Textures/_Mono/Objects/Materials/fissiles.rsi, state: uranium }
  color: "#8a8568"
  price: 250 # 25000/sheet
  properties: # FH edit
    electrical: 4
    thermal: 3
    hard: 5
    density: 7
    chemical: 6
    radioactive: 9
    n_radioactive: 8

- type: entity
  parent: MaterialBase
  id: SheetUraniumFissile
  name: fissile uranium
  description: Ingots of pure, unadulterated weapons-grade uranium isotopes. Expect some trouble with this. DEFINITELY don't keep them close together.
  suffix: Full
  components:
  - type: Sprite
    sprite: /Textures/_Mono/Objects/Materials/fissiles.rsi
    state: uranium_3
    layers:
    - state: uranium_3
      map: ["base"]
  - type: Tag
    tags:
    - Sheet
  - type: Item
    sprite: /Textures/_Mono/Objects/Materials/fissiles.rsi
    heldPrefix: fissile uranium
    inhandVisuals:
      left:
      - state: uranium-inhand-left
      right:
      - state: uranium-inhand-right
  - type: Stack
    stackType: UraniumFissile
    count: 5
    baseLayer: base
    layerStates:
    - uranium
    - uranium_2
    - uranium_3
  - type: Material
  - type: RadiationReceiver
  - type: RadiationSource
    intensity: 1.2
    slope: 1.3
  - type: ChainRadiation
    baseIntensity: 1.2
    coefficient: 0.15 # critical mass at 6
    explosionThreshold: 15
    totalIntensity: 15000
    intensitySlope: 3000
    maxIntensity: 6000
  - type: Appearance
  - type: PhysicalComposition
    materialComposition:
      UraniumFissile: 100
  - type: Explosive
    explosionType: Radioactive
    totalIntensity: 20.0
    intensitySlope: 5
    maxIntensity: 4
  - type: ThermalSignature
  - type: PassiveThermalSignature
    signature: 1500000
  - type: PointLight
    color: "#8a8568"
    radius: 2
    energy: 1
  - type: DamageOnLand
    damage:
      types:
        Radiation: 5

- type: entity
  parent: SheetUraniumFissile
  id: SheetUraniumFissile1
  suffix: 1
  components:
  - type: Stack
    count: 1

