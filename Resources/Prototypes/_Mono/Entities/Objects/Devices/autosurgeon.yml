- type: entity
  parent: BaseAutosurgeon
  id: AutosurgeonDermalArmorPDV
  name: nanotrasen autosurgeon (E-SAPI dermal armor)
  description: Implants an array of E-SAPI armor plates into the body. Makes you more vulnerable to heat and shock, but more resistant to bullets.
  components:
  - type: AutoSurgeon
    targetBodyPart: Torso
    componentsToUser:
    - type: DamageProtectionBuff
      modifiers:
        dermal:
          id: DermalArmorCybernetics
          coefficients:
            Shock: 1.25
            Heat: 1.1
            Piercing: 0.85
            Blunt: 0.9
            Slash: 0.9

- type: entity
  parent: BaseNFFlatpack
  id: AutosurgeonDermalArmorPDVFlatpack
  name: nanotrasen autosurgeon (E-SAPI dermal armor) flatpack
  description: A flatpack used for constructing a nanotrasen autosurgeon.
  components:
  - type: Flatpack
    entity: AutosurgeonDermalArmorPDV
  - type: StaticPrice
    price: 2500
  - type: Sprite
    layers:
    - state: medical_lathe

