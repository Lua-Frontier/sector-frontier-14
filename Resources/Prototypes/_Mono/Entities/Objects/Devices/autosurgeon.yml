- type: entity
  parent: BaseAutosurgeon
  id: AutosurgeonRightMantisBladeMieyo
  name: syndicate autosurgeon (right mantis blade)
  description: Implants a covert deployable mantis blade into your right arm.
  components:
  - type: AutoSurgeon
    targetBodyPart: Arm
    targetBodyPartSymmetry: Right
    componentsToPart:
    - type: MantisBladeArm
      actionProto: ActionToggleRightMantisBlade

- type: entity
  parent: BaseNFFlatpack
  id: AutosurgeonRightMantisBladeMieyoFlatpack
  name: syndicate autosurgeon (right mantis blade) flatpack
  description: A flatpack used for constructing a syndicate autosurgeon.
  components:
  - type: Flatpack
    entity: AutosurgeonRightMantisBladeMieyo
  - type: StaticPrice
    price: 2500
  - type: Sprite
    layers:
    - state: medical_lathe

