# Circuitboards ported for scrap_processor loot (boards + MachineBoard.prototype targets elsewhere)

- type: entity
  id: OrganHarvesterMachineCircuitboard
  parent: BaseMachineCircuitboard
  name: organ harvester machine board
  description: A machine printed circuit board for an organ harvester.
  components:
  - type: Sprite
    state: security
  - type: MachineBoard
    prototype: MachineOrganHarvester
    componentRequirements:
      BoneSaw:
        amount: 1
        defaultPrototype: SawElectric
    stackRequirements:
      Glass: 1
      Steel: 3
    tagRequirements:
      MotorEconomy1:
        amount: 2
        defaultPrototype: MotorEconomy1
      ArmorPlateEconomy1:
        amount: 1
        defaultPrototype: ArmorPlateEconomy1

- type: entity
  id: MedicalBiofabMachineBoard
  parent: BaseMachineCircuitboard
  name: medical biofab machine board
  description: A machine printed circuit board for a medical biofab.
  components:
    - type: Sprite
      state: medical
    - type: MachineBoard
      prototype: MedicalBiofabricator
      requirements:
        MatterBin: 2
        Manipulator: 2
      tagRequirements:
        ComponentBrickEconomy1:
          amount: 2
          defaultPrototype: ComponentBrickEconomy1
        MotorEconomy1:
          amount: 1
          defaultPrototype: MotorEconomy1

- type: entity
  id: CrystallizerMachineCircuitboard
  parent: BaseMachineCircuitboard
  name: crystallizer machine board
  description: A machine printed circuit board for a crystallizer.
  components:
  - type: MachineBoard
    prototype: Crystallizer
    requirements:
      Capacitor: 2
      Manipulator: 4
      MatterBin: 4
    stackRequirements:
      Steel: 5
      Glass: 5
    tagRequirements:
      ComponentBrickEconomy1:
        amount: 2
        defaultPrototype: ComponentBrickEconomy1
      MicroprocessorEconomy1:
        amount: 4
        defaultPrototype: MicroprocessorEconomy1
      MotorEconomy1:
        amount: 1
        defaultPrototype: MotorEconomy1
