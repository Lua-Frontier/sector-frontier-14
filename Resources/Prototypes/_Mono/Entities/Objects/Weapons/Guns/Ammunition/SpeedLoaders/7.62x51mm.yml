- type: entity
  id: SpeedLoader762x51mmFMJ
  categories: [ HideSpawnMenu ]
  name: "speed loader (7.62x51mm FMJ)"
  parent: BaseItem
  components:
  - type: Tag
    tags:
      - SpeedLoaderRifle
  - type: SpeedLoader
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
        - Cartridge762x51mmFMJ
    capacity: 5
    proto: Cartridge762x51mmFMJ
  - type: Sprite
    sprite: _Mono/Objects/Weapons/Guns/Ammunition/SpeedLoaders/7.62x39mm/7.62x39mm_speed_loader.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-5
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 6
    zeroVisible: false
  - type: Appearance
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
        ents: []

- type: entity
  id: SpeedLoader762x51mmEmpty
  name: "speed loader (7.62x51mm any)"
  parent: SpeedLoader762x51mmFMJ
  suffix: empty
  components:
  - type: BallisticAmmoProvider
    proto: null
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
