  abstract: true
  components:
  - type: Tag
    tags:
    - Grenade
  - type: Item
    size: Small
  - type: Sprite


# Cannon Balls

- type: entity
  id: BaseCannonBall
  name: base cannon ball
  parent: [BaseItem, BaseC3PirateContrabandNoValue] # Frontier: BaseMajorContraband<BaseC3PirateContrabandNoValue
  abstract: true
  components:
  - type: Tag
    tags:
    - CannonBall
  - type: Item
    size: Small
  - type: Sprite

- type: entity
  id: CannonBall
  name: cannonball
  suffix: Rogue
  parent: BaseCannonBall
  components:
  - type: CartridgeAmmo
    proto: BulletCannonBall
    deleteOnSpawn: true
  - type: Sprite
    sprite: _Mono/Objects/Weapons/Guns/Ammunition/Explosives/explosives.rsi
    state: ball

- type: entity
  id: CannonBallGrapeshot
  name: grapeshot
  suffix: Rogue
  parent: BaseCannonBall
  components:
  - type: CartridgeAmmo
    proto: Pellet12_gaugeGrapeshotSpread
    deleteOnSpawn: true
  - type: Sprite
    sprite: _Mono/Objects/Weapons/Guns/Ammunition/Explosives/explosives.rsi
    state: grapeshot

- type: entity
  id: CannonBallGlassshot
  name: glassshot
  suffix: Rogue
  parent: BaseCannonBall
  components:
  - type: CartridgeAmmo
    proto: Pellet12_gaugeGlassSpread
    deleteOnSpawn: true
  - type: Sprite
    sprite: _Mono/Objects/Weapons/Guns/Ammunition/Explosives/explosives.rsi
    state: glassshot

# MPSSM

- type: entity
  id: CartridgeMPSSMMissile
  name: MPSSM ASM-19 missile tube
  parent: [BaseItem, BaseC2ContrabandUnredeemable] # Frontier: BaseMajorContraband<BaseC2ContrabandUnredeemable
  description: A missile tube designed for the MPSSM launcher. Fires a ship-tracking EMP-HE missile with a lockon range of 1.2km
  components:
  - type: Tag
    tags:
    - MPSSMMissile
  - type: Item
    size: Large
  - type: CartridgeAmmo
    proto: ShipMissileASM19
    deleteOnSpawn: true
  - type: Sprite
    sprite: _Mono/Objects/Weapons/Guns/Ammunition/Explosives/explosives.rsi
    state: mpssm
  - type: StaticPrice
    price: 1500
  - type: EmpDescription
    range: 2
    energyConsumption: 2700000
    disableDuration: 20

- type: entity
  id: CartridgeMPSSMHEAT
  name: MPSSM Mk.248 rocket tube
  parent: [BaseItem, BaseC2ContrabandUnredeemable] # Frontier: BaseMajorContraband<BaseC2ContrabandUnredeemable
  description: A missile tube designed for the MPSSM launcher. Fires an unguided HEAT rocket for precise structural destruction and AT usage.
  components:
  - type: Tag
    tags:
    - MPSSMMissile
  - type: Item
    size: Large
  - type: CartridgeAmmo
    proto: RocketMk248
    deleteOnSpawn: true
  - type: Sprite
    sprite: _Mono/Objects/Weapons/Guns/Ammunition/Explosives/explosives.rsi
    state: mpssm-he
  - type: StaticPrice
    price: 1500
