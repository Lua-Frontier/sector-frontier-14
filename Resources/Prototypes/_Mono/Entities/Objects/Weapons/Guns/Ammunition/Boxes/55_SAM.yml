- type: entity
  abstract: true
  parent: [BaseItem, RecyclableItemCardboard]
  id: BaseAmmoBox55_SAM
  name: ammunition box (.55 SAM)
  components:
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
        - Cartridge55_SAM
    proto: Cartridge55_SAM
    capacity: 24
  - type: Item
    size: Small
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    sprite: _Mono/Objects/Weapons/Guns/Ammunition/Boxes/357_magnum.rsi
  - type: Appearance
  - type: EmitSoundOnPickup
    sound:
      path: /Audio/_Goobstation/Items/handling/ammobox_pickup.ogg
  - type: EmitSoundOnDrop
    sound:
      path: /Audio/_Goobstation/Items/handling/ammobox_drop.ogg
  - type: EmitSoundOnLand
    sound:
      path: /Audio/_Goobstation/Items/handling/ammobox_drop.ogg

- type: entity
  parent: BaseAmmoBox55_SAM
  id: AmmoBox55_SAM
  categories: [ HideSpawnMenu ]
  name: ammunition box (.55 SAM)
  components:
  - type: BallisticAmmoProvider
    proto: Cartridge55_SAM
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]

- type: entity
  parent: BaseAmmoBox55_SAM
  id: AmmoBox55_SAMBig
  categories: [ HideSpawnMenu ]
  name: big ammunition box (.55 SAM)
  suffix: Big
  components:
  - type: Item
    shape:
    - 0,0,1,1
  - type: BallisticAmmoProvider
    capacity: 72
    proto: Cartridge55_SAM
  - type: Sprite
    layers:
    - state: base-b
      map: ["enum.GunVisualLayers.Base"]
  - type: Appearance
