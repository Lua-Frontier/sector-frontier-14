- type: entity
  name: Big Leady (4 gauge)
  parent: [BaseWeaponShotgun, BaseGunWieldable, BaseC3SyndicateContraband]
  id: WeaponShotgunBigLeady
  description: A massive 4 gauge (23x75mm) shotgun made to kill what any caliber bellow autocannon cant.
  suffix: Need balance test #Lua
  components: # intend for BigLeady to have tighter choke for slower fire rate and/or manual cycling
  - type: Item
    size: Normal
#    shape: # comment from _LUa
#    - 0,0,4,1
    shape: #Lua
    - 0,0,3,1
    sprite: _Mono/Objects/Weapons/Guns/Shotguns/BigLeady_inhands_64x.rsi # Frontier: add _Mono prefix
  - type: Sprite
    sprite: _Mono/Objects/Weapons/Guns/Shotguns/BigLeady.rsi
  - type: Clothing
    sprite: _Mono/Objects/Weapons/Guns/Shotguns/BigLeady.rsi
  - type: GunRequiresWield #remove when inaccuracy on spreads is fixed
  - type: Gun
    examineCaliber: gun-examine-caliber-4g #Lua
    soundGunshot:
      path: /Audio/_Mono/Weapons/Guns/SmallArms/Gunshots/bigshotgun_fire.ogg
    fireRate: 2.5 #Lua 1<2.5
  - type: Tag
    tags:
    - WeaponShotgunBigLeady
  - type: BallisticAmmoProvider # Goobstation
    whitelist:
      tags:
      - ShellShotgun23x75mmBuckshot
    capacity: 6
    proto: ShellShotgun23x75mmBuckshot
    soundInsert:
      path: /Audio/Weapons/Guns/MagIn/shotgun_insert.ogg
  - type: StaticPrice
    price: 5000
    vendPrice: 42300

- type: entity
  name: Big Johnny (4 gauge)
  parent: [BaseWeaponShotgun, BaseGunWieldable, BaseC1Contraband]
  id: WeaponShotgunBigJohnny
  description: A massive 4 gauge (23x75mm) shotgun made to kill what any caliber bellow autocannon cant. This one is outfitted with various tactical additions and is made for CQC at the cost of low ammo capacity.
  suffix: Need balance test #Lua
  components: # intend for BigLeady to have tighter choke for slower fire rate and/or manual cycling
  - type: Item
    size: Normal
#    shape: # comment from _Lua
#    - 0,0,4,1
    shape: #Lua
    - 0,0,3,1
    sprite: _Mono/Objects/Weapons/Guns/Shotguns/BigJohnny_inhands_64x.rsi
  - type: Sprite
    sprite: _Mono/Objects/Weapons/Guns/Shotguns/BigJohnny.rsi
    layers:
    - state: icon
    - map: ["opticAttachment"]
  - type: Clothing
    sprite: _Mono/Objects/Weapons/Guns/Shotguns/BigJohnny.rsi
  - type: GunRequiresWield #remove when inaccuracy on spreads is fixed
  - type: Gun
    examineCaliber: gun-examine-caliber-4g #Lua
    soundGunshot:
      path: /Audio/_Mono/Weapons/Guns/SmallArms/Gunshots/bigshotgun_fire.ogg
    fireRate: 2.5 #Lua 1<2.5
  - type: Tag
    tags:
    - WeaponShotgunBigLeady
  - type: BallisticAmmoProvider # Goobstation
    whitelist:
      tags:
      - ShellShotgun23x75mmBuckshot
    capacity: 6 #Lua 3<6
    proto: ShellShotgun23x75mmBuckshot
    soundInsert:
      path: /Audio/Weapons/Guns/MagIn/shotgun_insert.ogg
  - type: ItemSlots
    slots:
      attachment_optic:
        insertSound: /Audio/Items/screwdriver2.ogg
        ejectSound: /Audio/Items/screwdriver2.ogg
        startingItem: GunAttachmentOpticErebus2x
        priority: 0
        whitelist:
          tags:
          - MonoOpticErebusRailmount
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
        ents: []
      attachment_optic: !type:ContainerSlot
  - type: ESAttachableGun
    slots:
    - name: es-gun-attachments-slot-name-optic
      containerId: attachment_optic
      whitelist:
        tags:
        - MonoOpticErebusRailmount
  - type: ActivatableUI
    key: enum.ESAttachableGunUiKey.Key
    verbOnly: true
    verbText: es-gun-attachments-verb-text
  - type: UserInterface
    interfaces:
      enum.ESAttachableGunUiKey.Key:
        type: ESGunAttachmentBui
  - type: Appearance
  - type: ESItemMapper
    mappings:
      opticAttachment:
      - containerId: attachment_optic
        state: optic2x
        whitelist:
          tags:
          - MonoOptic2x
      - containerId: attachment_optic
        state: optic4x
        whitelist:
          tags:
          - MonoOptic4x
      - containerId: attachment_optic
        state: optic8x
        whitelist:
          tags:
          - MonoOptic8x
  - type: StaticPrice
    price: 5000
    vendPrice: 42300

