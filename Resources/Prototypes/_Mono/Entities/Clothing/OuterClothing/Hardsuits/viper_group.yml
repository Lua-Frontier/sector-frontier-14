- type: entity
  parent: [ClothingOuterHardsuitBase, BaseC3PirateContrabandPremium]
  id: ClothingOuterHardsuitViperGroupStandard
  name: JACKAL mk.II viper hardsuit
  description: A combat hardsuit adorned with signature markings of the Viper Group. The armor is remarkably flexible for the protection it offers.
  suffix: Pirate, Medium, Special
  components:
  - type: Sprite
    sprite: _Lua/Clothing/OuterClothing/SCHardsuits/medium_special.rsi
  - type: Item
    size: Huge
  - type: Clothing
    sprite: _Lua/Clothing/OuterClothing/SCHardsuits/medium_special.rsi
  - type: PressureProtection
    highPressureMultiplier: 0.05
    lowPressureMultiplier: 1000
  - type: ExplosionResistance
    damageCoefficient: 0.5
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.67
        Slash: 0.5
        Piercing: 0.5
        Heat: 0.67
        Radiation: 0.5
        Caustic: 0.5
  - type: StaminaDamageResistance
    coefficient: 0.5
  - type: ClothingSpeedModifier
    walkModifier: 0.9
    sprintModifier: 0.9
  - type: HeldSpeedModifier
  - type: ToggleableClothing
    requiredSlot: outerclothing
    blockUnequipWhenAttached: false
    replaceCurrentClothing: true
    clothingPrototypes:
      head: ClothingHeadHelmetHardsuitViperGroupStandard
      helmetcover: ClothingHeadHelmetCoverBlock
      helmetattachment: ClothingHeadHelmetAttachmentBlock
  - type: StaticPrice
    price: 1500
    vendPrice: 4000

