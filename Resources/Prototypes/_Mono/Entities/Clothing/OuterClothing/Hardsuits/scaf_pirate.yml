- type: entity
  parent: [ClothingOuterHardsuitBase, BaseC3PirateContraband]
  id: ClothingOuterHardsuitPirateScaf
  name: pirate SCAF hardsuit
  description: A (probably stolen) SCAF suit painted red with white stripes. The armor feels degraded, but lighter.
  suffix: Pirate, Heavy, Standart
  components:
  - type: Sprite
    sprite: _Lua/Clothing/OuterClothing/SCHardsuits/heavy_standart.rsi
  - type: Item
    size: Huge
  - type: Clothing
    sprite: _Lua/Clothing/OuterClothing/SCHardsuits/heavy_standart.rsi
  - type: PressureProtection
    highPressureMultiplier: 0.05
    lowPressureMultiplier: 1000
  - type: ExplosionResistance
    damageCoefficient: 0.45
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.65
        Slash: 0.65
        Piercing: 0.55
        Heat: 0.7
        Radiation: 0.5
        Caustic: 0.9
  - type: StaminaDamageResistance
    coefficient: 0.3
  - type: ClothingSpeedModifier
    walkModifier: 0.95
    sprintModifier: 0.95
  - type: HeldSpeedModifier
  - type: ToggleableClothing
    requiredSlot: outerclothing
    blockUnequipWhenAttached: false
    replaceCurrentClothing: true
    clothingPrototypes:
      head: ClothingHeadHelmetHardsuitPirateScaf
      helmetcover: ClothingHeadHelmetCoverBlock
      helmetattachment: ClothingHeadHelmetAttachmentBlock
  - type: StaticPrice
    price: 750
    vendPrice: 2500
