- type: entity
  abstract: true
  id: MonoEnergyShieldClothing
  components:
  - type: PersonalShield
    shield:
      maxCharge: 300
      regenRate: 3
      spinupTime: 1
      breakCooldown: 15
      powerDraw: 0.5
  # No ItemToggle here — Lua suits share ItemToggle with ToggleClothing (phase cloak).
  - type: Battery
    maxCharge: 40
    startingCharge: 40
  - type: BatterySelfRecharger
    autoRecharge: true
    autoRechargeRate: 4
  - type: ActionGrant
    actions:
    - ActionActivatePersonalShield
  - type: ItemActionGrant
    actions:
    - ActionActivatePersonalShield
