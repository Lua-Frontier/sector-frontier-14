# Synced from Monolith energy projectiles
- type: entity
  id: ShipCerberusPlasma
  name: plasma projectile
  parent: BaseBulletTrigger
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Radiation: 20
        Structural: 120
        Heat: 60
  - type: Sprite
    sprite: _Mono/Objects/SpaceArtillery/plasmashot.rsi
    layers:
    - state: plasmashot
  - type: Ammo
    muzzleFlash: MuzzleFlashEffectPlasmaPulser
  - type: ShipWeaponProjectile
  - type: RadarBlip
    radarColor: "#C92BCC"
    scale: 2.5
    shape: triangle
  - type: TimedDespawn
    lifetime: 10
  - type: PointLight
    color: "#FF0040"
  - type: ExplodeOnTrigger
  - type: Explosive
    explosionType: Default
    totalIntensity: 30
    intensitySlope: 6
    maxIntensity: 6
- type: entity
  id: ShipPlasmaProjectileScylla
  name: plasma projectile
  parent: BaseBulletTrigger
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Radiation: 15
        Structural: 35
        Heat: 65
  - type: Sprite
    sprite: _Impstation/Objects/Weapons/Guns/Projectiles/energybolts.rsi
    layers:
    - state: mediumstun
    scale: 1.2, 1.2
  - type: ShipWeaponProjectile
  - type: RadarBlip
    radarColor: "#00e5ff"
    scale: 1.45
    shape: arrow
  - type: TimedDespawn
    lifetime: 2.1
  - type: PointLight
    color: "#00e5ff"
  - type: ExplodeOnTrigger
  - type: Explosive
    explosionType: Default
    totalIntensity: 16
    intensitySlope: 4
    maxIntensity: 4

