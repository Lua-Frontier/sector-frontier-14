# region Laser Hitscans

# Phalanx
- type: entity
  parent: ApolloLaser
  id: PrometheusLaser
  categories: [ HideSpawnMenu ]
  components:
  - type: HitscanBasicDamage
    damage:
     types:
       Heat: 150
       Structural: 500
  - type: HitscanRadarSignature
    radarColor: "#5d46e2"
  - type: HitscanSpawnEntity
    spawnedEntity: PrometheusExplosion
  - type: HitscanBasicRaycast
    maxDistance: 1000

# Reaper
- type: entity
  parent: BasicHitscan
  id: SunderLaser
  categories: [ HideSpawnMenu ]
  components:
  - type: HitscanBasicVisuals
    muzzleFlash:
      sprite: _Mono/Objects/Weapons/Guns/Projectiles/lasers.rsi
      state: proton_muzzle
    travelFlash:
      sprite: _Mono/Objects/Weapons/Guns/Projectiles/lasers.rsi
      state: proton_beam
    impactFlash:
      sprite: _Mono/Objects/Weapons/Guns/Projectiles/lasers.rsi
      state: proton_impact
  - type: HitscanRadarSignature
    radarColor: "#f29705"
  - type: HitscanBasicDamage
    damage:
     types:
      Heat: 35
      Structural: 150
  - type: HitscanSpawnEntity
    spawnedEntity: SunderExplosion
  - type: HitscanBasicRaycast
    maxDistance: 900

# Flayer
- type: entity
  parent: BasicHitscan
  id: GaussRound
  categories: [ HideSpawnMenu ]
  components:
  - type: HitscanBasicVisuals
    muzzleFlash:
      sprite: _Mono/Objects/Weapons/Guns/Projectiles/lasers.rsi
      state: gauss_muzzle
    travelFlash:
      sprite: _Mono/Objects/Weapons/Guns/Projectiles/lasers.rsi
      state: gauss_trail
    impactFlash:
      sprite: _Mono/Objects/Weapons/Guns/Projectiles/lasers.rsi
      state: gauss_impact
  - type: HitscanRadarSignature
    radarColor: "#FFFFFF"
    lifeTime: 0.1
  - type: HitscanBasicDamage
    damage:
     types:
      Piercing: 25
      Heat: 5
      Structural: 75
  - type: HitscanBasicRaycast
    maxDistance: 500

# Hitscan Explosions
- type: entity
  id: SunderExplosion
  categories: [ HideSpawnMenu ]
  components:
  - type: TriggerOnSpawn
  - type: ExplodeOnTrigger
  - type: Explosive
    explosionType: Default
    totalIntensity: 45
    intensitySlope: 5
    maxIntensity: 5
- type: entity
  id: PrometheusExplosion
  categories: [ HideSpawnMenu ]
  components:
  - type: TriggerOnSpawn
  - type: ExplodeOnTrigger
  - type: Explosive
    explosionType: Default
    totalIntensity: 80
    intensitySlope: 8
    maxIntensity: 8
