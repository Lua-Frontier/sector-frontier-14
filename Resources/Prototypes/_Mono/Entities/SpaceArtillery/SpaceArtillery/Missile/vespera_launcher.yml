- type: entity
  categories: [ ShuttleGun ]
  id: WeaponTurretVespera
  name: ADMP-50 VESPERA Missile Rack
  parent:
  - BallisticArtilleryUnanchorableCartridge
  - BallisticArtilleryTier2HP
  - ConstructibleMachine
  description: A rapid-fire swarm missile rack manufactured by Aetherion Dynamics. Saturates targets with guided warheads to overwhelm defenses. Limited ammo, but deadly. Can be remotely activated or linked to a GCS.
  components:
  - type: StaticPrice
    price: 1500
  - type: Sprite
    sprite: _Mono/Objects/ShuttleWeapons/vespera.rsi
    layers:
    - state: space_artillery
  - type: Appearance
  - type: FireControlRotate
  - type: AmmoCounter
  - type: WirelessNetworkConnection
    range: 500
  - type: GunSignalControl
  - type: Gun
    fireRate: 16
    recoil: 1
    minAngle: 4
    maxAngle: 35
    burstCooldown: 20
    burstFireRate: 16
    shotsPerBurst: 13
    selectedMode: Burst
    availableModes: Burst
    shootThermalSignature: 2000000 # ~4.9km if firing continuously
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/rocket_launcher.ogg
    soundEmpty:
      path: /Audio/Weapons/click.ogg
  - type: SpaceArtillery
    powerChargeRate: 200
    powerUsePassive: 750
    powerUseActive: 0
  - type: Actions
  - type: BallisticAmmoProvider
    infiniteUnspawned: true
    proto: MissileCartridge50mmHE
    capacity: 78
    whitelist:
      tags:
      - MissileCartridge50mm
    soundInsert:
      path: /Audio/Weapons/Guns/MagIn/batrifle_magin.ogg
  - type: RadarBlip
    radarColor: "#FCBA03"
    scale: 2
    visibleFromOtherGrids: true
  - type: ShipGunType
    shipType: Missile
  - type: ShipGunClass
    shipClass: Medium
  - type: ShipRepairable
    repairTime: 30
    repairCost: 100
  - type: Machine
    board: WeaponTurretVesperaCircuitboard
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
      machine_board: !type:Container
      machine_parts: !type:Container
