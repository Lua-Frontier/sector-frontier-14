- type: entity
  categories: [HideSpawnMenu, ShuttleGun]
  id: VanykCartridge
  name: 150mm HEAT missile
  description: An individual ASM-150 HEAT missile used in the Vanyk.
  parent: BaseGrenade
  components:
  - type: Tag
    tags:
    - VanykCartridge
    - 150mmShell # intentional, silly + interesting hidden feature stemming from funny shared caliber
  - type: Item
    size: Huge
  - type: CartridgeAmmo
    proto: ShipMissileASM150
    muzzleFlash: null
  - type: Sprite
    sprite: _Mono/Objects/Weapons/Guns/Ammunition/Explosives/generic_cartridges.rsi
    layers:
    - state: vanyk
      map: ["enum.AmmoVisualLayers.Base"]
  - type: Appearance
  - type: SpentAmmoVisuals
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 250
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:ExplodeBehavior
  - type: Explosive
    explosionType: Default
    maxIntensity: 100
    intensitySlope: 3
    totalIntensity: 6
  - type: ExplodeOnTrigger
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Metallic

- type: entity
  categories: [HideSpawnMenu, ShuttleGun]
  id: VanykCartridgeUnguided
  name: 150mm HEAT unguided missile
  parent: VanykCartridge
  components:
  - type: Tag
    tags:
    - VanykCartridge
    - VanykCartridgeUnguided
    - 150mmShell
  - type: Item
    size: Huge
  - type: CartridgeAmmo
    proto: ShipMissileASM150Unguided
