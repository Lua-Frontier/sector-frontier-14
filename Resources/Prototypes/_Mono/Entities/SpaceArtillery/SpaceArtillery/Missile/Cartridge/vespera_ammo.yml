- type: entity
  categories: [HideSpawnMenu, ShuttleGun]
  id: MissileCartridge50mmHE
  name: 50mm HE missile
  description: An individual ADMP-50 high-explosive missile for a 50mm missile launcher.
  parent: BaseGrenade
  components:
  - type: Tag
    tags:
    - MissileCartridge50mm
  - type: Item
    size: Huge
  - type: CartridgeAmmo
    proto: MissileProjectile50mmHE
    muzzleFlash: null
  - type: Sprite
    sprite: _Mono/Objects/SpaceArtillery/mini_rocket.rsi
    layers:
    - state: mini-rocket
      map: ["enum.AmmoVisualLayers.Base"]
  - type: Appearance
  - type: SpentAmmoVisuals
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 250
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:ExplodeBehavior
  - type: Explosive
    explosionType: Default
    maxIntensity: 100
    intensitySlope: 3
    totalIntensity: 3
  - type: ExplodeOnTrigger
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Metallic
