# AK570

- type: entity
  categories: [ ShuttleGun ]
  id: WeaponTurretAK570
  name: AK570 57mm autocannon
  parent:
  - BallisticArtilleryCartridge
  - BallisticArtilleryTier2HP
  - ConstructibleMachine
  suffix: Medium, T2
  description: A dual-barrel, heavy 57mm autocannon firing general-purpose APHE rounds, effective for sustained fire against medium targets. Can be remotely activated or linked up to a GCS.
  components:
  - type: StaticPrice
    price: 650
  - type: Sprite
    sprite: _Mono/Objects/ShuttleWeapons/artillery.rsi
    layers:
    - state: space_artillery
    - state: fcs-unshaded
      shader: unshaded
    scale: 1, 1
  - type: Appearance
  - type: FireControlRotate
  - type: AmmoCounter
  - type: AutoShootGun
  - type: GunSignalControl
  - type: WirelessNetworkConnection
    range: 500
  - type: Gun
    damageModifier: 1.1
    fireRate: 3
    recoil: 10 # 2/5x
    projectileSpeed: 320
    minAngle: 0
    maxAngle: 3
    burstCooldown: 0.6
    burstFireRate: 10
    shotsPerBurst: 2
    selectedMode: Burst
    availableModes: Burst
    shootThermalSignature: 2000000 # ~4.5km signature if firing continuously
    soundGunshot:
      path: /Audio/_Mono/Weapons/Guns/Gunshots/120mm_mortar.ogg
    soundEmpty:
      path: /Audio/Weapons/Guns/Empty/lmg_empty.ogg
  - type: BatterySelfRecharger
    autoRecharge: true
    autoRechargeRate: 125
  - type: SpaceArtillery
    powerChargeRate: 125
    powerUsePassive: 600
    powerUseActive: 0
  - type: Actions
  - type: BallisticAmmoProvider
    infiniteUnspawned: true
    proto: 57mmCartridgeHE
    capacity: 600
    whitelist:
      tags:
      - 57mmCartridge
    soundInsert:
      path: /Audio/Weapons/Guns/MagIn/batrifle_magin.ogg
  - type: RadarBlip
    radarColor: "#FF0000"
    scale: 1.5
    visibleFromOtherGrids: true
  - type: ShipGunType
    shipType: Ballistic
  - type: ShipGunClass
    shipClass: Medium
  - type: ShipRepairable
    repairTime: 15
    repairCost: 60
  - type: Machine
    board: WeaponTurretAK570Circuitboard
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
      machine_board: !type:Container
      machine_parts: !type:Container

# Dravon
- type: entity
  categories: [ ShuttleGun ]
  id: WeaponTurretDravon
  name: ADBP-7 DRAVON 90mm Autocannon
  parent:
  - BallisticArtilleryCartridge
  - BallisticArtilleryTier2HP
  - ConstructibleMachine
  suffix: Medium, T2
  description: A single-barrel autocannon made by Aetherion Dynamics. Medium artillery piece with high impact but relatively low fire rate, firing HEAT shells to damage ship armor and systems. Can be remotely activated or linked up to a GCS.
  components:
  - type: StaticPrice
    price: 900
  - type: Sprite
    sprite: _Mono/Objects/ShuttleWeapons/dravon.rsi
    layers:
    - state: space_artillery
  - type: Appearance
  - type: FireControlRotate
  - type: AmmoCounter
  - type: AutoShootGun
  - type: GunSignalControl
  - type: WirelessNetworkConnection
    range: 500
  - type: Gun
    damageModifier: 4
    fireRate: 1.5
    recoil: 10 # 2/5x
    projectileSpeed: 300
    minAngle: 0
    maxAngle: 2
    shootThermalSignature: 2000000 # ~3.5km signature if firing continuously
    soundGunshot:
      path: /Audio/_Mono/Weapons/Guns/Gunshots/mortar.ogg
    soundEmpty:
      path: /Audio/Weapons/Guns/Empty/lmg_empty.ogg
  - type: SpaceArtillery
    powerChargeRate: 220
    powerUsePassive: 750
    powerUseActive: 0
  - type: Actions
  - type: BallisticAmmoProvider
    infiniteUnspawned: true
    proto: 90mmCartridgeHE
    capacity: 400
    whitelist:
      tags:
      - 90mmCartridge
    soundInsert:
      path: /Audio/Weapons/Guns/MagIn/batrifle_magin.ogg
  - type: RadarBlip
    radarColor: "#FF0000"
    scale: 1.5
    visibleFromOtherGrids: true
  - type: ShipGunType
    shipType: Ballistic
  - type: ShipGunClass
    shipClass: Medium
  - type: ShipRepairable
    repairTime: 15
    repairCost: 60
  - type: Machine
    board: WeaponTurretDravonCircuitboard
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
      machine_board: !type:Container
      machine_parts: !type:Container
