- type: entity
  categories: [HideSpawnMenu, ShuttleGun]
  id: 90mmCartridgeHE
  name: cartridge (90mm HE)
  parent: BaseCartridge
  components:
  - type: Tag
    tags:
    - Cartridge
    - 90mmCartridge
  - type: CartridgeAmmo
    proto: 90mmBulletHE
  - type: Sprite
    sprite: _Mono/Objects/SpaceArtillery/shells.rsi
    layers:
    - state: 90mmHE
      map: ["enum.AmmoVisualLayers.Base"]
  - type: Appearance
  - type: SpentAmmoVisuals
  - type: StaticPrice
    price: 1
  - type: Explosive
    explosionType: Default
    maxIntensity: 100
    intensitySlope: 3
    totalIntensity: 1
  - type: ExplodeOnTrigger
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Metallic

