- type: entity
  categories: [HideSpawnMenu, ShuttleGun]
  id: 57mmCartridgeHE
  name: cartridge (57mm HE)
  parent: BaseCartridge
  components:
  - type: Tag
    tags:
    - Cartridge
    - 57mmCartridge
  - type: CartridgeAmmo
    proto: 57mmBulletHE
    muzzleFlash: MuzzleFlashEffectAk570
  - type: Sprite
    sprite: _Mono/Objects/SpaceArtillery/shells.rsi
    layers:
    - state: 57mmHE
      map: ["enum.AmmoVisualLayers.Base"]
  - type: Appearance
  - type: StaticPrice
    price: 1
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 250
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:ExplodeBehavior
  - type: Explosive
    explosionType: Default
    maxIntensity: 100
    intensitySlope: 3
    totalIntensity: 1
  - type: ExplodeOnTrigger
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Metallic

