- type: entity
  categories: [HideSpawnMenu, ShuttleGun]
  id: 20mmCartridge
  name: cartridge (20mm Solid)
  parent: BaseCartridge
  components:
  - type: Tag
    tags:
    - Cartridge
    - 20mmCartridge
  - type: CartridgeAmmo
    proto: 20mmBullet
  - type: Sprite
    sprite: _Mono/Objects/Weapons/Guns/Ammunition/Explosives/generic_cartridges.rsi
    layers:
    - state: 20mm
      map: ["enum.AmmoVisualLayers.Base"]
  - type: Appearance
  - type: SpentAmmoVisuals
  - type: StaticPrice
    price: 1
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 250
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:ExplodeBehavior
  - type: Explosive
    explosionType: Default
    maxIntensity: 100
    intensitySlope: 3
    totalIntensity: 0.25
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Metallic

