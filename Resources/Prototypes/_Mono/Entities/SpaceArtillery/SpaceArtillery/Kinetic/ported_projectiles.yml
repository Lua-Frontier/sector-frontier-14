# 220mm
- type: entity
  id: ShipLeviathanProjectile
  name: LEVIATHAN 520mm projectile
  parent: BaseBulletTrigger
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Structural: 12000
        Blunt: 2000
  - type: Sprite
    sprite: _Mono/Objects/SpaceArtillery/630_armorpiercing_shell_casing.rsi
    layers:
    - state: base-projectile
    scale: 2, 2
  - type: Ammo
    muzzleFlash: null
  - type: ShipWeaponProjectile
  - type: RadarBlip
    scale: 4
    requireNoGrid: true
    shape: star
  - type: TimedDespawn
    lifetime: 7.2 #3.2km - Its 520mm after all.
  - type: PointLight
    color: "#fc5a03"
  - type: ExplodeOnTrigger
  - type: Explosive
    explosionType: Default
    totalIntensity: 1900
    intensitySlope: 8
    maxIntensity: 90
    maxTileBreak: 6
  - type: GatheringProjectile

# Drone
- type: entity
  id: ShipFragmentProjectile
  parent: ShipShardProjectile
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Structural: 200
        Blunt: 60
        Piercing: 10
  - type: Explosive
    explosionType: Default
    totalIntensity: 6
    intensitySlope: 2
    maxIntensity: 2
    maxTileBreak: 1
  - type: ProjectileKnockback
    knockback: 25
