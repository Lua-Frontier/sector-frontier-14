- type: entity
  categories: [ ShuttleGun ]
  id: WeaponTurretFlare
  name: GS-002 Sunny flare system
  parent:
  - BallisticArtilleryUnanchorableCartridge
  - BallisticArtilleryTier2HP
  - ConstructibleMachine
  description: A relatively small flare flinging hardpoint used to fool heat seeking missiles. Also good for search and rescue.
  suffix: T1
  components:
  - type: StaticPrice
    price: 750
  - type: Sprite
    sprite: _Mono/Objects/ShuttleWeapons/flare.rsi
    layers:
    - state: space_artillery
  - type: Appearance
  - type: AmmoCounter
  - type: WirelessNetworkConnection
    range: 700
  - type: GunSignalControl
  - type: Gun
    fireRate: 3
    recoil: 1
    projectileSpeed: 75
    minAngle: 50
    maxAngle: 300
    burstCooldown: 15
    burstFireRate: 3
    shotsPerBurst: 15
    selectedMode: Burst
    availableModes: Burst
    shootThermalSignature: 10000 # relatively low for a shipgun, ~693m signature if firing continuously - Used because it's harmless.
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/rocket_launcher.ogg
    soundEmpty:
      path: /Audio/Weapons/click.ogg
  - type: SpaceArtillery
    powerChargeRate: 50
    powerUsePassive: 75
    powerUseActive: 0
  - type: Actions
  - type: BallisticAmmoProvider
    infiniteUnspawned: true
    proto: SunnyCartridge
    capacity: 30
    whitelist:
      tags:
      - SunnyCartridge
    soundInsert:
      path: /Audio/Weapons/Guns/MagIn/batrifle_magin.ogg
  - type: RadarBlip
    radarColor: "#ff9d00"
    scale: 0.7
    visibleFromOtherGrids: true
  - type: ShipGunType
    shipType: Other
  - type: ShipGunClass
    shipClass: Light
  - type: ShipRepairable
    repairTime: 25
    repairCost: 100
  - type: Machine
    board: WeaponTurretFlareCircuitboard
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
      machine_board: !type:Container
      machine_parts: !type:Container
