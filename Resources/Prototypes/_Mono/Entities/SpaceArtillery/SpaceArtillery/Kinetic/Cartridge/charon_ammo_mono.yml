# Synced Mono Charon ammo variants
- type: entity
  id: CharonApheSlugAmmo
  name: M381 CHARON 280mm 26.5kg APHE slug cartridge
  description: An all-in-one package containing plasma gas accelerant and a high-density tungsten slug loaded with a small explosive payload. Cheap, devastating, and long ranged.
  parent: BaseGrenade
  components:
  - type: Tag
    tags:
    - CharonSlug
  - type: Item
    size: Huge
  - type: CartridgeAmmo
    proto: ShipRailgunProjectileAphe
    deleteOnSpawn: true
    muzzleFlash: null
  - type: Sprite
    sprite: _Mono/Objects/Weapons/Guns/Ammunition/Explosives/charonslug.rsi
    layers:
    - state: railgun_aphe
      map: ["enum.AmmoVisualLayers.Base"]
  - type: Appearance
  - type: SpentAmmoVisuals

