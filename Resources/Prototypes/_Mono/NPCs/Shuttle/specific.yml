# BrokenAi faction targeting — do not attack other BrokenAi grids
- type: utilityQuery
  id: NearbyShuttleTargetsBrokenAi
  query:
  - !type:NearbyNonFactionShuttlesQuery
    blacklist:
      tags:
      - ShuttleAIIgnore
    excludedCompanies:
    - BrokenAi
  considerations:
  - !type:TargetInverseDistanceCon
    curve: !type:QuadraticCurve
      slope: 1
      exponent: 1
      yOffset: 0
      xOffset: 0

- type: utilityQuery
  id: NearbyShuttleTargetsBrokenAiLongRange
  query:
  - !type:NearbyNonFactionShuttlesQuery
    range: 8000
    blacklist:
      tags:
      - ShuttleAIIgnore
    excludedCompanies:
    - BrokenAi
  considerations:
  - !type:TargetInverseDistanceCon
    curve: !type:QuadraticCurve
      slope: 1
      exponent: 1
      yOffset: 0
      xOffset: 0

- type: htnCompound
  id: DroneCompoundMedusa
  branches:
  - tasks:
    - !type:HTNPrimitiveTask
      operator: !type:UtilityOperator
        proto: NearbyShuttleTargetsBrokenAi
    - !type:HTNCompoundTask
      task: ShuttleAttackDroneCompoundMedusa

- type: htnCompound
  id: ShuttleAttackDroneCompoundMedusa
  branches:
  - preconditions:
    - !type:KeyExistsPrecondition
      key: TargetCoordinates
    tasks:
    - !type:HTNPrimitiveTask
      operator: !type:ShipMoveToOperator
        shutdownState: PlanFinished
        removeKeyOnFinish: false
        inRangeMaxSpeed: null
        range: 250
        rangeTolerance: 50
        brakeThreshold: 1 # braking is for wusses
        targetKey: TargetCoordinates
        mode: Orbit
    - !type:HTNPrimitiveTask
      operator: !type:ShipFireGunsOperator
        shutdownState: TaskFinished
        removeKeyOnFinish: false
        leadingAccuracy: 0.2
        targetKey: TargetCoordinates
      services:
      - !type:UtilityService
        id: TargetsService
        proto: NearbyShuttleTargetsBrokenAi
        key: Target
        coordinatesKey: TargetCoordinates

