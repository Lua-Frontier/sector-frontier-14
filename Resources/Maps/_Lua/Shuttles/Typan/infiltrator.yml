      content: >-
        [head=3]СИН[/head]

        ═════════════════════════════════════

        [bold]Документация Шаттла[/bold]

        ═════════════════════════════════════

        [head=6]ШАТТЛ "INFILTRATOR" — ТЯЖЁЛЫЙ ДЕСАНТНО-УДАРНЫЙ ШАТТЛ[/head]


        [color=#888888]Гриф секретности: ОГРАНИЧЕННЫЙ ДОСТУП | Архивный номер: INF-MK2-09[/color]


        [bold]Описание модели:[/bold]

        "Infiltrator" Mk.II — модернизированная версия тяжелобронированного десантного шаттла "Infiltrator".

        Новая линейка моделей получила переработанную внутреннюю планировку, сделавшую судно значительно удобнее в эксплуатации, а также улучшенный комплекс вооружения по сравнению с предыдущей версией, вместе с укреплением корпуса.


        [bold]Вооружение:[/bold]

        [bold]2 × CYREXA (220мм)[/bold] — основные орудия крупного калибра для подавления укреплённых целей.

        [bold]2 × KARGIL (203мм)[/bold] — орудия среднего калибра огневой поддержки.

        [bold]2 × автопушки DRAVON[/bold] — малокалиберное-ариллерийское орудие для интенсивного огня.

        [bold]2 × автопушки PEACEKEEPER[/bold] — дополнительное вооружение для защиты от абордажа.


        [bold]Бронирование:[/bold]

        Сохраняет высокий уровень бронирования, характерный для всей линейки "Infiltrator", что позволяет шаттлу действовать в условиях плотного огневого контакта без критической потери боеспособности.


        [bold]Тактическое назначение:[/bold]

        Mk.II предназначен для проведения прямых наступательных операций, включая пробития обороны противника и высадки десанта под огневым прикрытием собственных орудий.


        Абстрагируясь от боевых операций - данный шаттл хорошо подходит для исследования дальнего космоса добычи руды, и транпортировки грузов в неблагоприятных условиях.


        [bold]Статус:[/bold]

